أو الجد أو القبيلة).\n٣) الملك المطلق إذا لم يكن منازع.\n٤) الترجمة إذا اتخذه القاضي مترجماً.\n٥) ما شهد به قبل العمى إن كان المشهود له وعليه معروفي الاسم والنسب (ساقط في بعض النسخ).\n٦) على المضبوط عنده: كأن يُقرّ شخص في أذنه بنحو طلاق أو مال لشخص معروف الاسم والنسب فيتعلق به ويضبطه حتى يشهد عليه عند قاض.\n\nشهادة التهمة:\n• لا تُقبل شهادة جارٍّ لنفسه نفعاً، لقوله تعالى: «ذلكم أقسط عند الله وأقوم للشهادة وأدنى ألا ترتابوا» (والريبة حاصلة)، وقوله ﷺ: «لا تُقبل شهادة خصم ولا ظنين» (الظنين: المتهم).\n• ولا دافع عنها ضرراً: كشهادة عاقلة بفسق شهود قتل يحملونه من خطأ أو شبه عمد، وشهادة غرماء مفلس بفسق شهود دين آخر ظهر عليه.\n\nشهادة الحسبة:\n• الحسبة: احتساب الأجر على الفعل عند الله. وكيفيتها: أن يأتي الشهود إلى القاضي فيقولوا: نحن نشهد على فلان بكذا فأحضره لنشهد عليه. فإن ابتدؤوا وقالوا: فلان زنى فهم قذفة."}]}], "questions": [{"q": "الخلع لغة مشتق من:", "options": ["خلع الثوب", "خلع النعل", "القلع", "الخلاء"], "answer": 0, "explain": "مشتق من خلع الثوب لأن كل زوج لباس للآخر.", "unit": "s1"}, {"q": "الخلع شرعاً هو:", "options": ["فرقة بين الزوجين بعوض مقصود يرجع لجهة الزوج", "فرقة بلا عوض", "رجعة بعد الطلاق", "فسخ بسبب العيب"], "answer": 0, "explain": "فرقة بين الزوجين ولو بلفظ المفاداة بعوض مقصود راجع لجهة الزوج.", "unit": "s1"}, {"q": "الخلع جائز على:", "options": ["عوض مجهول", "عوض معلوم", "غير عوض", "عوض محرم"], "answer": 1, "explain": "والخلع جائز على عوض معلوم.", "unit": "s1"}, {"q": "إذا كان عوض الخلع مجهولاً فإن الخلع:", "options": ["يبطل", "يقع بائناً بمهر المثل", "يقع رجعياً", "لا يقع"], "answer": 1, "explain": "يقع بائناً بمهر المثل.", "unit": "s1"}, {"q": "المرأة التي ورد في شأنها حديث الخلع في البخاري هي امرأة:", "options": ["ثابت بن قيس", "عمر بن الخطاب", "أبي بكر", "عبد الله بن سلام"], "answer": 0, "explain": "حديث امرأة ثابت بن قيس: اقبل الحديقة وطلقها تطليقة.", "unit": "s1"}, {"q": "حكم طلب الزوجة الخلع هو:", "options": ["واجب", "مكروه", "محرم دائماً", "مستحب"], "answer": 1, "explain": "جائز لكنه مكروه لما فيه من قطع النكاح المطلوب شرعاً.", "unit": "s1"}, "أربع نسوة"], "answer": 0, "explain": "احتياطاً للصوم.", "unit": "s17"}, {"q": "لا تُقبل شهادة الأعمى فيما يتعلق بالبصر إلا في:", "options": ["كل شيء", "موضعين", "عشرة مواضع", "ستة مواضع منها الموت والنسب والملك المطلق"], "answer": 3, "explain": "لجواز اشتباه الأصوات.", "unit": "s17"}, {"q": "من مواضع قبول شهادة الأعمى:", "options": ["الزنا", "القتل", "الموت والنسب والترجمة", "السرقة"], "answer": 2, "explain": "لأنها تثبت بالتسامع أو لا تحتاج إلى معاينة.", "unit": "s17"}, {"q": "لا تُقبل شهادة:", "options": ["صديق", "جارّ لنفسه نفعاً ودافع عنها ضرراً", "عدل صادق", "أخ لأخيه"], "answer": 1, "explain": "للتهمة، لقوله ﷺ: «لا تُقبل شهادة خصم ولا ظنين».", "unit": "s17"}, {"q": "شهادة الحسبة هي:", "options": ["أن يأتي الشهود فيقولوا: نحن نشهد على فلان بكذا فأحضره", "أن يشهدوا بلا دعوى ثم يتراجعوا", "شهادة في الأموال فقط", "شهادة النساء"], "answer": 0, "explain": "فإن ابتدؤوا وقالوا: فلان زنى فهم قذفة.", "unit": "s17"}]}, "fiqh_hanafi": {"units": [{"id": "n1", "title": "كتاب النكاح (ص 7–11)", "lessons": [{"title": "تعريف النكاح", "body": "• النكاح لغةً: الضم والجمع.\n• في الشرع: عبارة عن ضم وجمع مخصوص، وهو الوطء. لأن الزوجين حالة الوطء يجتمعان وينضم كل واحد إلى صاحبه حتى يصيرا كالشخص الواحد.\n• وقد يُستعمل في العقد مجازاً لأنه يؤول إلى الضم، وإنما هو حقيقة في الوطء.\n• وعُرّف أيضاً بأنه عقد يفيد ملك المتعة قصداً.\n• فمتى أُطلق النكاح في الشرع يراد به الوطء، لقوله ﷺ: «ولدتُ من نكاح»، وقوله: «اصنعوا كل شيء إلا النكاح» أي الوطء الحلال.\n• وإنما يُفهم منه العقد بقرينة، كقوله تعالى: «فانكحوهن بإذن أهلهن» (لأن الوطء لا يتوقف على إذن الأهل)، وقوله: «فانكحوا ما طاب لكم من النساء مثنى وثلاث ورباع» (لأن العقد هو الذي يختص بالعدد)، وقوله ﷺ: «لا نكاح إلا بشهود» (لأن الشهود لا يكونون على الوطء)."}, {"title": "حكم النكاح ودليله وأحواله", "body": "الحكم العام للنكاح: عقد مشروع مستحب مندوب إليه، ثبتت شرعيته:\n١) بالكتاب: قوله تعالى: «وأنكحوا الأيامى منكم»، وقوله: «فانكحوا ما طاب لكم من النساء».\n٢) بالسنة: قوله ﷺ: «تناكحوا تكثروا فإني مباهٍ بكم الأمم يوم القيامة»، وقوله: «النكاح سنتي فمن رغب عن سنتي فليس مني».\n٣) الإجماع: انعقد إجماع الأمة على شرعيته.\n\nأحوال النكاح:\n١) حالة الاعتدال: سنة مؤكدة مرغوبة.\n٢) حالة التوقان (شدة الميل للجماع وخوف الوقوع في الزنا إن لم يتزوج): واجب. لأن حالة التوقان يخاف على نفسه الوقوع في محرم الزنا والنكاح يمنعه، والامتناع عن الحرام فرض.\n٣) حالة الخوف من الجور (الظلم للزوجة): مكروه كراهة تحريمية. فإن تيقن الجور حُرّم.\n• لأن النكاح إنما شُرع لتحصين النفس ومنعها من الزنا، وتحصيل الثواب المحتمل بالولد الذي يعبد الله ويوحده. فمن خاف الجور أو الميل إن تزوج أثم بذلك وارتكب المنهيات، فتنعدم في حقه المصالح لرجحان المفاسد."}, {"title": "ركن النكاح وما ينعقد به", "body": "• ركن النكاح: الإيجاب والقبول، لأن العقد يوجد بهما، وركن الشيء ما يوجد به كأركان البيت. (الإيجاب: ما صدر أولاً من أحد المتعاقدين، والقبول: ما صدر ثانياً.)\n• ينعقد بلفظين ماضيين: كقوله زوجتُك، وقول الآخر تزوجتُ أو قبلتُ. لأن لفظ الماضي يُستعمل للإنشاء شرعاً للحاجة، ولا خلاف فيه.\n• أو بلفظين أحدهما ماضٍ والآخر مستقبل: كقوله زوّجني، فيقول زوجتُك. لأن قوله زوّجني توكيل، والوكيل يتولى طرفي النكاح.\n• وينعقد بلفظ النكاح والتزويج لأنهما صريحان فيه. والقاعدة: كل لفظ يصح لتمليك الأعيان مطلقاً ينعقد به النكاح."}, {"title": "الشهود في النكاح", "body": "• لا ينعقد نكاح المسلمين إلا بحضور رجلين أو رجل وامرأتين، ولا بد في الشهود من صفة الإسلام، ولا تُشترط العدالة.\n• الدليل: قوله ﷺ: «لا نكاح إلا بشهود»، وروي عن ابن عباس عن النبي ﷺ: «الزانية التي تُنكح نفسها بغير بينة».\n• صفة الشهود: قال أصحابنا (أبو حنيفة وصاحباه): كل من ملك القبول بنفسه انعقد العقد بحضوره ومن لا فلا. فلا بد من العقل والبلوغ لأن الصبي والمجنون ليسا من أهل الشهادة ولا يملكون القبول بأنفسهم. ولا بد من الإسلام في نكاح المسلمين.\n• ويجوز بشهادة رجل وامرأتين اعتباراً بالشهادة على المال، وهذا عند الحنفية لأنهم جعلوا النكاح كالمال، أما الشافعية فقالوا: لا تجوز شهادة النساء في النكاح.\n• ينعقد النكاح بحضور الفاسقين: لأن النص لم يفصّل، ولأن الفاسق يملك القبول بنفسه كالعدل، ولأنه تحمّل، والفسق يؤثر في الشهادة للتهمة عند الأداء لا عند التحمل.\n• وينعقد بشهادة العميان: لأنهم من أهل الشهادة، ويملكون القبول بأنفسهم.\n• المحدود في القذف إن تاب فهو من أهل الشهادة على النكاح، وكذلك إن لم يتب."}]}, {"id": "n2", "title": "محرمات النكاح (ص 12–17)", "lessons": [{"title": "أقسام المحرمات وتحريم القرابة", "body": "• المحرمات بكتاب الله وسنة نبيه ﷺ أقسام: بالقرابة، وبالصهرية، وبالرضاع، وبالجمع، وبتعلق حق الغير، وبالكفر، وبالطلقات الثلاث.\n\nأولاً: المحرمات بالقرابة (سبعة أنواع):\nالأمهات وإن علون، والبنات وإن سفلن، والأخوات من أي جهة، والخالات والعمات جميعهن، وبنات الأخ وبنات الأخت وإن سفلن.\n• فهن محرمات بنص الكتاب نكاحاً ووطئاً ودواعيه على التأبيد، قال تعالى: «حُرمت عليكم أمهاتكم وبناتكم وأخواتكم وعماتكم وخالاتكم وبنات الأخ وبنات الأخت».\n• وما عداهن من القرابات محللات لقوله تعالى: «وأُحل لكم ما وراء ذلكم»."}, {"title": "المحرمات بالصهرية والرضاع", "body": "ثانياً: المحرمات بالصهرية (أربعة):\nأ) أم امرأته: فتحرم بنفس العقد على البنت، قال تعالى: «وأمهات نسائكم» مطلقاً.\nب) بناتها (الربيبة): ولا تحرم البنت حتى يدخل بالأم، قال تعالى: «فإن لم تكونوا دخلتم بهن فلا جناح عليكم». وتحرم الربيبة وإن لم تكن في حجر الزوج، وذكر الحجر في الآية خرج مخرج العادة لا للشرط. وكذا بنات بنت المرأة وبنات ابنها.\nج) حليلة الابن وابن الابن وابن البنت وإن سفل: حرام على الأب، دخل الابن بها أو لم يدخل، لقوله تعالى: «وحلائل أبنائكم الذين من أصلابكم». فلا يدخل فيه حليلة الابن المتبنّى.\nد) حليلة الأب والجد وإن علا: حرام على الابن، قال تعالى: «ولا تنكحوا ما نكح آباؤكم من النساء».\n• العقد الذي يترتب عليه التحريم: هو العقد الصحيح دون الفاسد.\n• والزنا يوجب حرمة المصاهرة عند الحنفية: فمن زنى بامرأة أو وطئها بشبهة حرمت عليه أصولها وفروعها، وتحرم الموطوءة على أصول الواطئ وفروعه.\n\nثالثاً: المحرمات بالرضاع: يحرم بالرضاع كل من تحرم بالقرابة والصهرية، لقوله تعالى: «وأمهاتكم اللاتي أرضعنكم وأخواتكم من الرضاعة»، وقال ﷺ: «يحرم من الرضاع ما يحرم من النسب»."}, {"title": "المحرمات بالجمع", "body": "رابعاً: المحرمات بالجمع:\nأ) لا يحل للرجل أن يجمع بين أكثر من أربع نسوة، لقوله تعالى: «مثنى وثلاث ورباع». ورُوي أن غيلان الدَّيلمي أسلم وتحته عشر نسوة فأمره ﷺ أن يمسك منهن أربعاً ويفارق الباقي.\nب) لا يجوز الجمع بين الأختين، لقوله تعالى: «وأن تجمعوا بين الأختين»، وقال ﷺ: «من كان يؤمن بالله واليوم الآخر فلا يجمعنّ ماءه في رحم أختين».\nج) لا يُجمع بين المرأة وعمتها أو خالتها، لقوله ﷺ: «لا تُنكح المرأة على عمتها ولا على خالتها، ولا على بنت أخيها ولا على بنت أختها، فإنكم إذا فعلتم ذلك فقد قطعتم أرحامهن».\n\nمسائل:\n• لو تزوج أختين في عقد واحد: فسد نكاحهما، لعدم أولوية جواز نكاح إحداهما.\n• لو تزوج أختين في عقدتين ولا يدري أيتهما أولى: فرّق القاضي بينه وبينهما، ولهما نصف المهر بينهما لجهالة المستحقة.\n• فإن تزوجهما على التعاقب فسد نكاح الأخيرة ويفارقها.\n• إذا طلق امرأته لا يجوز أن يتزوج أختها ولا رابعة حتى تنقضي عدتها، سواء كان الطلاق بائناً أو رجعياً، لبقاء نكاح الأولى من وجه.\n• يجوز الجمع بين امرأة وابنة زوج كان لها من قبله، لأنه لا قرابة بينهما."}, {"title": "المحرمات بتعلق حق الغير وبالكفر وبالطلقات الثلاث", "body": "خامساً: المحرمات بتعلق حق الغير:\n• لا يجوز أن يتزوج زوجة الغير ولا معتدته، لقوله ﷺ: «ملعون من سقى ماءه زرع غيره»، ولأنه يفضي إلى اشتباه الأنساب.\n• لا يتزوج حاملاً من غيره، إلا الزانية: فإن فعل لا يطؤها حتى تضع. وقال أبو يوسف: النكاح فاسد لأنه حمل محترم. ولأبي حنيفة ومحمد: أن الامتناع لئلا يسقي ماءه زرع غيره في ثابت النسب، ولا حرمة للزاني.\n\nسادساً: المحرمات بالكفر:\n• لا يجوز نكاح المجوسيات والوثنيات، قال تعالى: «ولا تنكحوا المشركات حتى يؤمنّ». وقال ﷺ في المجوس: «سنّوا بهم سنة أهل الكتاب غير ناكحي نسائهم ولا آكلي ذبائحهم».\n• ويجوز تزويج الكتابيات، لقوله تعالى: «والمحصنات من الذين أوتوا الكتاب من قبلكم».\n\nسابعاً: المحرمات بالطلقات الثلاث:\n• تحرم المرأة على من طلقها ثلاثاً حتى تنكح زوجاً غيره، ثم إذا حدث بينهما طلاق جاز لها أن تتزوج الأول، لقوله تعالى: «فإن طلقها فلا تحل له من بعد حتى تنكح زوجاً غيره»، وعليه الإجماع.\n\nنكاح المُحرم:\n• يجوز أن يتزوج المُحرم حلالاً: لأن النبي ﷺ تزوج ميمونة وهو محرم. والمحظور الوطء ودواعيه لا العقد، وهو محمل ما روي أنه ﷺ نهى أن ينكح المحرم."}]}, {"id": "n3", "title": "نكاح المتعة والنكاح المؤقت (ص 18–19)", "lessons": [{"title": "نكاح المتعة والنكاح المؤقت", "body": "• نكاح المتعة والنكاح المؤقت باطل.\n• أما المتعة: فلقوله تعالى: «والذين هم لفروجهم حافظون إلا على أزواجهم أو ما ملكت أيمانهم»، وهذه ليست زوجة لانقطاع أحكام الزوجية من الإرث، وانقطاع الحل بغير طلاق وبلا مانع.\n• وقد صح عن علي رضي الله عنه أن النبي ﷺ «حرّم يوم خيبر متعة النساء ولحوم الحمر الأهلية»، وما رُوي في إباحتها ثبت نسخه بإجماع الصحابة، وصح أن ابن عباس رجع إلى قولهم.\n• وأما النكاح المؤقت: فلأنه أتى بمعنى المتعة، والعبرة للمعاني، وسواء طالت المدة أو قصرت لأن التأقيت هو المبطل.\n\nالصورة:\n• نكاح المتعة: أن يقول الرجل للمرأة: متّعيني نفسك بكذا من الدراهم مدة كذا، فتقول: متّعتك نفسي، أو: أتمتع بك. ولا بد من لفظ التمتع فيه.\n• النكاح المؤقت: أن يتزوجها بشهادة شاهدين مدة معلومة، كقوله: تزوجتك مدة شهر فتقول قبلت.\n• وقال زفر: النكاح المؤقت صحيح ويبطل التأقيت، لأن النكاح لا يبطل بالشرط الفاسد. والجواب أنه بمعنى المتعة وقد جاءت النصوص بتحريمه."}]}, {"id": "n4", "title": "عبارة النساء معتبرة في النكاح (ص 20–31)", "lessons": [{"title": "عبارة النساء في النكاح ومذاهب الحنفية", "body": "المقصود بالفصل: هل يجوز للمرأة أن تزوّج نفسها بنفسها، أو توكّل في تزويجها غير وليها، أو تكون ولية أو وكيلة عن غيرها في عقد الزواج؟\n\nالمتن: عبارة النساء معتبرة في النكاح، حتى لو زوّجت المرأة الحرة العاقلة البالغة نفسها جاز، وكذلك لو زوّجت غيرها بالولاية أو الوكالة، وكذا إذا وكّلت غيرها في تزويجها، أو زوّجها غيرها فأجازت.\n\nمذاهب الحنفية:\n١) قول أبي حنيفة وزفر والحسن وظاهر الرواية عن أبي يوسف: عبارة النساء معتبرة، فيصح نكاح المرأة العاقلة البالغة التي زوّجت نفسها.\n٢) قول محمد (في إحدى الروايتين): لا يجوز إلا بإجازة الولي، فإن ماتا قبلها لا يتوارثان، ولا يقع طلاقه ولا ظهاره، ووطؤه حرام.\n• فإن امتنع الولي من الإجازة: ذكر الطحاوي عن محمد أن القاضي يجدد العقد بينهما، وذكر هشام عن محمد: فإن لم يجزه الولي أجزته أنا، وكان يومئذ قاضياً.\n• وروي عن محمد أنه رجع إلى قول أبي حنيفة قبل موته بسبعة أيام، وحكى الهندواني أن امرأة جاءت إليه قبل موته بثلاثة أيام وذكرت أن وليها لا يزوجها إلا بمال كثير، فقال لها: اذهبي فزوّجي نفسك.\n• وعن أبي يوسف في غير رواية الأصول مثل قول محمد الأول. وفي رواية: إن زوّجت نفسها من كفء لا يتوقف، وإن كان من غير كفء يتوقف على إجازة الولي."}, {"title": "أدلة المانعين وأدلة الحنفية", "body": "أدلة من منع عبارة النساء:\n١) من السنة: ما روت عائشة عن النبي ﷺ: «أيما امرأة نكحت نفسها بغير إذن وليها فنكاحها باطل باطل باطل»، وقوله ﷺ: «لا نكاح إلا بولي».\n٢) من المعقول: أنها كانت مولّىً عليها قبل البلوغ في حق العقد والنفاذ لعدم رأيها، وما حدث لها بالبلوغ من الرأي والعقل ناقص، فثبتت لها إحدى الولايتين وهي الانعقاد دون النفاذ، عملاً بالشبهين.\n• ووجه الفسخ إذا لم يجز الولي: أن النكاح إلى الأولياء بالحديث فيتوقف على إجازته ويرتد برده.\n\nأدلة الحنفية (قول أبي حنيفة):\n١) قوله تعالى: «فإن طلقها فلا تحل له من بعد حتى تنكح زوجاً غيره»، وقوله: «فلا جناح عليكم فيما فعلن في أنفسهن بالمعروف» (في آيتي العدة). أضاف النكاح والفعل إليهن، وذلك يدل على صحة عبارتهن ونفاذها.\n٢) حديث ابن عباس: أن فتاة جاءت إلى النبي ﷺ فقالت: إن أبي زوجني من ابن أخ له ليرفع خسيسته وأنا كارهة، فقال لها: «أجيزي ما صنع أبوك». فقالت: لا رغبة لي فيما صنع أبي، قال: «فاذهبي فانكحي من شئت». فقالت: أردت أن أعلم النساء أن ليس للآباء من أمور بناتهم شيء. ووجه الاستدلال: قوله «فانكحي من شئت»، وأنه لم ينكر عليها قولها، وأن قوله «أجيزي» يدل على أن عقده غير نافذ عليها.\n٣) في البخاري: أن خنساء بنت خذام أنكحها أبوها وهي كارهة فردّه النبي ﷺ.\n٤) روي أن امرأة زوّجت بنتها برضاها فجاء الأولياء فخاصموها إلى علي رضي الله عنه فأجاز النكاح.\n٥) من المعقول: الولاية في النكاح أسرع ثبوتاً منها في المال، والنكاح خالص حقها حتى يُجبر الولي عليه عند طلبها وبذله لها، وهي أهل لاستيفاء حقوقها، إلا أن الكفاءة حق الأولياء فلا تقدر على إسقاط حقهم."}, {"title": "الرد على المانعين", "body": "رد الحنفية على الأحاديث التي استدل بها المانعون:\n١) أنها معارضة بما رويناه، فإما أن يرجع إلى القياس وهو لنا على المال والرجل.\n٢) أو يوفّق بين الحديثين، فيحمل ما رويناه على الحرة العاقلة البالغة، وما رويتموه على الأمة، إذ ورد في بعض الروايات: «أيما أَمة نكحت نفسها»، فيُحمل المطلق على المقيد.\n٣) أو يُرجّح، والترجيح معنا لأن ما رويناه سلم من الطعن وما رووه مطعون فيه، فقد حُكي عن يحيى بن معين أن ثلاثة أحاديث لم تثبت عن النبي ﷺ: «كل مسكر حرام»، و«من مس ذكره فليتوضأ»، و«لا نكاح إلا بولي وشاهدي عدل».\n\nوجوه أخرى في الرد:\n• المرأة وليّة نفسها فلا يكون نكاحاً بلا ولي.\n• الحديث الآخر من رواية سليمان بن يسار عن الزهري، وقد ضعفه البخاري، وروي أن مالكاً وابن جريج سألا الزهري عن هذا الحديث فلم يعرفه، والراوي إذا أنكر الخبر دل على بطلانه.\n• من مذهب عائشة رضي الله عنها جواز النكاح بعبارة النساء، فإنها زوّجت بنت أخيها عبد الرحمن حين غاب بالشام، وذلك دليل على عدم صحة الحديث أو على نسخه.\n• قولهم «الحادث لها رأي ناقص»: المعتبر في باب الولاية مطلق العقل والبلوغ دون الزيادة والنقصان، فإن الناس يتفاوتون في العقل تفاوتاً فاحشاً. وكم من النساء أوفر عقلاً وأسدّ رأياً من كثير من الرجال.\n• وفي اعتبار ذلك حرج عظيم هو حرج التمييز بين الناس، فعُلم أن المعتبر أصل البلوغ والعقل وقد وُجدا في المرأة."}, {"title": "إجبار البكر البالغة واستئذانها", "body": "• لا إجبار على البكر البالغة في النكاح، لقوله ﷺ: «البكر تُستأمر في نفسها، فإن صمتت فهو إذنها، وإن أبت فلا جواز عليها»، وقال ﷺ: «شاوروا النساء في أبضاعهن». قالت عائشة: يا رسول الله إن البكر لتستحيي! قال: «إذنها صماتها».\n• السنة للولي أن يستأمر البكر قبل النكاح، ويذكر لها الزوج فيقول: إن فلاناً يخطبك أو يذكرك، فإذا سكتت فقد رضيت. فإذا زوّجها من غير استئمار فقد أخطأ السنة.\n• ولما أراد النبي ﷺ أن يزوّج فاطمة من علي دنا إلى خدرها فقال: «إن علياً يذكرك»، فسكتت فزوّجها.\n\nمسائل:\n• لو ضحكت فهو إذن لأنه دليل الرضا، إلا إذا كان على وجه الاستهزاء.\n• لو بكت ففيه روايتان لأنه يكون عن سرور وعن حزن. والمختار: إن كان بغير صوت فهو رضا (بكاء على فراق الأهل).\n• لو زوّجها بغير إذنها ثم بلغها فسكتت: اعتُبر السكوت رضا. والبلوغ إليها أن يرسل إليها وليها رسولاً يخبرها عدلاً كان أو غير عدل. فإن أخبرها فضولي فلا بد من العدد أو العدالة (عند أبي حنيفة)، وعندهما لا يُشترط.\n• لو قال الولي: أزوّجك من فلان أو فلان فسكتت فأيهما زوّجها جاز.\n• لو استأمرها فقالت: غيره أحب إليّ منه لا يكون إذناً، ولو قالت ذلك بعد العقد يكون إذناً.\n• لو استأذنها غير الولي فلا بد من القول، لأن السكوت إنما جُعل رضا عند الحاجة وهو استئمار الولي وعجزها عن المباشرة."}, {"title": "إذن الثيب وأحكام متفرقة", "body": "• إذن الثيب بالقول، قال ﷺ: «الثيب تُستأمر» أي يُطلب أمرها، والأمر بالقول. وقال ﷺ: «والثيب يُعرب عنها لسانها».\n• وقال في حق البكر: «تُستأذن» أي يُطلب الإذن منها، والإذن والرضا يكون بالسكوت. وإنما جُعل السكوت إذناً لمكان الحياء المانع من النطق المختص بالأبكار فلا يُقاس عليها الثيب.\n• ينبغي أن يُذكر لها الزوج بما تعرفه لعدم تحقق الرضا بالمجهول. وقال بعضهم: يُشترط تسمية قدر الصداق أيضاً لاختلاف الرغبات.\n\nمسائل متفرقة:\n١) إن زالت بكارتها بوثبة أو جراحة أو تعنيس أو حيض فهي بكر لأنها في حكم الأبكار.\n٢) لو مات زوج البكر أو طلقها قبل الدخول تُزوّج كالأبكار لبقاء البكارة والحياء.\n٣) إن زوّجت نفسها وزوّجها الولي برضاها (من رجلين) فأيهما قالت: هو الأول صح لصحة إقرارها على نفسها دون إقرار الأب. وإن قالت: لا أدري لم يثبت واحد منهما لعدم إمكان الجمع وعدم أولوية أحدهما.\n٤) لو تزوجها على أنها بكر فوجدها ثيباً: يجب جميع المهر لأن البكارة لا تصير مستحقة بالنكاح."}]}, {"id": "n5", "title": "ترتيب الأولياء (ص 32–38)", "lessons": [{"title": "ترتيب الأولياء", "body": "أولاً: العصبة:\n• الولي: العصبة، لقوله ﷺ: «النكاح إلى العصبات». وهم على ترتيبهم في الإرث والحجب.\n• العصبة: من يأخذ كل المال إذا انفرد، والباقي مع ذي سهم كالابن والأب. والمراد هنا العاصب بنفسه.\n• ترتيبهم: جزء الإنسان (الابن وابن الابن وإن نزل)، ثم أصله (الأب والجد وإن علا)، ثم جزء أبيه (الأخ وابن الأخ وإن نزل)، ثم جزء جده (العم وابن العم وإن نزل).\n\nثانياً: الأم وأقاربها:\n• لهم التزويج عند عدم العصبات، ثم القاضي. وهذا مذهب أبي حنيفة.\n• وروي عنه، وهو قولهما: ليس لهم ذلك، لقوله ﷺ: «النكاح إلى العصبات»، ولأن الولاية تثبت دفعاً للعار بعدم الكفء، وذلك إلى العصبات لأنهم الذين يُعيَّرون بذلك.\n• ولأبي حنيفة: أن الأصل في الولاية القرابة الداعية إلى الشفقة والنظر في حق المولّى عليه، وشفقة الأم أكثر من شفقة غيرها من الأباعد، ولأن الأم أحد الأبوين فتثبت الولاية لها كالآخر. وهو مروي عن علي وابن مسعود.\n• الأصل: كل قرابة يتعلق بها الإرث يتعلق بها ثبوت الولاية. وإنما تأخروا عن العصبات لضعف الرأي وبعد القرابة كما في الإرث.\n\nثالثاً: القاضي: لقوله ﷺ: «السلطان وليّ من لا وليّ له»."}, {"title": "غيبة الولي الأقرب وتعدد الأولياء", "body": "غيبة الولي الأقرب:\n• إذا غاب الولي الأقرب غيبة منقطعة لا يُنتظر الكفء الخاطب حضوره، وزوّجها الأبعد.\n• اختلفوا في الغيبة المنقطعة. قال زفر: إذا كان في مكان لا يُدرى أين هو، وهذا حسن لأنه لا يمكن استطلاع رأيه فتفوت المصلحة. (وفي الغيبة المنقطعة أقوال أخرى منها: أن تكون في مكان لا تصل إليه القوافل إلا مرة في السنة، وصححه القدوري.)\n• وقال زفر: لا يزوجها الأبعد لأن ولاية الأقرب قائمة.\n• وللحنفية: لو لم تنتقل الولاية إلى الأبعد لتضررت الصغيرة لأنه يفوت الكفء الحاضر وقد لا يتفق الكفء مرة أخرى، ولأن الغائب عاجز عن تدبير مصالح النكاح فيفوت مقصود الولاية.\n\nما لو زوّجها وليان:\n• لو زوّجها وليان (في درجة واحدة) فالأول أولى، لقوله ﷺ: «إذا أنكح الوليان فالأول أحق»، وألنه لما سبق فقد صح فلا يجوز نكاح الثاني.\n• لأن سبب الولاية القرابة وهي لا تتجزأ، والحكم الثابت به أيضاً لا يتجزأ، فصار كل واحد منهما كالمنفرد.\n• وإن كانا معاً بطلا لتعذر الجمع وعدم أولوية أحدهما.\n\nالأب والجد:\n• يجوز للأب والجد أن يزوّج ابنه بأكثر من مهر المثل، وابنته بأقل ومن غير كفء، ولا يجوز ذلك لغيرهما (عند أبي حنيفة).\n• وقالا (أبو يوسف ومحمد): لا يجوز ذلك للأب والجد أيضاً إلا أن يكون نقصاناً يُتغابن في مثله، لأن هذه الولاية نظرية ولا نظر في ذلك.\n• ولأبي حنيفة: أن النكاح عقد عُمر يشتمل على مقاصد ومصالح باطنة، فالظاهر أن الأب مع وفور شفقته وكمال رأيه ما أقدم على هذا النقص إلا لمصلحة أنفع.\n\nلو نقصت المرأة من مهر مثلها:\n• لأبي حنيفة: للأولياء الاعتراض عليها حتى يتم لها مهر مثلها أو يفارقها، لأنها سريعة الانخداع ضعيفة الرأي.\n• وقال أبو يوسف ومحمد: لا اعتراض عليها لأن المهر حقها.\n• ولأبي حنيفة: أن المهر إلى عشرة دراهم حق الشرع، وإلى مهر مثلها حق الأولياء لأنهم يُعيَّرون بذلك."}, {"title": "تولي الواحد طرفي العقد", "body": "• الواحد يتولى طرفي العقد في النكاح: وليّاً كان أو وكيلاً، أو وليّاً ووكيلاً، أو أصيلاً ووكيلاً، أو وليّاً وأصيلاً.\n• أمثلة:\n  - الولي من الجانبين: من زوّج ابن ابنه بنت ابن له آخر، أو بنت أخيه ابن أخ له آخر.\n  - الولي والوكيل: أن يوكّله رجل أن يزوّجه بنته الصغيرة، أو توكّله امرأة أن يزوجها من ابنه الصغير.\n  - الوكيل والأصيل: بأن وكّلته امرأة أن يزوجها من نفسه.\n  - الولي والأصيل: أن يزوّج ابنة عمه الصغيرة من نفسه.\n• صورته: أن يقول: اشهدوا أني زوجت فلانة من فلان، أو فلانة مني، أو تزوجت فلانة. ولا يحتاج إلى القبول لأنه تضمن الشطرين.\n• وقال زفر: لا يجوز لأنه لا يمكن أن يكون الواحد مملّكاً ومتملّكاً كالبيع.\n• ولنا: أنه معبّر وسفير، والمانع في البيع رجوع الحقوق إلى العاقد فيجري فيه التمانع، وهنا الحقوق لا ترجع إليه فلا تمانع."}]}, {"id": "n6", "title": "الكفاءة في النكاح (ص 39–43)", "lessons": [{"title": "معنى الكفاءة وحكمها وأدلتها", "body": "• الكفاءة لغةً: المساواة والمماثلة، والكفء: النظير والمثل.\n• شرعاً: المساواة بين الزوجين في أمور خاصة يُعتبر الإخلال بها معقِّداً للحياة الزوجية، وتُعتبر وقت العقد. فلو زالت بعد ذلك فلا يترتب على زوالها ضرر ولا إخلال بالعقد.\n• الكفاءة تُعتبر في النكاح، وتُعتبر في الرجال للنساء، لأنها لازمة في حقهن، ولأن الشريفة تُعيَّر ويغيظها كونها مزوّجة للخسيس، وليس كذلك الرجل.\n• الأصل فيها قوله ﷺ: «ألا لا يزوّج النساء إلا الأولياء، ولا يزوّجن إلا من الأكفاء». ولأن المصالح إنما تتم بين المتكافئين غالباً."}, {"title": "ما تُعتبر فيه الكفاءة", "body": "١) النسب: فقريش بعضهم أكفاء لبعض لا يكافئهم غيرهم من العرب، والعرب بعضهم أكفاء لبعض لا يكافئهم الموالي، لقوله ﷺ: «قريش بعضهم أكفاء لبعض والعرب بعضهم أكفاء لبعض»، وقال: «والموالي بعضهم أكفاء لبعض».\n• ولا يُعتبر التفاضل في قريش وإن كان أفضلهم بنو هاشم، لأن النبي ﷺ زوّج ابنته عثمان وكان عبشمياً أموياً، وعلي زوّج ابنته عمر وكان عدوياً. وقال محمد: إلا أن يكون نسباً مشهوراً كبيت الخلافة.\n٢) الدين والتقوى: حتى إن بنت الرجل الصالح لو تزوجت فاسقاً كان للأولياء الرد لأنه من أفجر الأشياء وأنها تُعيَّر بذلك. وقوله ﷺ: «عليك بذات الدين تربت يداك».\n• وقال محمد: لا يُعتبر إلا أن يكون فاحشاً كمن يُصفع ويُسخر منه أو يخرج سكران ويلعب به الصبيان. وعن أبي يوسف: إذا كان الفاسق ذا مروءة فهو كفء.\n٣) الصنائع (الحِرَف): لأن الناس يُعيَّرون بالدنيء منها. وعن أبي حنيفة أنه غير معتبر لأنه يمكن الانتقال عنها. وعن أبي يوسف: لا يُعتبر إلا أن يفحش كالحائك والحجام والكناس والدباغ، فإنه لا يكون كفئاً لبنت البزاز والعطار والصيرفي والجوهري.\n٤) المال: وهو ملك المهر المعجّل والنفقة في ظاهر الرواية، حتى لو وجد أحدهما دون الآخر لا يكون كفئاً. لأن بالنفقة تقوم مصالح النكاح، والمهر بدل البضع فلا بد من إيفائه. وعن أبي يوسف: إن كان يملك المهر دون النفقة ليس بكفء، وإن كان يملك النفقة دون المهر فهو كفء.\n٥) العقل: قيل لا تُعتبر، وقيل تُعتبر، فلا يكون المجنون كفئاً للعاقلة، وهو المختار."}, {"title": "آثار الإخلال بالكفاءة", "body": "• إذا تزوجت غير كفء فللولي أن يفرّق بينهما دفعاً للعار عنه، والتفريق إلى القاضي، وما لم يُفرَّق فأحكام النكاح ثابتة.\n• ولا يكون الفسخ طلاقاً لأن الطلاق تصرف في النكاح وهذا فسخ لأصل النكاح، ولأن الفسخ إنما يكون طلاقاً إذا فعله القاضي نيابة عن الزوج وهذا ليس كذلك.\n• ما يجب لها بالتفريق: لا يجب لها شيء من المهر إن كان قبل الدخول. وإن دخل بها فلها المسمى وعليها العدة ولها نفقة العدة للدخول في عقد صحيح.\n• فإن قبض الولي المهر أو جهّز به أو طالب بالنفقة فقد رضي، لأن ذلك تقرير للنكاح. وإن سكت لا يكون رضاً وإن طالت المدة ما لم تلد.\n• وإن رضي أحد الأولياء فليس لغيره ممن هو في درجته أو أسفل منه الاعتراض، وإن كان أقرب منه فله ذلك. وقال أبو يوسف: للباقين حق الاعتراض.\n• وروى الحسن عن أبي حنيفة: إذا تزوجت بغير كفء لم يجز، قال السرخسي: وهو أحوط.\n\nالقائلون بعدم اعتبار الكفاءة:\n• عن أبي بكر الرازي وأبي الحسن الكرخي أنه لا تُعتبر الكفاءة وهو مذهب مالك، لقوله تعالى: «إن أكرمكم عند الله أتقاكم» وقوله ﷺ: «ليس لعربي على عجمي فضل إلا بالتقوى».\n• وجوابه أن المراد بالآية حكم الآخرة لا الدنيا، وكذا الحديث المراد به الفضل عند الله تعالى، ويجب الحمل عليه توفيقاً بين الأدلة.\n\nإذا نقصت عن مهر مثلها: فللأولياء أن يفرّقوا أو يتمموه (عند أبي حنيفة)."}]}, {"id": "n7", "title": "المهر (ص 44–54)", "lessons": [{"title": "المهر: تعريفه ومقداره", "body": "• المهر: اسم للمال الذي يجب على الرجل للمرأة بسبب عقد النكاح أو الوطء بشبهة. ومن أسمائه: الصداق، والصدقة، والنحلة.\n• أقله عشرة دراهم أو ما قيمته عشرة دراهم، ولا يجوز أن يكون إلا مالاً متقوماً شرعاً. والدرهم نحو ٣٫١٢٥ جرام من الفضة، فتكون العشرة نحو ٣١٫٢٥ جراماً.\n• الأصل فيه قوله تعالى: «أن تبتغوا بأموالكم»، فعلّق الحل بشرط الابتغاء بالمال. والمذكور في الآية مطلق المال فكان مجملاً، وفسّره النبي ﷺ بالعشرة: «لا مهر أقل من عشرة دراهم».\n• المهر ثبت حقاً لله تعالى حتى لا يكون النكاح بدونه ولو نفاه أو سكت عنه، ولذلك كان لها المطالبة بالفرض والتقدير.\n• لو سمّى أقل من عشرة فلها عشرة (عند الحنفية)، وقال زفر: لها مهر المثل. ودليلنا أن العشرة لا تتبعض في حكم العقد فتسمية بعضها كتسمية كلها كالطلقة.\n• من سمّى مهراً لزمه كاملاً بالدخول أو الموت، لأن الدخول تحقق به تسليم المبدل، وبالموت يتقرر النكاح بانتهائه. وإن طلقها قبل الدخول لزمه نصفه لقوله تعالى: «فنصف ما فرضتم»."}, {"title": "مهر المثل والمتعة", "body": "إذا لم يسمّ لها مهراً أو شرط أن لا مهر لها:\n• فلها مهر المثل بالدخول والموت، والمتعة بالطلاق قبل الدخول، لأن النكاح صح فيجب العوض لأنه عقد معاوضة.\n• مهر المثل هو الواجب الأصلي لأنه أعدل. وقال ﷺ: «المهر ما تراضى عليه الأهلون». وقضى ﷺ في بروع بنت واشق الأشجعية بمهر المثل لما تزوجت بلا مهر ومات عنها قبل الدخول.\n\nالمتعة:\n• هي ما يعطيه الزوج لزوجته عند طلاقها تطييباً لنفسها وتسلية لها عند الفراق. وهي درع وخمار وملحفة، ذكره ابن عباس وعائشة.\n• تجب للمطلقة قبل الدخول التي لم يُسمَّ لها مهر فقط، لأنها خلف عن نصف المهر فلا تجتمع مع الأصل. وتُستحب لكل مطلقة سواها.\n• تُعتبر بحال الزوج لقوله تعالى: «على الموسع قدره وعلى المقتر قدره». ولا تزاد على نصف مهر المثل ولا تنقص عن خمسة دراهم.\n\nمسائل:\n• إن زادها في المهر لزمته الزيادة وتسقط بالطلاق قبل الدخول. وعند أبي يوسف تتنصّف.\n• لو تزوجها ولم يسمّ مهراً ثم اصطلحا على تسمية فهي لها إن دخل بها أو مات عنها، وإن طلقها قبل الدخول فالمتعة (عند أبي حنيفة ومحمد). وقال أبو يوسف: يتنصف ما اصطلحا عليه.\n• إن حطّت من مهرها صح الحط لأنه خالص حقها."}, {"title": "الخلوة الصحيحة والنكاح الفاسد", "body": "الخلوة الصحيحة في النكاح الصحيح كالدخول:\n• هي اجتماع الزوجين بعد تمام العقد الصحيح في مكان يأمنان فيه اطلاع الغير عليهما.\n• دليلها: قوله ﷺ: «من كشف خمار امرأة ونظر إليها فقد وجب الصداق دخل بها أو لم يدخل». وقضاء الخلفاء الراشدين بأنه إذا أرخى ستراً أو أغلق باباً فلها الصداق كاملاً وعليها العدة. وقال عمر: ما ذنبهن إذا جاء العجز من قبلكم. ولأنها سلّمت المبدل فيجب لها البدل.\n• شرطها: ألا يكون ثمَّ مانع من الوطء طبعاً أو شرعاً أو حساً:\n  - المرض المانع من الوطء من جهته أو جهتها.\n  - الحيض (مانع شرعاً وطبعاً).\n  - الإحرام بحج أو عمرة فرضاً أو نفلاً.\n  - صوم رمضان وصلاة الفرض. وكذا السنن إلا ركعتي الفجر والأربع قبل الظهر.\n• المكان: أن يأمنا اطلاع غيرهما، فلو خلا بها في مسجد أو حمام أو طريق أو سطح لا حجاب له فليست صحيحة، وكذا لو كان معهما أعمى أو صبي يعقل أو مجنون أو كلب عقور أو زوجة أخرى. وعليها العدة في جميع ذلك احتياطاً.\n\nالنكاح الفاسد (وهو ما استوفى أركانه وفقد شرطاً من شروط صحته):\n• لا يجب فيه إلا مهر المثل ولا يجب إلا بالدخول حقيقة، لأن الحرمة قائمة وهي مانعة شرعاً.\n• ولا يتجاوز به المسمى، لأن المستوفى ليس بمال وإنما يتقوّم بالتسمية.\n• ويثبت فيه النسب احتياطاً، وأول مدته وقت الدخول بخلاف الصحيح فمن وقت العقد.\n• وعليها العدة، وأولها يوم التفريق."}, {"title": "تسمية المهر وأحكام متفرقة", "body": "• لو تزوجها على ألف على ألا يتزوج عليها: فإن وفى فلها المسمى، وإلا فمهر مثلها.\n• لو قال: على ألف إن أقام بها وألفين إن أخرجها: فإن أقام فلها الألف، وإن أخرجها فمهر مثلها لا يزاد على ألفين ولا ينقص من ألف. وقال الصاحبان: الشرطان جائزان. وقال زفر: فاسدان.\n• لو تزوجها على حيوان: فإن سمّى نوعه كالفرس جاز وإن لم يصفه، ولها الوسط، وله أن يعطيها ذلك أو قيمته. والثوب مثله إلا أنه إن ذكر وصفه لزمه تسليمه، وكذلك كل ما يثبت في الذمة كالمكيل والموزون.\n• الأصل: التسمية لا تصح مع جهالة الجنس والنوع والصفة لأنها تؤدي إلى المنازعة، وتصح مع الجهالة اليسيرة كجهالة الوصف لأن النكاح مبناه على المساهلة بخلاف البيع.\n\nكيف يُقدَّر مهر المثل؟\n• يُعتبر بنساء عشيرة أبيها كأخواتها وعماتها وبنات عمها، دون أمها وخالتها إلا أن يكونا من قبيلة أبيها. لقوله ﷺ في بروع: «لها مهر مثل نسائها»، ولأن قيمة الشيء تُعرف بقيمة جنسه وجنسه قوم أبيه.\n• ويُعتبر بامرأة هي مثلها في السن والجمال والبكارة والبلد والعصر والمال. فإن لم يوجد ذلك كله فالذي يوجد منه. فإن لم يوجد منهم مثل حالها فمن الأجانب.\n\nحبس المرأة نفسها:\n• للمرأة أن تمنع نفسها وأن تمتنع عن السفر معه حتى يعطيها مهرها المعجّل. فإذا أوفاها مهرها نقلها حيث شاء لقوله تعالى: «أسكنوهن من حيث سكنتم»، وقيل: لا يسافر بها وعليه الفتوى لفساد أهل الزمان.\n• إذا ضمن الولي المهر صح ضمانه كغيره من الديون، وللمرأة أن تطالب أيهما شاءت."}]}, {"id": "n8", "title": "القسم بين الزوجات (ص 55–59)", "lessons": [{"title": "القسم بين الزوجات", "body": "• على الرجل أن يعدل بين نسائه في البيتوتة (المبيت عندها)، لقوله ﷺ: «من كان له امرأتان فمال إلى إحداهما جاء يوم القيامة وأحد شقيه مائل».\n• البكر والثيب والجديدة والعتيقة (القديمة) والمسلمة والكتابية سواء في القسم، لإطلاق الحديث، ولأن ذلك من حقوق النكاح ولا تفاوت بينهن فيها.\n• لا يجب عليه التساوي بينهن في الوطء والمحبة: أما الوطء فلأنه ينبني على النشاط، وأما المحبة فلأنها فعل القلب. وكان ﷺ يعدل بين نسائه ويقول: «اللهم هذا قسمي فيما أملك فلا تؤاخذني فيما لا أملك».\n• له أن يجعل الدور بينهن يوماً أو يومين أو أكثر، لأن المستحق عليه التسوية وقد وُجدت.\n\nهبة القسم:\n• من وهبت نصيبها لصاحبتها جاز، لأن سودة بنت زمعة وهبت يومها لعائشة بعد أن أراد النبي ﷺ طلاقها فراجعها، ولأنه حقها وقد أبطلته برضاها.\n• ولها الرجوع في ذلك لأنها وهبت حقاً لم يجب بعد.\n• لو أعطت زوجها مالاً أو حطّت مهرها ليزيد في قسمها لم يجز وترجع بما أعطته. وكذا لو زادها الزوج في مهرها لتجعل يومها لغيرها."}, {"title": "أحكام القسم المتممة والسفر", "body": "• إن أقام عند واحدة أياماً بإذن الأخرى جاز من غير مساواة، لأن النبي ﷺ لما مرض استأذن نساءه أن يكون في بيت عائشة فأذنّ له.\n• وفيه دليل على أن القسم يجب على الرجل وإن كان مريضاً. ويُؤمر الصائم بالنهار والقائم بالليل أن يبيت معها إذا طلبت.\n• عن أبي حنيفة: يجعل لها ليلة من أربع ليال، وليس هذا بواجب لأنه يؤدي إلى فوات النوافل أصلاً على من له أربع نساء، لكن يؤمر بإيفاء حقها أحياناً.\n• يسافر بمن شاء والقرعة أولى، لأنه لا حق لهن حال السفر حتى كان له ألا يسافر بواحدة منهن أصلاً، ويقرع بينهن تطييباً لقلوبهن، وقد ورد ذلك عنه ﷺ.\n• وإن ظلم بعضهن يُوعظ، فإن لم ينته يُوجَع عقوبة زجراً له عن الظلم.\n\nمخطط الباب (ملخص):\n• أحوال النكاح: حالة التوقان واجب، وحالة الاعتدال سنة مؤكدة، وحالة الخوف من الجور مكروه.\n• الكفاءة تُعتبر في: النسب، والدين، والصنائع، والمال، والعقل.\n• ركن النكاح: الإيجاب والقبول، ويُعقد بلفظ التزويج أو النكاح.\n• ينعقد المؤقت: صحيح ويبطل التأقيت عند زفر، وباطل عند الإمام والصاحبين."}]}, {"id": "n9", "title": "كتاب الرضاع (ص 67–72)", "lessons": [{"title": "الرضاع: تعريفه وحكمه ومقداره", "body": "• الرضاع لغةً: المص. وشرعاً: مص لبن آدمية في وقت مخصوص.\n• حكمه: واجب إحياءً للولد، لقوله تعالى: «والوالدات يرضعن أولادهن» أي ليرضعن.\n• المقدار الذي يثبت به التحريم: يثبت التحريم بقليله وكثيره (قول أبي حنيفة)، لقوله تعالى: «وأمهاتكم اللاتي أرضعنكم» مطلقاً، وقوله ﷺ: «يحرم من الرضاع ما يحرم من النسب». وقال ﷺ: «الرضاع ما أنبت اللحم وأنشز العظم» (أي رفع بناءه وقواه)، وهو يحصل بالقليل لأن اللبن متى وصل إلى جوف الصبي أنبت اللحم وأنشز العظم."}, {"title": "مدة الرضاع المحرِّم", "body": "• قال أبو حنيفة: ثلاثون شهراً (إذا وُجد الرضاع في مدته).\n• وقال أبو يوسف ومحمد: سنتان، لقوله تعالى: «حولين كاملين لمن أراد أن يتم الرضاعة»، وقوله: «وحمله وفصاله ثلاثون شهراً» وأدنى مدة الحمل ستة أشهر فبقي للفصال سنتان.\n• حجة أبي حنيفة: الآية الثانية، فإن الله ذكر الحمل والفصال وضرب لهما مدة ثلاثين شهراً، فتكون المدة لكل واحد منهما كما لو باعه شيئاً وأجره آخر صفقة واحدة إلى مدة معلومة. فخرج الحمل بالإجماع (أنه ستة أشهر) فبقي الفصال ثلاثين شهراً.\n• والآية الأولى محمولة على مدة الاستحقاق حتى لا يكون للأم المبتوتة المطالبة بأجرة الرضاع بعد الحولين، فعملنا بالأولى في نفي الأجرة بعد الحولين وبالثانية في الحرمة إلى ثلاثين شهراً احتياطاً فيهما.\n• إذا انقضت مدته فلا اعتبار بالرضاع بعده لقوله ﷺ: «لا رضاع بعد الفصال».\n• المحرِّم ما وقع في المدة سواء فُطم أو لم يُفطم. وقال الخصاف وهو رواية عن أبي حنيفة: إن استغنى بالفطام عن اللبن ثم رضع في المدة لا تثبت الحرمة، وإن لم يستغن تثبت."}, {"title": "ما يحرم بالرضاع", "body": "• يحرم من الرضاع ما يحرم من النسب، إلا أخت ابنه وأم أخته فإنهما تحرمان من النسب دون الرضاع.\n  - أخت ابنه من الرضاع: يجوز أن يتزوجها، كأن ترضع امرأة صبياً وللمرأة بنت، فيجوز لأبي هذا الصبي أن يتزوج بنت المرضعة. لأنها في النسب إما بنته أو بنت زوجته الموطوءة.\n  - أم أخته من الرضاع: كأن ترضع امرأة صبية وللصبية أخ، فيجوز لهذا الأخ أن يتزوج المرضعة.\n• إذا أرضعت المرأة صبية حرمت على زوجها وآبائه وأبنائه: فالمرضعة أم الرضيع، وأولادها إخوته، وآباؤها أجداده، وأمهاتها جداته، وإخوتها وأخواتها أخواله وخالاته.\n• ويكون زوجها الذي نزل بسببه اللبن أباً للرضيع، وأولاده إخوته، وآباؤه أجداده، وإخوته وأخواته أعمامه وعماته.\n• إذا رضع صبيان من ثدي امرأة فهما أخوان لأن أمهما واحدة. فلو كانا بنتين لا يجوز لأحد الجمع بينهما.\n• لو كان لرجل زوجتان ولدتا منه ثم أرضعت كل واحدة صغيراً صار الرضيعان أخوين من أب.\n• إذا اجتمعا على لبن شاة فلا رضاع بينهما، لأن الحرمة تثبت في الأم ثم تتعدى، ولا حرمة بين الصبي والشاة."}, {"title": "اختلاط اللبن ومسائل متفرقة", "body": "اختلاط اللبن بغيره:\n• بخلاف جنسه (كالماء والدهن والنبيذ والدواء ولبن البهائم): الحكم للغالب، فإن غلب اللبن ثبتت الحرمة وإلا فلا.\n• بجنسه (لبن امرأتين): الحكم للغالب عند أبي حنيفة وأبي يوسف لأن منفعة المغلوب لا تظهر في مقابلة الغالب. وقال محمد وزفر: تثبت الحرمة بهما لأن الشيء لا يصير مستهلَكاً بجنسه بل يتقوى به.\n• بالطعام: لا حكم له وإن غلب عند أبي حنيفة، لأن الطعام يسلب قوة اللبن والتغذي يحصل بالطعام. وقال الصاحبان: إن غلب اللبن تعلق به التحريم. والخلاف في غير المطبوخ، أما المطبوخ فلا تثبت به الحرمة بالإجماع.\n\nمسائل:\n١) تتعلق الحرمة بلبن المرأة بعد موتها، لأنه سبب لإنبات اللحم وإنشاز العظم ومعنى الغذاء لا يزول بالموت.\n٢) وكذلك تتعلق بلبن البكر. ولا تتعلق بلبن الرجل لو نزل له لأنه ليس بلبن حقيقة.\n٣) وتتعلق بالاستعاط (وصول اللبن إلى المعدة عن طريق الأنف) والإيجار (صبه في الحلق) لأنه يصل إلى المعدة فيحصل به النشوء.\n٤) امرأة أدخلت حلمة ثديها في فم رضيع ولا يُدرى أدخل اللبن في حلقه أم لا: لا يحرم النكاح للشك، والأصل الحل، واليقين لا يزول بالشك.\n٥) صبية أرضعها بعض أهل القرية ولا يُدرى من هي، فتزوجها رجل من أهل تلك القرية: يجوز لأن إباحة النكاح أصل فلا يزول بالشك.\n• تنبيه: يجب على النساء ألا يرضعن كل صبي من غير ضرورة، فإن فعلن فليحفظنه أو يكتبنه احتياطاً."}]}, {"id": "n10", "title": "كتاب الطلاق (ص 76–84)", "lessons": [{"title": "الطلاق: تعريفه ومشروعيته وحكمه", "body": "• لغةً: إزالة القيد والتخلية. وشرعاً: إزالة النكاح الذي هو قيد معنىً.\n• مشروع بالكتاب والسنة والإجماع والمعقول:\n  - الكتاب: «يا أيها النبي إذا طلقتم النساء فطلقوهن لعدتهن»، و«الطلاق مرتان فإمساك بمعروف أو تسريح بإحسان».\n  - السنة: «كل طلاق جائز إلا طلاق المعتوه والصبي»، و«أبغض المباحات إلى الله الطلاق».\n  - الإجماع: انعقد على مشروعيته.\n  - المعقول: استباحة البضع ملك للزوج على الخصوص والمالك صحيح القول يملك إزالة ملكه، ولأن مصالح النكاح قد تنقلب إلى مفاسد إذا تنافر الزوجان من تباغض وعداوة فشُرع الطلاق دفعاً لها.\n• إيقاع الطلاق لغير حاجة: مباح مبغوض لأنه قاطع للمصالح. وفي الحديث: «ما خلق الله مباحاً أحب إليه من العتاق ولا خلق مباحاً أبغض إليه من الطلاق».\n• ويقع طلاق كل زوج عاقل بالغ مستيقظ."}, {"title": "أقسام الطلاق: أحسن وحسن وبدعي", "body": "الطلاق على ثلاثة أوجه: أحسن، وحسن، وبدعي.\n\n١) الأحسن: أن يطلقها واحدة في طهر لا جماع فيه ويتركها حتى تنقضي عدتها.\n• لأن أصحاب رسول الله ﷺ كانوا يستحبون ألا يطلقوا للسنة إلا واحدة ثم لا يطلقوا غيرها حتى تنقضي عدتها. ولأنه إذا جامعها لا يؤمن الحبل وهو لا يعلم به فيندم. ولأنه أبيح للحاجة وتندفع بالواحدة.\n• وفي التي لا تحيض لصغر أو كبر يطلقها أي وقت شاء.\n\n٢) الحسن (طلاق السنة): أن يطلقها ثلاثاً في ثلاثة أطهار لا جماع فيها.\n• لحديث ابن عمر لما طلق امرأته وهي حائض فقال ﷺ: «ما هكذا أمرك ربك، إنما أمرك أن تستقبل الطهر فتطلقها لكل طهر تطليقة». وفي رواية: «مره فليراجعها فإن طهرت فإن شاء طلقها طاهراً من غير جماع أو حاملاً قد استبان حملها فتلك العدة التي أمر الله أن يطلق لها النساء».\n• والشهر للآيسة والصغيرة والحامل كالحيضة لقيامه مقامها في العدة بنص الكتاب، ويجوز طلاقهن عقيب الجماع.\n• ويطلق الحامل ثلاثاً للسنة يفصل بين كل تطليقتين بشهر (عند الإمام وأبي يوسف). وقال محمد: لا تُطلَّق الحامل للسنة إلا واحدة لأنها من ذوات الحيض.\n• السنة في العدد يستوي فيها المدخول بها وغير المدخول بها والصغيرة والآيسة والحامل والحائل. والسنة في الوقت تختص بالمدخول بها لأن طهراً لا جماع فيه لا يتصور في غير المدخول بها، ولأن المحظور تطويل العدة لو وقع في الحيض."}, {"title": "الطلاق البدعي وأحكام الإيقاع", "body": "٣) البدعي: أن يطلقها ثلاثاً أو ثنتين بكلمة واحدة، أو في طهر لا رجعة فيه، أو يطلقها وهي حائض فيقع ويكون عاصياً.\n• الثلاث والثنتان: خلاف السنة لأن المشروعية للحاجة وتندفع بالواحدة.\n• حالة الحيض: لقوله ﷺ لابن عمر: «قد أخطأت السنة». ويقع لقوله ﷺ لعمر: «مُر ابنك فليراجعها»، ولولا الوقوع لما راجعها.\n• وروي أن ابن عمر قال للنبي ﷺ: أرأيت لو طلقتها ثلاثاً أكانت تحل لي؟ قال: «لا، ويكون معصية». وروي أن بعض أبناء عبادة بن الصامت طلق امرأته ألفاً فقال ﷺ: «بانت بثلاث في معصية وتسعمائة وسبع وتسعون فيما لا يملك». وقال: «كل طلاق واقع».\n• قوله «في طهر لا رجعة فيه»: عند أبي حنيفة لو طلقها في طهر لم يجامعها فيه فراجعها ثم طلقها في طهر آخر لا يكره، وقول زفر. وعندهما يكره. فالرجعة فاصلة بين الطلاقين عنده، والنكاح فاصل بالإجماع.\n\nمسائل:\n١) طلاق غير المدخول بها في الحيض ليس ببدعي.\n٢) إذا طلق امرأته في الحيض فعليه أن يراجعها لورود الأمر به في حديث ابن عمر، فإذا طهرت فإن شاء طلقها وإن شاء أمسكها.\n٣) إذا قال لامرأته المدخول بها: أنت طالق ثلاثاً للسنة وقع عند كل طهر تطليقة، وإن نوى وقوعهن الساعة وقعن (خلافاً لزفر).\n٤) طلاق الحرة ثلاث، لقوله تعالى: «فطلقوهن لعدتهن» أي لأطهارهن، وأطهار الحرة في العدة ثلاثة فيكون الطلاق كذلك. وقوله ﷺ: «الطلاق بالرجال والعدة بالنساء» معناه: وجود الطلاق ووقوعه بالرجال كما أن العدة بالنساء."}, {"title": "من يقع طلاقه", "body": "• يقع طلاق كل زوج عاقل بالغ مستيقظ، لقوله ﷺ: «كل طلاق واقع إلا طلاق الصبي والمعتوه» وفي رواية «والمجنون»، ولا يقع طلاقهما لأنهما عديما العقل والتمييز والأهلية. (ويُستدل أيضاً بحديث «رُفع القلم عن ثلاثة».)\n• طلاق المكرَه: واقع، لأن امرأة اعتقلت زوجها وجلست على صدره ومعها شفرة وقالت: لتطلقني ثلاثاً أو لأقتلنك، فطلقها ثلاثاً، فقال ﷺ: «لا قيلولة في الطلاق» (أي لا رجعة). ولأنه قصد الطلاق ولم يرض بالوقوع فصار كالهازل. (وقال غير الحنفية: لا يقع لحديث «رُفع عن أمتي الخطأ والنسيان وما استُكرهوا عليه».)\n• طلاق السكران: واقع. وقال الطحاوي: لا يقع، وهو اختيار الكرخي، اعتباراً بزوال عقله بالبنج والدواء. ولنا: أنه مكلف بدليل أنه مخاطب بأداء الفرائض ويلزمه حد القذف والقود، وطلاق المكلف واقع. بخلاف المبنِّج فليس له حكم التكليف، ولأن السكران زال عقله بسبب هو معصية فيُجعل باقياً زجراً له.\n• طلاق الأخرس: يقع بالإشارة إذا كانت إشارته معلومة، ويقع بالكتابة أيضاً.\n• طلاق اللاعب والهازل: واقع، لقوله ﷺ: «ثلاث جدهن جد وهزلهن جد: النكاح والطلاق والرجعة». وقال: «من طلق لاعباً جاز ذلك عليه». وعن أبي الدرداء: من لعب بطلاق أو عتاق لزمه، وفيه نزل قوله تعالى: «ولا تتخذوا آيات الله هزواً».\n• ومن أراد غير الطلاق فسبق لسانه بالطلاق وقع، لأن عدم القصد غير معتبر. وروى هشام عن محمد عن أبي حنيفة أن من أراد أن يقول لامرأته: اسقيني الماء فقال: أنت طالق، وقع.\n• ويعم هذه الفصول كلها قوله ﷺ: «كل طلاق واقع»."}]}, {"id": "n11", "title": "صريح الطلاق (ص 85–88)", "lessons": [{"title": "صريح الطلاق وأنواعه", "body": "• الطلاق الصريح: اللفظ الذي يظهر المراد منه ظهوراً واضحاً جلياً كقوله: أنت طالق.\n• صريح الطلاق لا يحتاج إلى نية، لأنه موضوع له شرعاً فكان حقيقة والحقيقة لا تحتاج إلى نية. ويعقب الرجعة لقوله تعالى: «وبعولتهن أحق بردهن». ولو نوى الإبانة فهو رجعي لأنه نوى ضد ما وُضع له شرعاً.\n• نوعان:\n  ١) أنت طالق، ومطلَّقة، وطلقتك: تقع به طلقة واحدة رجعية ولا تصح فيه نية الثنتين والثلاث، لأنه نعت فرد: يقال للواحدة طالق وللثنتين طالقان وللثلاث طوالق ونعت الفرد لا يحتمل العدد.\n  ٢) أنت الطلاق، وأنت طالق الطلاق، وأنت طالق طلاقاً: تقع به واحدة رجعية وتصح فيه نية الثلاث دون الثنتين، لأنه ذكر المصدر وهو يحتمل العموم لأنه اسم جنس ويحتمل الأدنى فعند الإطلاق يُحمل على الواحدة لأنها متيقنة.\n• لا تصح نية الثنتين لأن اللفظ لا يحتمل العدد، وصحت الثلاث لأنها جنس الطلاق لا من حيث العددية. وقال زفر: تصح نية الثنتين لأنها بعض الثلاث."}, {"title": "تعليق الطلاق بالزمان والمكان وألفاظ أخرى", "body": "• قال: أنت طالق بمكة أو في مكة: طلقت في الحال في جميع البلاد. وإن قصد: إذا أتيت مكة لم يصدَّق قضاءً لأن الإضمار خلاف الظاهر.\n• قال: في دخولك مكة: تعلق الطلاق بالدخول لتعذر الظرفية والشرط قريب من الظرف.\n• قال: أنت طالق غداً: تقع بطلوع الفجر لأنه وصفها بالطلاق في جميع الغد. ولو نوى آخر النهار صُدّق ديانة لا قضاءً. \n• قال: في غد: صحت نيته قضاءً أيضاً لأن الظرف لا يوجب استيعاب المظروف. وقال الصاحبان: هو والأول سواء. ولأبي حنيفة أن «غداً» للاستيعاب بخلاف «في غد»، ونظيره: لا أكلمك شهراً وفي الشهر. وعلى هذا الخلاف: أنت طالق في رمضان ونوى آخره.\n• قال: أنت طالق اليوم غداً أو غداً اليوم: يُؤخذ بأولهما ذكراً لأن «اليوم» تنجيز والتنجيز إبطال للإضافة فيلغو الآخر.\n• قال: أنت طالق قبل أن أتزوجك: ليس بشيء، وكذا أمس وقد تزوجها اليوم، لأنه أسنده إلى حالة منافية لوقوع الطلاق.\n• قال: أنا منك طالق: لم يقع شيء وإن نوى، لأن الطلاق إزالة القيد والقيد قائم بالمرأة دون الرجل.\n• قال: أنا منك بائن أو عليك حرام ونوى الطلاق: فواحدة بائنة، لأن الإبانة لقطع الوصلة والتحريم لرفع الحل والحل مشترك بينهما فصح إضافتهما إليهما.\n\nالإشارة بالأصابع:\n• قال: أنت طالق هكذا وأشار بأصابعه الثلاث: فثلاث، وبالواحدة واحدة، وبالثنتين ثنتان، والمعتبر الأصابع المنشورة لأنها لإعلام العدد. وقال ﷺ: «الشهر هكذا وهكذا وهكذا وخنس إبهامه».\n• وإن أشار بظهورها فالمعتبر المضمومة. ولو أراد المضمومتين أو الكف لم يُصدق قضاءً.\n• ولو قال: أنت طالق ولم يقل هكذا: وقعت واحدة."}]}, {"id": "n12", "title": "كنايات الطلاق (ص 89–94)", "lessons": [{"title": "كنايات الطلاق", "body": "• الكناية: لفظ يحتمل الطلاق وغيره. وكنايات الطلاق لا يقع بها إلا بنية أو بدلالة الحال، لأنها غير موضوعة للطلاق فلا يتعين إلا بالتعيين، وهو أن ينويه أو تدل عليه الحال فتترجح إرادته.\n• ويقع بها بائناً، لأنه يملك إيقاع البائن وهو أحد نوعي البينونة فيملكه كالثلاث. ومن الألفاظ: أنت بائن، أنت طالق بائن، أبنتك، بتة، بتلة وما شابهها، لأنها تنبئ عن القطع وذلك في البائن دون الرجعي.\n• إلا: «اعتدي» و«استبرئي رحمك» و«أنت واحدة» فيقع بها واحدة رجعية.\n  - «اعتدي» تحتمل اعتدي نِعَم الله، وتحتمل اعتدي عدة الطلاق، فإذا نواها صار كأنه قال: طلقتك فاعتدي، وذلك يوجب الرجعة.\n  - «استبرئي رحمك» يُستعمل للعدة إذ هو المقصود منها، ويحتمل: استبرئي لأطلقك، فإن نوى الأول كان في معناه فيكون رجعياً."}, {"title": "تخيير الزوجة وتفويضها", "body": "تخيير الزوجة:\n• قال لها: اختاري، ينوي الطلاق: فلها أن تطلق نفسها في مجلس علمها (إن كانت حاضرة فبسماعها، وإن كانت غائبة فبالإخبار). لأن المخيَّرة لها المجلس بإجماع الصحابة، ولأنه ملّكها فعل الاختيار والتمليكات تقتضي جواباً في المجلس كالبيع والهبة.\n• يبطل خيارها: بالقيام لأنه دليل الإعراض، وبتبدل المجلس حقيقةً بالانتقال إلى مجلس آخر، ومعنىً بتبدل الأفعال (فمجلس الأكل غير مجلس القتال وغير مجلس البيع).\n• لو كانت قائمة فقعدت فهي على خيارها لأنه دليل التروي. وكذا لو كانت قاعدة فاتكأت أو متكئة فقعدت لأنه انتقال من جلسة إلى جلسة وليس بإعراض. وإن كانت تسير على دابة فوقفت فهي على خيارها وإن سارت بطل خيارها.\n• إذا اختارت نفسها فهي واحدة بائنة ولا تكون ثلاثاً وإن نواها لأن الاختيار لا يتنوع. ولا بد من ذكر النفس في كلامه أو كلامها: اختاري نفسك فتقول: اخترت، أو اختاري فتقول: اخترت نفسي.\n• القياس ألا يقع بالتخيير طلاق، لكن الاستحسان: إجماع الصحابة، وأن الشرع جعل هذا إيجاباً وجواباً. فلما نزلت آية التخيير بدأ النبي ﷺ بعائشة وقال: «إني أخبرك بشيء فما عليك ألا تجيبيني حتى تستأمري أبويك» فقالت: أفي هذا أستأمر أبويّ؟ بل أختار الله ورسوله.\n\nتفويض الطلاق: قال: طلّقي نفسك:\n• فلها أن تطلق في المجلس، لأن المرأة لا تكون وكيلة في حق نفسها فكان تمليكاً. وتقع واحدة رجعية وليس له أن يرجع عنه. وإن طلقت نفسها ثلاثاً وقد أرادها الزوج وقعن، ولا تصح نية الثنتين.\n• وكذا: أنت طالق إن شئتِ أو أحببتِ أو هويتِ أو أردتِ أو رضيتِ لأنها تعليق بفعل القلب فهو كالخيار.\n• قال: أمرك بيدك، فقالت: أنت عليّ حرام أو أنت مني بائن أو أنا عليك حرام أو أنا منك بائن: فهو جواب وطلقت. ولو قالت: أنت مني طالق لم يقع شيء، ولو قالت: أنا منك طالق أو أنا طالق وقع.\n• قال: طلقي نفسك متى شئتِ أو إذا شئتِ: لا يتقيد بالمجلس لأنها لعموم الأوقات. ولو ردّته لا يرتد.\n• قال: طلقي نفسك كلما شئتِ: فلها أن تفرق الثلاث وليس لها أن تجمعها، لأن «كلما» تقتضي تكرار الفعل. ويقتصر على المملوك من الطلاق في النكاح القائم حتى لو طلقها ثلاثاً وعادت بعد زوج آخر لا تملك التطليق. وقال زفر: لا يقتصر."}]}, {"id": "n13", "title": "باب الرجعة (ص 95–105)", "lessons": [{"title": "الرجعة: تعريفها وحكمها", "body": "• الرجعة لغةً: مصدر رجعه يرجعه رجعاً: إذا أعاده ورده. وشرعاً: رد الزوجة إلى زوجها وإعادتها إلى الحالة التي كانت عليها.\n• الطلاق الرجعي لا يحرم الوطء، وهو أن يطلق الحرة واحدة أو ثنتين بصريح الطلاق من غير عوض. والدليل: «وبعولتهن أحق بردهن»، والبعل هنا الزوج ولا زوج إلا بقيام الزوجية وقيامها يوجب حل الوطء، ولأن الله تعالى أثبت للزوج حق الرد من غير رضاها فلا يكون النكاح زائلاً ما دامت العدة باقية.\n• للزوج مراجعتها في العدة بغير رضاها، لقوله تعالى: «وبعولتهن أحق بردهن في ذلك» أي في العدة.\n• ليست الرجعة ابتداء نكاح، فلا يُشترط فيها الإيجاب والقبول ولا يجب فيها مهر ولا عوض.\n• ولا تصح الخلوة رجعةً لأنه لم يوجد ما يدل عليها قولاً أو فعلاً. ولا يصح تعليق الرجعة بالشرط لأنها استدراك فلا تصح بالتعليق كإسقاط الخيار."}, {"title": "بم تثبت الرجعة وما يُستحب فيها", "body": "بم تثبت؟\n• بالقول: راجعتك، رجعتك، رددتك، أمسكتك، لأنه صريح فيه. ولقوله تعالى: «فأمسكوهن بمعروف». وقوله ﷺ لعمر: «مُر ابنك فليراجعها».\n• وبكل فعل تثبت به حرمة المصاهرة من الجانبين (كالوطء واللمس بشهوة والنظر إلى الفرج بشهوة)، لأن الرجعة استدامة للنكاح واستبقاء له وهذه الأفعال تدل على ذلك، والإمساك بالفعل أقوى منه بالقول.\n• ولو قال: أنت عندي كما كنت أو أنت امرأتي ونوى الرجعة صح، وإلا فلا.\n\nما يُستحب:\n• يُستحب الإشهاد على الرجعة، لأن النصوص الدالة على الرجعة خالية من قيد الشهادة ولأنها استدامة للنكاح، وإنما استُحب تحرزاً عن التجاحد، ويُحمل عليه قوله تعالى: «وأشهدوا ذوي عدل منكم».\n• ويستحب أن يعلمها بالرجعة لتتخلص من قيد العدة، وإن لم يُعلمها جاز. وليس له أن يسافر بها حتى يشهد على رجعتها.\n\nدعوى الرجعة:\n• لو قال لها بعد العدة: كنت راجعتك في العدة فصدّقته صحت الرجعة، وإن كذبته لم تصح لأنه متهم. وإن صدقته ارتفعت التهمة، ولا يمين عليها عند أبي حنيفة.\n• لو قال: راجعتك، فقالت مجيبة: انقضت عدتي: فلا رجعة عند أبي حنيفة، لأن الظاهر تقدم انقطاع الدم وأنها صادقة. وقال الصاحبان: تصح الرجعة لأنها لا تتوقف على قبولها."}, {"title": "انتهاء زمن الرجعة وأحكام المطلقة", "body": "انتهاء زمن الرجعة:\n• إذا انقطع الدم في الحيضة الثالثة لعشرة أيام انقطعت الرجعة وإن لم تغتسل، لأنها خرجت من الحيضة فانقضت العدة.\n• وإن انقطع لأقل من عشرة أيام لم تنقطع حتى تغتسل أو يمضي عليها وقت صلاة أو تتيمم وتصلي، لاحتمال عود الدم فلا بد من دخولها في حكم الطاهرات. والقياس أن تنقطع بمجرد التيمم وهو قول محمد وزفر.\n\nالمطلقة الرجعية:\n• تتشوف وتتزين لقيام النكاح بينها وبين الزوج والرجعة مستحبة والزينة حاملة عليها.\n• ويستحب لزوجها ألا يدخل عليها حتى يؤذنها، إذا لم يكن قصده الرجعة، لاحتمال أن يقع نظره عليها وهي متجردة فتحصل الرجعة ثم يطلقها فتطول عليها العدة.\n\nالمبانة:\n• المبانة بينونة صغرى (بدون الثلاث): له أن يتزوجها في العدة وبعدها، لأن المحلية باقية وزوالها بالثلاثة ولم توجد.\n• المبانة بينونة كبرى (بالثلاث): لا تحل له حتى تنكح زوجاً غيره نكاحاً صحيحاً ويدخل بها ثم تبين منه، لقوله تعالى: «فإن طلقها فلا تحل له من بعد حتى تنكح زوجاً غيره». والنكاح المطلق ينصرف إلى الصحيح، فلو دخل بها في نكاح فاسد لا تحل للأول. وهو يقتضي الوطء لحديث امرأة رفاعة: «حتى تذوقي عسيلته ويذوق عسيلتك». وسواء دخل بها في حيض أو نفاس أو إحرام."}, {"title": "المحلِّل وهدم الزوج الثاني", "body": "شرط التحليل:\n• الشرط هو الإيلاج دون الإنزال، لحصول نكاح زوج غيره، والحديث ورد على غالب الحال.\n• إن تزوجها بشرط التحليل كُره وحلّت للأول (عند أبي حنيفة). وقال أبو يوسف: النكاح فاسد لأنه كالمؤقت ولا تحل للأول. وقال محمد: جائز لكن لا تحل للأول لأنه عجّل ما أخره الشرع فيعاقب بالمنع كقتل المورِّث.\n• حجة أبي حنيفة: قوله ﷺ: «لعن الله المحلِّل والمحلَّل له»، ومراده النكاح بشرط التحليل فيكره، وتحل للأول لأنه ﷺ سماه محلِّلاً وهو المثبت للحل، ولأن الدخول وُجد في نكاح صحيح لأن النكاح لا يفسد بالشرط.\n• ولو تزوجها بقصد التحليل ولم يشترطه حلّت للأول بالإجماع.\n\nهدم الزوج الثاني:\n• الزوج الثاني يهدم ما دون الثلاث (عند أبي حنيفة وأبي يوسف): إذا طلق امرأته طلقة أو طلقتين وانقضت عدتها وتزوجت بزوج آخر ودخل بها ثم طلقها وانقضت عدتها ثم تزوجها الأول عادت إليه بثلاث طلقات.\n• وقال محمد وزفر: تعود إلى الأول بما بقي من الثلاث في النكاح الأول.\n• لو طلقها ثلاثاً فقالت: قد انقضت عدتي وتحللت والمدة تحتمله وغلب على ظنه صدقها جاز له أن يتزوجها، لأن خبر الواحد في الأمور الدينية مقبول."}]}, {"id": "n14", "title": "باب الخلع (ص 111–116)", "lessons": [{"title": "الخلع: تعريفه ودليله وأثره", "body": "• لغةً: القلع والإزالة، قال تعالى: «فاخلع نعليك»، ومنه خلع القميص إذا أزاله. وشرعاً: إزالة الزوجية بما تعطيه من المال.\n• كيفيته: أن تفتدي المرأة نفسها بمال ليخلعها به، فإذا فعلا لزمها المال ووقعت تطليقة بائنة.\n• الأصل في جوازه قوله تعالى: «فلا جناح عليهما فيما افتدت به».\n• تقع تطليقة بائنة لقوله ﷺ: «الخلع تطليقة بائنة»، ولأنه كناية فيقع به بائناً ولا يحتاج إلى نية، لدلالة الحال، ولأنها ما رضيت ببذل المال إلا لتملك نفسها وتخرج من نكاحه وذلك بالبينونة. وهو مذهب عمر وعثمان وعلي وابن مسعود.\n\nالخلع من جانب الزوج: تعليق الطلاق بقبولها:\n• فلا يصح رجوعه عنه، ولا يبطل بقيامه من المجلس، ويصح مع غيبتها فإذا بلغها كان لها خيار القبول في مجلس علمها.\n• ويجوز تعليقه بالشرط والإضافة إلى الوقت كقوله: إذا قدم فلان فقد خالعتك على ألف.\n\nالخلع من جانب الزوجة: تمليك بعوض كالبيع:\n• فيصح رجوعها قبل قبوله، ويبطل بقيامها من المجلس، ولا يتوقف حال غيبته، ولا يجوز التعليق منها بشرط ولا إضافة إلى وقت.\n• لو خالعها بألف على أنه بالخيار ثلاثة أيام فالخيار باطل. وإن قال: على أنها بالخيار فكذلك عندهما. وعند أبي حنيفة الخيار لها صحيح فإن ردّته في الثلاث بطل الخلع، لأن الخلع طلاق من جانبه تمليك من جانبها فيجوز الخيار لها دونه."}, {"title": "أخذ العوض وما يصلح بدلاً في الخلع", "body": "أخذ العوض:\n• يُكره أن يأخذ منها شيئاً إن كان هو الناشز (الكاره الذي يسيء عشرتها)، قال تعالى: «وإن أردتم استبدال زوج مكان زوج… فلا تأخذوا منه شيئاً».\n• وإن كانت هي الناشزة كُره له أن يأخذ أكثر مما أعطاها، لقصة جميلة (أو حبيبة) بنت سهل زوجة ثابت بن قيس: قالت: لا أنا ولا هو، فقال ﷺ: «أتردين عليه حديقته؟» قالت: نعم وزيادة. قال: «أما الزيادة فلا». فقال: «يا ثابت خذ منها ما أعطيتها ولا تزد وخلّ سبيلها»، فنزل: «فلا جناح عليهما فيما افتدت به». رواه البخاري.\n• وإن أخذ أكثر مما أعطاها حل له بمطلق الآية.\n• وكذلك إن طلقها على مال فقبلت وقع الطلاق بائناً.\n\nما يصلح بدلاً:\n• يلزمها المال بالتزامها، لأنه ما رضي بالطلاق إلا ليسلم له المال المسمى.\n• ما صلح مهراً صلح بدلاً في الخلع، لأن البضع حال الدخول متقوّم دون حال الخروج، فإذا صلح بدلاً للمتقوم فلغير المتقوم أولى.\n• إذا بطل البدل (كخمر أو ميتة): في الخلع يكون بائناً وفي الطلاق على مال يكون رجعياً. أما وقوع الطلاق فلأنه علقه بقبولها وقد وُجد، والبينونة في الخلع لأنه كناية، والرجعي في الطلاق لأنه صريح. ولا يجب للزوج عليها شيء لأن البضع لا قيمة له عند الخروج وهي ما سمّت له مالاً فيغتر به.\n• بخلاف ما إذا خالعها على هذا الدن من الخل فإذا هو خمر فيرجع، لأنها سمّت له مالاً فاغتر به."}, {"title": "مسائل التغرير في الخلع", "body": "• قالت: خالعني على ما في يدي، وليس في يدها شيء: فلا شيء عليها، لأنها لم تُسمِّ مالاً فلم تغره. وكذا لو قالت: على ما في بيتي وليس في بيتها شيء.\n• قالت: على ما في يدي من مال، أو على ما في بيتي من متاع، ولا شيء في يدها ولا متاع في بيتها: ردّت عليه مهرها.\n• الأصل: أنها متى أطمعته في مال متقوّم فلم يسلم له لفقده رجع عليها بالمهر، لأنها غرّته، والمغرور يرجع على الغارّ بالمبدل، فإذا فات المشروط زال ملكه مجاناً فيلزمها أداء المبدل (ملك البضع) وقد عجزت عن رده فيلزمها رد قيمته وهو المهر.\n• لو خالعها بما لها عليه من المهر ولم يبق لها عليه شيء لزمها رد المهر، وإن علم الزوج أنه لا مهر لها عليه ولا متاع في البيت لا يلزمها شيء."}]}, {"id": "n15", "title": "باب الظهار وكفارته (ص 118–125)", "lessons": [{"title": "الظهار: تعريفه وحكمه ودليله", "body": "• لغةً: مشتق من «الظهر» يقال: ظاهر يظاهر ظهاراً. وأصله قول الرجل لامرأته: أنت عليّ كظهر أمي، ثم انتقل إلى غيره من الأعضاء ومن المحرمات.\n• شرعاً: أن يشبّه امرأته أو عضواً يُعبَّر به عن بدنها (كالرأس والوجه) أو جزءاً شائعاً منها (كالثلث والربع) بعضو لا يحل النظر إليه من أعضاء من لا يحل له نكاحها على التأبيد (كأمه وبنته وجدته وعمته وخالته وأخته).\n• حكمه: حرمة الجماع ودواعيه حتى يكفّر، تحرزاً عن الوقوع فيه كما في الإحرام. وكان في الجاهلية طلاقاً فجعله الشرع موجباً حرمة متناهية بالكفارة.\n• دليله: حديث خولة بنت ثعلبة (وقيل بنت خويلد) زوجة أوس بن الصامت، وكان أول ظهار في الإسلام، فجاءت إلى النبي ﷺ تشكو فقال لها: «حرمت عليه»، فجعلت تشكو إلى الله فاقتها وصبية صغاراً، فنزل قوله تعالى: «قد سمع الله قول التي تجادلك في زوجها…».\n• الظهار جائز ممن يجوز طلاقه من المسلمين، ولا يكون من المطلقة بائناً لأنها حرام عليه.\n• لو جامع قبل التكفير استغفر الله تعالى ولا يعد حتى يكفّر، لحديث ابن عباس: رجل ظاهر من امرأته فرأى خلخالها في القمر فوقع عليها فأخبر النبي ﷺ فقال: «استغفر الله ولا تعد حتى تكفّر». ولا شيء عليه غير الاستغفار."}, {"title": "العود وما يلزم المرأة ومسائل الظهار", "body": "• العَوْد الذي تجب به الكفارة: أن يعزم على وطئها، لقوله ﷺ: «ولا تعد حتى تكفر».\n• لا يحل قربانها ولو بعد زوج آخر حتى يكفّر.\n• يجب عليها أن تمنع نفسها منه لأنه حرام، وتطالبه بالكفارة ويجبره القاضي عليها إيفاءً لحقها.\n• لو قال: أنا منك مظاهر أو ظاهرت منك: صار مظاهراً لأنه صريح.\n• لو قالت المرأة لزوجها: أنت عليّ كظهر أمي: قال محمد: ليس بشيء لأن المرأة لا تملك التحريم كالطلاق. وقال أبو يوسف: عليها كفارة لأنها من أهل الكفارة. وقال الحسن بن زياد: كفارة يمين.\n• لو قال: أنت عليّ مثل أمي أو كأمي: كناية يرجع إلى نيته: فإن أراد الكرامة صُدّق، وإن أراد الظهار فظهار، وإن أراد الطلاق فواحدة بائنة، وإن لم تكن له نية فليس بشيء. وقال محمد: هو ظهار.\n• لو قال: أنتن عليّ كظهر أمي لنسائه: فعليه لكل واحدة كفارة لأن الحرمة تثبت في كل واحدة والكفارة لإنهاء الحرمة فتتعدد بتعددها.\n• وإن ظاهر منها مراراً في مجلس واحد أو مجالس فعليه لكل ظهار كفارة كما في تكرار اليمين."}, {"title": "كفارة الظهار", "body": "الكفارة مرتبة على ثلاث مراتب:\n١) عتق رقبة قبل المسيس للنص.\n٢) فإن لم يجد ما يُعتق صام شهرين متتابعين لقوله تعالى: «فمن لم يجد فصيام شهرين متتابعين من قبل أن يتماسا». وليس فيهما رمضان ولا يوما العيد ولا أيام التشريق، لأن رمضان يقع عن الفرض لتعيّنه ولأن الصوم في غيره حرام فكان ناقصاً.\n٣) فإن لم يستطع الصيام أطعم ستين مسكيناً لقوله تعالى: «فمن لم يستطع فإطعام ستين مسكيناً»، ويُطعم كما في صدقة الفطر: لكل مسكين نصف صاع من بر (الصاع عند الحنفية ٣٫١٢٥ كجم)، أو قيمة ذلك. فإن غدّاهم وعشّاهم جاز ولا بد من شبعهم في الأكلتين.\n\nأحكام تتعلق بها:\n• إن جامعها في الشهرين ليلاً أو نهاراً عامداً أو ناسياً أو أفطر بعذر أو بغير عذر استقبل (استأنف الصوم). وقال أبو يوسف: إن جامع ليلاً عامداً أو نهاراً ناسياً لم يستأنف.\n• من له دين لا يقدر على استخلاصه كفّر بالصوم. والمعتبر حالة التكفير.\n• لو أطعم مسكيناً واحداً ستين يوماً أجزأه، لأن المعتبر دفع حاجة المسكين وهي تتجدد بتجدد اليوم. ولو أعطاه في يوم واحد عن الكل أجزأه عن يوم واحد.\n• لو غدّى ستين وعشّى ستين غيرهم لم يجزه إلا أن يعيد على ستين منهم غداءً أو عشاءً.\n• لو جامعها في خلال الإطعام لم يستأنف لأن النص لم يشترط فيه قبل المسيس.\n• من صام أربعة أشهر أو أطعم مائة وعشرين مسكيناً عن كفارتي ظهار أجزأه عنهما وإن لم يعيّن لاتحاد الجنس.\n• لو أطعم ستين مسكيناً كل مسكين صاعاً من بر عن كفارتين لم يجزه إلا عن واحدة عند أبي حنيفة وأبي يوسف. وقال محمد: يجزيه عنهما.\n• لو أطعم ذلك عن ظهار وإفطار أجزأه عنهما بالإجماع."}]}, {"id": "n16", "title": "باب العدة (ص 126–134)", "lessons": [{"title": "العدة: تعريفها وحكمها وأنواعها", "body": "• لغةً: مأخوذة من العدد والإحصاء. وسُئل ﷺ: متى تكون القيامة؟ قال: «إذا تكاملت العدتان» أي عدة أهل الجنة وعدة أهل النار.\n• شرعاً: تربص وانتظار يلزم المرأة عند زوال النكاح أو شبهته. وسُمي الزمان الذي تتربص فيه عدة لأنها تعدّ الأيام المضروبة عليها وتنتظر أوان الفرج الموعود لها.\n• حكمها: واجبة. والأصل في وجوبها قوله تعالى: «والمطلقات يتربصن بأنفسهن ثلاثة قروء»، و«والذين يتوفون منكم ويذرون أزواجاً يتربصن بأنفسهن أربعة أشهر وعشراً»، و«واللائي يئسن من المحيض من نسائكم إن ارتبتم فعدتهن ثلاثة أشهر»، و«وأولات الأحمال أجلهن أن يضعن حملهن».\n• أنواعها ثلاثة: الحيض، والشهور، ووضع الحمل. وتجب بثلاثة أشياء: الطلاق، والوفاة، والوطء (بشبهة)."}, {"title": "مقدار العدة بحسب حال المرأة", "body": "١) عدة المرأة التي تحيض في الطلاق والفسخ بعد الدخول: ثلاث حيض.\n٢) الصغيرة والآيسة: ثلاثة أشهر.\n٣) عدتهن في الوفاة: أربعة أشهر وعشرة أيام. والفرقة بالفسخ كالطلاق لأن العدة للتعرف عن براءة الرحم.\n٤) عدة الكل في الحمل: وضعه، لعموم قوله تعالى: «وأولات الأحمال أجلهن أن يضعن حملهن»، لأن المقصود التعرف عن براءة الرحم ولا براءة مع وجود الحمل ولا شغل بعد وضعه. وقال عمر: لو وضعت وزوجها على سريره لانقضت عدتها وحل لها أن تتزوج. وعن ابن مسعود أن سورة النساء القصرى (الطلاق) نزلت بعد آية البقرة.\n• إن أسقطت سقطاً استبان بعض خلقه انقضت به العدة وإلا فلا، لأنه إذا استبان فهو ولد، وإذا لم يستبن جاز أن يكون ولداً وغير ولد فلا تنقضي العدة بالشك.\n\nمن لا عدة عليهن:\n• لا عدة في الطلاق قبل الدخول لقوله تعالى: «فما لكم عليهن من عدة تعتدونها».\n• ولا عدة في نكاح الفضولي قبل الإجازة لأن النسب لا يثبت فيه.\n\nعدة النكاح الفاسد والوطء بشبهة: بالحيض في الموت والفرقة، ولا تجب عدة الوفاة لأنها ليست بزوجة.\n\nعدة امرأة الفارّ (من طلق امرأته في مرض موته بقصد حرمانها من الميراث): أبعد الأجلين في البائن، وعدة الوفاة في الرجعي. وقال أبو يوسف: ثلاث حيض في البائن."}, {"title": "تغير العدة والأقراء وابتداؤها", "body": "تغير العدة بتغير الصفة:\n• لو اعتدت الآيسة بالأشهر ثم رأت الدم، أو الصغيرة ثم رأته في خلال الشهور: استأنفت بالحيض. أما الآيسة فلأنها بالعود علمنا أنها غير آيسة، وأما الصغيرة فلأن الجمع بين الحيض والأشهر في عدة واحدة ممتنع (جمع بين البدل والمبدل)، كالمتيمم إذا وجد الماء في صلاته.\n• ولو اعتدت بحيضة أو حيضتين ثم أيست استأنفت بالشهور.\n\nالمراد بالأقراء:\n• الأقراء: الحيض، وهو قول أبي بكر وعمر وعلي وابن مسعود وابن عباس وأبي الدرداء وجماعة من التابعين. وقال زيد بن ثابت وابن عمر وعائشة: إنها الأطهار.\n• واسم القرء يقع على الحيض والطهر لغةً، وأصله الوقت لمجيء الشيء وذهابه.\n• وثمرة الخلاف: من قال الحيض لا تنقضي إلا باستكمال ثلاث حيض، ومن قال الأطهار تنقضي بالشروع في الحيضة الثالثة. والحمل على الحيض أولى بالنص (قوله ﷺ للمستحاضة: «دعي الصلاة أيام أقرائك» وقوله: «عدة الأمة حيضتان») وبالمعقول (لفظ الجمع).\n\nمتى تبدأ وتنتهي؟\n• ابتداء عدة الطلاق عقيبه والوفاة عقيبها، وتنقضي بمضي المدة وإن لم تعلم بهما. فإن أقر أنه طلق امرأته من وقت كذا فكذبته فمن وقت الإقرار، وإن صدقته فمن وقت الطلاق.\n• ابتداء عدة النكاح الفاسد: عقيب التفريق أو عزمه على ترك الوطء. وقال زفر: من آخر الوطآت.\n• أقل مدة العدة: شهران عند أبي حنيفة، وقال الصاحبان: تسعة وثلاثون يوماً وثلاث ساعات."}, {"title": "أقل مدة العدة وحد الإياس وخطبة المعتدة", "body": "أقل مدة العدة:\n• الصاحبان: تسعة وثلاثون يوماً (أقل الحيض ثلاثة أيام وأقل الطهر خمسة عشر يوماً).\n• أبو حنيفة يخرجه من طريقين: (رواية محمد) يعتبر أكثر الحيض عشرة: عشرة حيض ثم خمسة عشر طهر ثلاث مرات فذلك ستون يوماً. و(رواية الحسن بن زياد) يعتبر الوسط خمسة أيام فتكون ستين يوماً أيضاً.\n• لو وقع الطلاق لآيسة أو صغيرة أو الموت غرة الشهر اعتُبرت الشهور بالأهلة بالإجماع. وإن وقع في وسط الشهر اعتُبرت بالأيام عند أبي حنيفة فتعتد في الطلاق بتسعين يوماً وفي الوفاة بمائة وثلاثين يوماً.\n• لو قالت: انقضت عدتي صُدّقت لأنها أمينة، فإن كذبها الزوج حلفت كالمودَع.\n\nحد الإياس: قيل: يعتبر بأقرانها من قرابتها. والفتوى على خمس وخمسين سنة من غير فصل، وهو رواية الحسن عن أبي حنيفة. وعن محمد: ما بين خمس وخمسين إلى ستين.\n\nخطبة المعتدة:\n• لا ينبغي أن تُخطب المعتدة (كراهة تحريمية)، لقوله تعالى: «ولا جناح عليكم فيما عرضتم به من خطبة النساء».\n• لا بأس بالتعريض، وهو أن يتكلم بلفظ يحتمل الزواج وغيره، كقوله: إني فيك لراغب وأود أن أتزوجك ومثلك يُرغب فيه. وهو خاص بالمعتدة من وفاة. وقد دخل النبي ﷺ على أم سلمة وهي في العدة فذكر منزلته من الله.\n• والتصريح مكروه كقوله: أنكحك وأتزوج بك. قال تعالى: «ولكن لا تواعدوهن سراً».\n• هذا في المبتوتة والمتوفى عنها زوجها، أما المطلقة الرجعية فلا يجوز التصريح ولا التلويح لأن نكاح الأول قائم."}]}, {"id": "n17", "title": "فصل في الحداد (ص 135–138)", "lessons": [{"title": "الإحداد: تعريفه ومن يلزمها", "body": "• الإحداد (الحِداد): المدة التي تقضيها المرأة في حالة حزن على وفاة زوجها أو طلاق بائن.\n• يلزم المعتدة من نكاح صحيح عن وفاة أو طلاق بائن إذا كانت بالغة مسلمة.\n• الأصل فيه: أن امرأة مات عنها زوجها فجاءت إلى النبي ﷺ تستأذنه في الانتقال فقال: «كانت إحداكن تمكث في شر أحلاسها إلى الحول، أفلا أربعة أشهر وعشراً؟». وقال ﷺ: «لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحدّ على ميت فوق ثلاث إلا على زوج أربعة أشهر وعشراً». وروي أنه ﷺ نهى المعتدة أن تختضب بالحناء وقال: «الحناء طيب».\n• الحكمة: لما حرم عليها النكاح في العدة أُمرت بتجنب الزينة حتى لا تكون بصفة الملتمسة للأزواج، ولأنه إظهار للتأسف على فوات نعمة النكاح الذي كان سبب مؤنتها وكفايتها من النفقة والسكنى. وهذا موجود في المبتوتة والمتوفى عنها.\n• من لا إحداد عليهن: الصغيرة والمجنونة لعدم الخطاب (ولأنها عبادة فلا تجب على الكافرة). وليس في عدة النكاح الفاسد إحداد لأنه لا يُتأسف على زواله لأنه واجب الزوال."}, {"title": "ما يتركه الإحداد وأحكام الخروج والسكنى", "body": "معنى الإحداد: ترك الطيب والزينة والكحل والدهن والحناء إلا من عذر.\n• يدخل فيه الثوب المطيّب والمعصفر (المصبوغ بالعصفر) والمزعفر. ولو كان غسيلاً لا ينفض جاز.\n• إن لم يكن لها إلا ثوب مصبوغ لا بأس به لأنه عذر. ولا تلبس حلياً لأنه زينة.\n• لم يأذن النبي ﷺ للمبتوتة في الاكتحال، بخلاف التداوي لأنه عذر. وكذا إذا خافت من ترك الدهن والكحل حدوث مرض.\n\nالخروج:\n• لا تخرج المبتوتة من بيتها ليلاً ولا نهاراً لقوله تعالى: «لا تخرجوهن من بيوتهن ولا يخرجن»، ولأن نفقتها واجبة على الزوج فلا حاجة لها إلى الخروج. ولو اختلعت على ألا نفقة لها فالأصح أنها لا تخرج.\n• المعتدة عن وفاة تخرج نهاراً وبعض الليل وتبيت في منزلها، لأنه لا نفقة لها فتضطر إلى الخروج لإصلاح معاشها.\n\nالسكنى:\n• تعتد في البيت الذي كانت تسكنه حال وقوع الفرقة، لقوله تعالى: «من بيوتهن»، ولقوله ﷺ للتي قُتل زوجها: «اسكني في بيتك حتى يبلغ الكتاب أجله».\n• إلا أن ينهدم أو تُخرَج منه أو لا تقدر على أجرته فتنتقل. وروي أن علياً نقل ابنته أم كلثوم لما قُتل عمر، وعائشة نقلت أختها لما قُتل طلحة.\n• ولو أبانها والمنزل واحد يجعل بينه وبينها سترة، وكذلك الورثة في الوفاة، فإن لم يجعلوا انتقلت تحرزاً عن الفتنة.\n• إذا كان المطلِّق غائباً وطلب أهل المنزل الأجرة أعطتهم بإذن القاضي ويصير ديناً على الزوج."}]}, {"id": "n18", "title": "الحمل وثبوت النسب (ص 139–143)", "lessons": [{"title": "أقل مدة الحمل وثبوت النسب", "body": "• أقل مدة الحمل ستة أشهر. لما روي أن رجلاً تزوج امرأة فجاءت بولد لستة أشهر فهمّ عثمان برجمها، فقال ابن عباس: لو خاصمتكم بكتاب الله لخصمتكم، فإن الله تعالى يقول: «وحمله وفصاله ثلاثون شهراً»، وقال: «والوالدات يرضعن أولادهن حولين كاملين»، فبقي لمدة الحمل ستة أشهر.\n• إذا أقرت بانقضاء العدة ثم جاءت بولد لأقل من ستة أشهر ثبت نسبه، لأنه ظهر كذبها بيقين فصار كأنها لم تُقر به. وإن جاءت به لستة أشهر فأكثر لا يثبت لأنه لم يظهر كذبها فيكون من حمل حادث بعده.\n• لا يثبت نسب ولد المعتدة إلا بـ: شهادة رجلين، أو رجل وامرأتين، أو حبل ظاهر، أو اعتراف الزوج، أو تصديق الورثة.\n• وقال الصاحبان: يثبت بشهادة امرأة واحدة لأن الفراش قائم لقيام العدة وهو ملزم للنسب كقيام النكاح.\n• ولأبي حنيفة: أنها لو أقرت بوضع الحمل انقضت العدة والمنقضي لا يكون حجة فيحتاج إلى إثبات النسب فلا بد من حجة كاملة.\n• أما إذا ظهر الحبل أو اعترف به الزوج فالنسب ثابت قبل الولادة والحاجة إلى التعيين، ويثبت بشهادتها. وكذا إذا اعترف به الورثة بعد الموت.\n• أما النسب فإن كانوا من أهل الشهادة ثبت بشهادتهم، وإلا ثبت في حق غيرهم تبعاً للثبوت في حقهم."}]}, {"id": "n19", "title": "باب النفقة (ص 145–155)", "lessons": [{"title": "النفقة: تعريفها وسبب وجوبها وتقديرها", "body": "• النفقة لغةً: ما ينفقه الإنسان على عياله. وشرعاً: الطعام والكسوة والسكنى. وحكمها: واجبة.\n• الأصل في وجوب نفقة الزوجة: «أسكنوهن من حيث سكنتم من وجدكم»، و«لينفق ذو سعة من سعته»، و«وعلى المولود له رزقهن وكسوتهن بالمعروف»، و«الرجال قوامون على النساء بما أنفقوا من أموالهم». وقال ﷺ في حجة الوداع: «اتقوا الله في النساء… ولهن عليكم رزقهن وكسوتهن بالمعروف». وقال ﷺ لهند امرأة أبي سفيان: «خذي من مال زوجك ما يكفيك وولدك بالمعروف»، ولولا وجوبها عليه لما أمرها بذلك.\n• سبب وجوبها: احتباسها عند الزوج بحيث يتهيأ له الاستمتاع وطئاً أو دواعيه أو التحصين لمائه بعد زوال النكاح، لأنها لما صارت موجودة عنده عجزت عن الاكتساب والإنفاق على نفسها.\n• تجب للزوجة على زوجها إذا سلّمت إليه نفسها في منزله، فلها نفقتها وكسوتها وسكناها.\n\nتقدير النفقة:\n• تُعتبر بقدر حال الزوج لقوله تعالى: «لينفق ذو سعة من سعته»، اختاره الكرخي.\n• واختار الخصاف الاعتبار بحالهما: إن كانا موسرين فنفقة الموسر، وإن كانا معسرين فنفقة المعسر. وإن كانت موسرة وهو معسر فلها فوق نفقة المعسرة، وبالعكس فدون نفقة الموسرة. وإن كان أحدهما مفرطاً في اليسار والآخر في الإعسار يُقضى بنفقة الوسط.\n• القول قوله في إعساره لأنه منكر، والبينة بينتها لأنها مدعية.\n• هي مقدّرة بكفايتها بلا تقتير ولا إسراف لحديث هند، وليس فيها تقدير لازم لاختلافه باختلاف الأوقات والطباع والرخص والغلاء."}, {"title": "كيفية دفع النفقة والخادم والناشزة", "body": "• تُفرض لها نفقة كل شهر وتُسلَّم إليها، لأنه يتعذر القضاء بها كل ساعة ويتعذر لجميع المدة فقدّرناه بالشهر لأنه الوسط.\n• والكسوة كل ستة أشهر لأنه يحتاج إليها باختلاف الحر والبرد.\n• وللزوج أن يلي الإنفاق بنفسه إلا أن يظهر عند القاضي أنه لا ينفق عليها فيفرض لها كل شهر.\n• ويفرض لها نفقة خادم واحد، وليس له أن يعطيها من خدمه من يخدمها بغير رضاها (وهذا من أكبر الأدلة على تكريم الشريعة للزوجة). وقال أبو يوسف: لخادمين: أحدهما لداخل البيت والآخر لخارجه. وقيل: إن كانت من بنات الأشراف فلها خادمان.\n• وروى الحسن عن أبي حنيفة: إن كان الزوج معسراً لا يُفرض لها نفقة خادم، وإن لم يكن لها خادم أو كانت تخدم نفسها لا يُفرض.\n\nالناشزة:\n• إن نشزت المرأة فلا نفقة لها، لأن فاطمة بنت قيس نشزت على أحمائها فنقلها ﷺ إلى بيت ابن أم مكتوم ولم يجعل لها نفقة ولا سكنى. ولأن الموجب للنفقة الاحتباس وقد زال.\n• بخلاف ما إذا امتنعت من التمكين، فإنه لا يفوت الاحتباس وهو يقدر عليه كُرهاً. فإن عادت إلى منزله عادت النفقة.\n• إن منعت نفسها حتى يوفيها مهرها فلها النفقة، لأن لها الامتناع لتستوفي حقها فلو سقطت النفقة تضررت. وقال الصاحبان: إن كان بعد الدخول فلا نفقة لها.\n• لو سكن داراً غصباً فامتنعت أن تسكن معه فليست ناشزة. وإن كانت ساكنة في دارها فمنعته من دخولها وقالت: حوّلني إلى منزلك أو اكترِ لي داراً فلها النفقة.\n• إن مرضت في منزله فلها النفقة، وكذلك إذا جاءت إليه مريضة لأن الاحتباس موجود.\n• إذا طالبته بالنفقة قبل أن يحولها إلى منزله وهي بالغة فلها النفقة إذا لم يطالبها بالنقلة، فإن طالبها بالنقلة فامتنعت فلا نفقة لها إلا أن يكون بحق."}, {"title": "الإعسار وسقوط النفقة والنفقة من مال الغائب", "body": "الإعسار بالنفقة:\n• من أعسر بالنفقة لم يُفرَّق بينهما وتُؤمر بالاستدانة ليُحال عليه. لأن في التفريق إبطال حقه وفي الاستدانة تأخير حقها والإبطال أضر. فإذا فرض لها القاضي وأمرها بالاستدانة صارت ديناً عليه ورجعت في تركته لو مات. ولو استدانت بغير أمر القاضي كانت المطالبة عليها.\n\nتغير حال الزوج:\n• إذا قُضي لها بنفقة الإعسار ثم أيسر تمّم لها نفقة الموسر، وكذا العكس.\n\nسقوط النفقة عن المدة الماضية:\n• إذا مضت مدة ولم ينفق عليها سقطت إلا أن يكون قُضي بها أو صالحته على مقدارها. لأن النفقة لم تجب عوضاً عن البضع لأن المهر وجب عوضاً عنه والعقد الواحد لا يوجب عوضين، ولا عوضاً عن الاستمتاع لأنه تصرف في ملكه. فبقي وجوبها صلة ورزقاً (سماها الله رزقاً)، والصلات لا تُملك إلا بالتسليم أو بقضاء القاضي أو بالتزامه بالتراضي.\n• إن مات أحدهما بعد القضاء أو الاصطلاح قبل القبض سقطت لأنها صلة كالهبة قبل القبض.\n• إن أسلفها النفقة أو الكسوة ثم مات أحدهما لم يرجع بشيء. وقال محمد: يحتسب لها نفقة ما مضى وما بقي للزوج.\n\nالنفقة من مال الغائب:\n• إذا كان للغائب مال حاضر في منزله أو وديعة أو مضاربة أو دين وعلم القاضي به وبالنكاح أو اعترف بهما من المال في يده، فُرض فيه نفقة زوجته ووالديه وولده الصغير. وذلك إذا كان المال من جنس النفقة (كالدراهم والدنانير والطعام والكسوة).\n• ويحلّفها أنها ما أخذتها ويأخذ منها كفيلاً احتياطاً للغائب.\n• إن لم يعلم القاضي ولم يعترف من في يده المال فلا تُقبل بينتها. وقال زفر: تُقبل واستحسنوه للحاجة."}, {"title": "السكنى ونفقة المعتدة", "body": "السكنى:\n• عليه أن يسكنها داراً مفردة ليس فيها أحد من أهله، لأنها من الحوائج الأصلية والكفاية فتجب كالطعام، قال تعالى: «أسكنوهن». وتكون بين قوم صالحين ليعينوها على مصالح دنياها.\n• وليس له أن يشرك معها غيرها لأنها قد لا تأمن على متاعها ولا تتخلى لاستمتاعها، إلا أن تختار ذلك. ولو كان في الدار بيوت فأخلى لها بيتاً وجعل له مرافق وغلقاً على حدة فليس لها أن تطلب بيتاً آخر.\n\nنفقة المعتدة:\n١) المطلقة: لها النفقة والسكنى في عدتها بائناً كان أو رجعياً. أما الرجعي فلقيام النكاح، وأما البائن فلأنها محبوسة في حقه صيانةً للولد. وحديث فاطمة بنت قيس رده عمر وزيد وجابر وعائشة، قال عمر: لا ندع كتاب ربنا وسنة نبينا بقول امرأة لا ندري أصدقت أم كذبت، حفظت أم نسيت. وقد سمعت ﷺ يقول: «للمطلقة الثلاث النفقة والسكنى ما دامت في العدة».\n٢) المتوفى عنها زوجها: لا نفقة لها، لأنها محبوسة لحق الشرع لا للزوج، وأن المال انتقل إلى الورثة.\n٣) المفارقة بغير طلاق:\n  - كل فرقة من قِبل المرأة بمعصية (كالردة وتقبيل ابن الزوج) فلا نفقة لها.\n  - وإن كانت بغير معصية (كخيار البلوغ وعدم الكفاءة) فلها النفقة.\n  - وإن كانت من جهة الزوج فلها النفقة بكل حال.\n• وكذلك الفرقة باللعان أو الإيلاء بعد الدخول لها النفقة. وكل امرأة لا نفقة لها يوم الطلاق فلا نفقة لها في العدة كالمعتدة من نكاح فاسد.\n• المطلقة إذا لم تطلب نفقتها حتى انقضت عدتها سقطت. ولو صالحها على نفقة العدة إن كانت بالشهور جاز وإن كانت بالحيض لا يجوز لأنها مجهولة."}]}, {"id": "n20", "title": "الإنفاق على الأولاد والآباء وغيرهم (ص 156–163)", "lessons": [{"title": "نفقة الأولاد الصغار والآباء", "body": "نفقة الأولاد الصغار:\n• على الأب إذا كانوا فقراء، لقوله تعالى: «وعلى المولود له رزقهن وكسوتهن بالمعروف».\n• ليس على الأم إرضاع الصبي لأن أجرة الإرضاع من نفقته وهي على الأب، إلا إذا تعيّنت (بألا يجد غيرها أو لا يأخذ من لبن غيرها) فيجب عليها صيانةً للصغير عن الهلاك.\n• يستأجر الأب من ترضعه عندها لأن الأجرة عليه والحضانة لها.\n• فإن استأجر زوجته أو معتدته (الرجعية) لترضع ولدها لم يجز لأن الإرضاع مستحق عليها بالأصل لقوله تعالى: «والوالدات يرضعن أولادهن». وقيل في المبتوتة: يجوز لأن النكاح قد زال.\n• إذا لم يكن للصبي ولا لأبيه مال أُجبرت الأم على الإرضاع وترجع على الأب إذا أيسر. وإن كان للصبي مال فُرضت لها نفقة الإرضاع في ماله.\n• بعد انقضاء العدة هي أولى من الأجنبية لأنها أشفق، إلا أن تطلب زيادة أجرة.\n\nنفقة الآباء والأجداد:\n• تجب على الأولاد الذكور والإناث إذا كانوا فقراء. والأدلة:\n  ١) «فلا تقل لهما أف»: نهاه عن الإضرار بهما بهذا القدر وترك الإنفاق عند حاجتهما أكثر إضراراً.\n  ٢) «أنت ومالك لأبيك».\n  ٣) «إن أطيب ما أكل الرجل من كسبه وإن ولده من كسبه».\n  ٤) «وصاحبهما في الدنيا معروفاً» في حق الكافرين، وليس من المعروف تركهما جائعين.\n• تجب على الذكور والإناث على السواء في رواية وهو المختار، وقيل على قدر الإرث. ويُشترط فقرهم."}, {"title": "نفقة ذي الرحم وأحكام متفرقة", "body": "نفقة ذي الرحم المحرم (سوى الوالدين والولد):\n• تجب على قدر الميراث كالإخوة والأخوات والأعمام والعمات والأخوال والخالات، ولا تجب لرحم ليس بمحرم. لقوله تعالى: «وعلى الوارث مثل ذلك». وفي قراءة ابن مسعود: «وعلى الوارث ذي الرحم المحرم مثل ذلك» فيعتبر قدر الميراث ليكون الغُرم بالغُنم.\n• شروط وجوبها: أن يكون فقيراً به زمانة لا يقدر على الكسب، أو أنثى فقيرة، أو من لا يحسن الكسب لخرقه (جهله) أو لكونه من البيوتات أو طالب علم.\n• بخلاف الوالدين فتجب نفقتهما مع القدرة على الكسب لما يلحقهما من التعب.\n• رجل معسر له أولاد صغار محاويج وله ابن كبير موسر يُجبر على نفقتهم.\n• لا تجب النفقة مع اختلاف الدين إلا للزوجة وقرابة الولد (الأعلى والأسفل) لإطلاق النصوص، ولأن نفقة الزوجة جزاء الاحتباس وقرابة الولاد فيها معنى الجزئية.\n• نفقة زوجة الأب على ابنه (رواية هشام عن أبي يوسف). ونفقة زوجة الابن على أبيه إن كان صغيراً فقيراً أو زمناً. ويجب على الابن نفقة خادم الأب إذا احتاج إليه.\n• لا تجب النفقة على فقير إلا للزوجة والولد الصغير، لأن نفقة الزوجة مجازاة وهي تجب مع الفقر.\n• المعتبر في الغنى: الغنى المحرِّم للصدقة وهو المختار (أي ملك نصاب فاضل عن الحوائج الأصلية). وعن أبي يوسف: بالنصاب. وعن محمد: إذا فضل عن نفقة شهر له ولعياله.\n• إذا كان الأب معسراً والأم موسرة تُؤمر الأم بالنفقة على الولد ثم ترجع على الأب إذا أيسر.\n• إذا باع الأب متاع ابنه في نفقته جاز (عند أبي حنيفة) وقالا: لا يجوز. وفي العقار لا يجوز بالإجماع. ولو أنفق من مال له في يده جاز بالإجماع لأنه ظفر بجنس حقه.\n• إذا قضى القاضي بالنفقة ثم مضت مدة سقطت لأنها وجبت لدفع الحاجة وقد اندفعت، إلا أن يكون القاضي أمر بالاستدانة عليه.\n• سائر الحيوانات يُجبر مالكها عليها فيما بينه وبين الله تعالى، لما فيه من إضاعة المال وتعذيب الحيوان وقد ورد النهي عنهما (كحديث المرأة التي دخلت النار في هرة حبستها)."}]}, {"id": "n21", "title": "فصل في الحضانة (ص 168–173)", "lessons": [{"title": "الحضانة: تعريفها وحكمتها ومن هو الأحق بها", "body": "• لغةً: من الحضن وهو ما دون الإبط إلى الكشح، يقال: حضن الطائر بيضه يحضنه إذا ضمه إلى نفسه تحت جناحه. وشرعاً: تربية الأولاد والنظر في مصالحهم في ظل تعاليم الإسلام.\n• الحكمة: لما كان الصغير عاجزاً عن النظر في مصالح نفسه جعل الله ذلك إلى من يلي عليه، ففوّض الولاية في المال والعقود إلى الرجال لأنهم أقوم بذلك، وفوّض التربية إلى النساء لأنهن أشفق وأحنى وأقدر عليها.\n• إذا اختصم الزوجان في الولد قبل الفرقة أو بعدها فالأم أحق، لحديث المرأة التي قالت: يا رسول الله إن ابني هذا كان بطني له وعاء وحجري له حواء وثديي له سقاء وزعم أبوه أنه ينتزعه مني، فقال ﷺ: «أنت أحق به ما لم تنكحي».\n• وروى سعيد بن المسيب أن عمر طلق زوجته أم ابنه عاصم فتنازعا إلى أبي بكر فقال: «ريقها خير له من شهد وعسل عندك يا عمر»، ودفعه إليها والصحابة حاضرون. ولأنها أقوم بالتربية وأقدر عليها.\n• كل من له حضانة لا يُدفع إليه الولد ما لم يطلبه فعساه يعجز عنه، بخلاف الأب إذا امتنع عن أخذه بعد الاستغناء فيُجبر لأن الصيانة عليه."}, {"title": "ترتيب المستحقات وسقوط الحضانة", "body": "ترتيب المستحقات للحضانة بعد الأم:\n• ثم أمها (أم الأم)، ثم أم الأب، ثم الأخت لأبوين، ثم الأخت لأم، ثم الأخت لأب، ثم الخالات كذلك، ثم العمات كذلك، وبنات الأخت أولى من بنات الأخ، والخالات أولى من العمات.\n• الأصل: أن هذه الولاية تُستفاد من قِبل الأمهات فتقدّمت جهة الأم على جهة الأب، والجدات أقرب من الأخوات، والأخوات أقرب من الخالات والعمات. وروى محمد عن أبي حنيفة أن الخالة مقدمة على الأخت لأب لأن الخالة بمنزلة الأم، قال ﷺ: «الخالة والدة».\n• ولا حق لمن لهن رحم غير محرم كبنات الأعمام والعمات وبنات الأخوال والخالات.\n\nسقوط الحضانة بالزواج:\n• من لها الحضانة إذا تزوجت بأجنبي سقط حقها، لقوله ﷺ: «أنت أحق به ما لم تنكحي»، وفي حديث أبي بكر: «أمه أولى به ما لم يشبّ أو تتزوج». لأن الصبي يلحقه من زوج أمه جفاء. بخلاف ما إذا تزوجت بذي رحم محرم منه كعمه أو الجدة بالجد فلا تسقط.\n• فإن فارقته عاد حقها لزوال المانع. والقول قول المرأة في نفي الزوج لأنها تنكر بطلان حقها.\n\nمدة الحضانة:\n• الغلام عندهن حتى يستغني عن الخدمة (يأكل وحده ويشرب وحده ويلبس وحده ويستنجي وحده)، قدّره الخصاف بسبع سنين، وقدّره أبو بكر الرازي بتسع. وقال الصديق: «هي أحق به حتى يشب». وبعدها يحتاج إلى التأدب بآداب الرجال وتعلم القرآن والعلم والحرفة والأب أقدر.\n• الجارية عند الأم والجدة حتى تحيض (تبلغ)، وعند غيرهما حتى تستغني، لأنها تحتاج إلى التأدب بآداب النساء، فإذا بلغت احتاجت إلى الحفظ والصيانة والأب أقدر."}, {"title": "أحكام تتعلق بالحضانة", "body": "• إذا لم يكن للصغير امرأة أخذه الرجال صوناً له، وأولاهم أقربهم تعصيباً.\n• سُئل محمد: إذا اجتمع النساء ولهن أزواج؟ قال: يضعه القاضي حيث شاء لأنه لا حق لهن كمن لا قرابة له.\n• لا تُدفع الصبية إلى غير محرم كابن العم خوفاً من الوقوع في المعصية، ولا إلى محرم ماجن فاسق. فإن لم يكن لها إلا ابن عم فإن شاء القاضي ضمها إليه إن كان أصلح وإلا وضعها عند أمينة. ولو كان الأخ مخوفاً عليها وضعها القاضي عند امرأة ثقة.\n• الثيب المأمونة لها حق التفرد بالسكنى، فإن لم تكن مأمونة فالأب يضمها إليه. وليس للبكر حق التفرد، فإن دخلت في السن وكان لها رأي فلها أن تنفرد.\n• إذا اجتمع مستحقو الحضانة في درجة واحدة فأورعهم أولى ثم أكبرهم.\n• ليس للأب أن يخرج بولده من بلده حتى يبلغ حد الاستغناء، لما فيه من إبطال حق الأم في الحضانة.\n• وليس للأم ذلك إلا أن تخرجه إلى وطنها وقد وقع عقد الزواج فيه، لأن التزوج فيه دليل التزام المقام في بلدها."}]}, {"id": "n22", "title": "كتاب الأيمان (ص 176–185)", "lessons": [{"title": "الأيمان: تعريفها وأنواعها", "body": "• الأيمان جمع يمين. واليمين لغةً: القوة («لأخذنا منه باليمين» أي بالقوة)، وهي الجارحة (اليد اليمنى)، وهي مطلق الحلف.\n• شرعاً نوعان:\n  ١) القسم: وهو ما يقتضي تعظيم المقسَم به، فلا يجوز إلا بالله تعالى، قال ﷺ: «من كان حالفاً فليحلف بالله أو ليذر». وفيها المعنى اللغوي (الحلف والقوة) لأنهم يقوّون كلامهم ويوثقونه بالقسم بالله.\n  ٢) الشرط والجزاء: وهو تعليق الجزاء بالشرط على وجه ينزل الجزاء عند وجود الشرط، (مثل: امرأته طالق إن شرب الدخان). ثبت بالاصطلاح الشرعي، وفيه معنى القوة والتوثيق لأنه للحمل على الفعل أو المنع منه.\n• اليمين مشروعة في المعاهدات والخصومات توكيداً وتوثيقاً للقول. دليلها: «ولكن يؤاخذكم بما عقدتم الأيمان»، وقوله ﷺ: «لا تحلفوا بآبائكم ولا بالطواغيت، من كان حالفاً فليحلف بالله أو ليذر». والأفضل أن يقلل الحلف بالله.\n• الحلف بغير الله: قيل يُكره، وقيل: إن أُضيف إلى المستقبل لا يُكره وإلى الماضي يُكره (وهو حسن).\n\nأنواع اليمين بالله ثلاثة:\n١) الغموس: الحلف على أمر ماضٍ أو حاضر يتعمد فيه الكذب، فلا كفارة فيها.\n٢) اللغو: الحلف على أمر يظنه كما قال وهو بخلافه، فنرجو ألا يؤاخذه الله بها.\n٣) المنعقدة: الحلف على أمر في المستقبل ليفعله أو يتركه، فإذا حنث فيها فعليه الكفارة."}, {"title": "الغموس واللغو", "body": "اليمين الغموس:\n• ليست يميناً حقيقة لأن اليمين عقد مشروع وهذه كبيرة، وتسميتها يميناً مجاز لوجود صورتها، كما نهى ﷺ عن بيع الحر وسماه بيعاً مجازاً.\n• سُميت غموساً لأنها تغمس صاحبها في نار جهنم، ولذلك لا كفارة فيها.\n• اليمين على الماضي: والله ما فعلت كذا وهو يعلم أنه فعله. وعلى الحال: والله ما لهذا عليّ دين وهو يعلم أن له عليه.\n• أثرها: لا تنعقد ولا كفارة فيها وإنما التوبة والاستغفار وأمره إلى الله. قال ﷺ: «خمس من الكبائر لا كفارة فيهن: الشرك بالله، وعقوق الوالدين، وبهت المسلم، والفرار من الزحف، واليمين الغموس». وقال ﷺ: «اليمين الفاجرة تدع الديار بلاقع».\n• ولأن الكفارة عبادة تتأدى بالصوم ويُشترط فيها النية فلا تتعلق بها، ولأن الله أوجب الكفارة بقوله: «بما عقدتم الأيمان» والعقد ما يتصور فيه الحل والعقد وذلك لا يتصور في الماضي.\n\nيمين اللغو:\n• كقوله: والله ما دخلت الدار أو ما كلمت زيداً يظنه كذلك وهو بخلافه. ويكون في الحال أيضاً.\n• الأصل فيه قوله تعالى: «لا يؤاخذكم الله باللغو في أيمانكم».\n• وحكى محمد عن أبي حنيفة أن اللغو ما يجري بين الناس من قولهم: لا والله وبلى والله، وعن عائشة مثله موقوفاً ومرفوعاً. وعن ابن عباس: هو الحلف على يمين كاذبة وهو يرى أنه صادق.\n• قول محمد «نرجو ألا يؤاخذه الله» جوابه: أن العلماء اختلفوا في تفسير اللغو، وأن الرجاء قد يكون رجاء تواضع.\n• روى ابن رستم عن محمد: لا يكون اللغو إلا في اليمين بالله. وعبّر الكرخي: ما كان المحلوف به هو الذي يلزمه بالحنث فلا لغو فيه."}, {"title": "اليمين المنعقدة وكفارتها", "body": "أنواع اليمين المنعقدة:\n١) ما يجب فيه البر كفعل الفرائض ومنع المعاصي، لأنه فرض عليه فيتأكد باليمين.\n٢) ما يجب فيه الحنث كفعل المعاصي وترك الواجبات، قال ﷺ: «من حلف أن يطيع الله فليطعه ومن حلف أن يعصيه فلا يعصه».\n٣) ما الحنث فيه خير من البر، قال ﷺ: «من حلف على يمين ورأى غيرها خيراً منها فليأت التي هي خير وليكفّر عن يمينه»، لأن الحنث ينجبر بالكفارة ولا جابر للمعصية.\n٤) ما هما فيه على السواء، فحفظ اليمين فيه أولى لقوله تعالى: «واحفظوا أيمانكم».\n\nكفارة اليمين:\n• إذا حنث في الأيمان المستقبلة فعليه الكفارة لقوله تعالى: «ولكن يؤاخذكم بما عقدتم الأيمان فكفارته…».\n• إن شاء أعتق رقبة (وهو غير متوافر في زماننا)، وإن شاء أطعم عشرة مساكين، أو كساهم. فإن لم يجد صام ثلاثة أيام متتابعات. وقرأ ابن مسعود: «ثلاثة أيام متتابعات»، وقراءته مشهورة فكانت كالخبر المشهور.\n• الكسوة: ما يُكتسى به، والمقصود رد العري، وكل ثوب يصير به مكتسياً. وعن أبي حنيفة وأبي يوسف: أدناه ما يستر عامة بدنه فلا يجوز السراويل. وعن محمد: أدناه ما تجوز فيه الصلاة فلا يجوز الخف ولا القلنسوة. وقيل: لكل مسكين إزار ورداء وقميص.\n• ما يجزيه في الكسوة يجزيه عن الإطعام باعتبار القيمة إذا نواه.\n• لا تتأدى الكفارة إلا بفعل يزيل ملكه عن العين ليكون زاجراً، فلا بد من التمليك، ولو أعاره لا يجوز. بخلاف الطعام فتجوز فيه الإباحة.\n• لو كفّر عنه غيره بأمره جاز وبغير أمره لا يجوز.\n• لا يجوز التكفير قبل الحنث لقوله ﷺ: «وليكفّر عن يمينه»، والأمر يقتضي الوجوب ولا وجوب قبل الحنث، ولأن الكفارة ساترة والستر يعتمد ذنباً ولم يوجد قبل الحنث.\n• القاصد والمكره والناسي في اليمين سواء، لقوله ﷺ: «ثلاث جدهن جد وهزلهن جد: الطلاق والنكاح والأيمان»، وعن عمر: أربعة لا رديدى فيهن وعد منها الأيمان. وروي أن المشركين استحلفوا حذيفة وأباه ألا يعينا رسول الله ﷺ فقال: «نفي لهم بعهدهم ونستعين الله عليهم». ولا يصح يمين الصبي والمجنون والنائم."}]}, {"id": "n23", "title": "حروف القسم (ص 186–193)", "lessons": [{"title": "حروف القسم وما تنعقد به اليمين", "body": "• حروف القسم: الباء والواو والتاء، وهو المعهود المتوارث، وقد ورد بها القرآن: «والله ربنا ما كنا مشركين»، «فوربك لا يؤمنون»، «تالله لتسألن». و«لله» يمين أيضاً لأن اللام تبدل من الباء.\n• الأصل: الباء للإلصاق وضعاً، والواو بدل عنها لأنه للجمع وفي الإلصاق معنى الجمع، والتاء بدل من الواو. فالباء تصلح للقسم في اسم الله وسائر الأسماء وفي الكناية (بك لأفعلن)، والواو في الأسماء الصريحة دون الكناية، والتاء تختص باسم الله وحده.\n• تُضمر الحروف فتقول: الله لا أفعل كذا، وقد حلّف النبي ﷺ الذي طلق امرأته البتة: «الله ما أردت بالبتة إلا واحدة؟».\n\nالحلف في الإثبات والنفي:\n• في الإثبات: والله لقد فعلت كذا أو والله لأفعلنّ، مقروناً بالتأكيد (اللام والنون). فلو قال: والله أفعل كذا اليوم فلم يفعله لا تلزمه الكفارة لأن الحلف في الإثبات لا يكون إلا بحرف التأكيد.\n• في النفي: والله لا أفعل كذا أو والله ما فعلت كذا.\n\nبم تكون اليمين؟\n• اليمين بالله تعالى وبأسمائه، ولا تحتاج إلى نية إلا فيما يسمى به غيره كالحكيم والعليم فتحتاج إلى النية. وقيل: لا تحتاج في جميع أسمائه.\n• الأيمان مبنية على العرف: فما تعارف الناس الحلف به يكون يميناً وما لا فلا، لأن الحقيقة العرفية قاضية على اللغوية.\n• وبصفات ذاته كعزة الله وجلاله وكبريائه. إلا: وعلم الله فلا يكون يميناً (للاحتمال)، وكذلك: ورحمة الله وسخطه وغضبه ليس بيمين.\n• وعن محمد: (وأمانة الله) يمين. وعن أبي يوسف: ليس بيمين لاحتمال أنه أراد الفرائض."}, {"title": "ما يُعد يميناً وما لا يُعد", "body": "• الحلف بغير الله تعالى ليس بيمين كالنبي والقرآن والكعبة، والبراءة منه يمين.\n• الأصل: أن الحلف بغير الله لا يجوز، لحديث عمر لما سمعه ﷺ يحلف بأبيه فقال: «إن الله ينهاكم أن تحلفوا بآبائكم»، وقال: «من حلف بغير الله فقد أشرك». فلا يلزمه به كفارة لأنه ليس بيمين.\n• القرآن: المجموع المكتوب في المصحف بالعربية، وهو غير الله وغير صفاته. فلو حلف بكلام الله كان يميناً لأن كلامه صفة قائمة بذاته أزلية (مذهب أهل السنة والجماعة).\n• كذلك: دين الله وطاعة الله وشرائعه وأنبياؤه وملائكته وعرشه وحدوده والصلاة والصوم والحج والبيت والكعبة والصفا والمروة والحجر الأسود والقبر والمنبر، لأنها غير الله تعالى. قال أبو حنيفة: لا يُحلف إلا بالله متجرداً بالتوحيد والإخلاص.\n• البراءة من ذلك يمين: كقوله: إن فعلت كذا فأنا بريء من القرآن أو الكعبة أو النبي، لأن البراءة من هذه الأشياء كفر. وأصله: أن كل ما يكون اعتقاده كفراً ولا تحلّه الشريعة ففيه الكفارة إذا حنث.\n• «وحق الله» ليس بيمين عند أبي حنيفة ومحمد (لحديث: حق الله على عباده أن يعبدوه…). وعن أبي ي
