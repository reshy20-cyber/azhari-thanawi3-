عمال إلى الله", "أي الإسلام خير", "أفضل الصلاة", "أعظم الذنوب"], "answer": 1, "explain": "السؤال: أي الإسلام خير؟", "unit": "h1"}, {"q": "الخصلتان اللتان ذكرهما النبي ﷺ في الجواب هما:", "options": ["الصلاة والصوم", "إطعام الطعام وقراءة السلام", "الجهاد والصدقة", "الذكر وتلاوة القرآن"], "answer": 1, "explain": "قال ﷺ: تطعم الطعام وتقرأ السلام.", "unit": "h1"}, {"q": "المقصود بـ«أي الإسلام خير»:", "options": ["أي أعمال الإسلام أفضل", "أي الأيام أفضل", "أي الناس أفضل", "أي الأماكن أفضل"], "answer": 0, "explain": "أي: أي أعمال الإسلام خير.", "unit": "h1"}, {"q": "قُدِّم إطعام الطعام على إفشاء السلام لأن:", "options": ["السلام ليس مهماً", "بذل المعونة المادية أشق في العادة", "الطعام فرض دائماً", "السلام يكون للأغنياء فقط"], "answer": 1, "explain": "بدأ بما هو أصعب على النفس.", "unit": "h1"}, {"q": "«السلام» في قوله «تقرأ السلام» من حيث الإعراب:", "options": ["فاعل مرفوع", "مفعول به منصوب", "مبتدأ", "مجرور"], "answer": 1, "explain": "السلامَ: مفعول به منصوب لـ«تقرأ».", "unit": "h1"}, {"q": "جمعت الخصلتان بين:", "options": ["المكارم المالية والأخلاقية", "العبادة والجهاد", "العلم والعمل", "الصبر والشكر"], "answer": 0, "explain": "الطعام مكرمة مالية والسلام مكرمة أخلاقية.", "unit": "h1"}, {"q": "قيل إن الرجل السائل في الحديث هو:", "options": ["أبو بكر", "أبو ذر", "عمر", "بلال"], "answer": 1, "explain": "قيل: هو أبو ذر رضي الله عنه.", "unit": "h1"}, {"q": "قوله «على من عرفت ومن لم تعرف» يدل على:", "options": ["تخصيص السلام بالأصدقاء", "عموم السلام لكل المسلمين", "تحريم السلام على الغرباء", "السلام للصغار فقط"], "answer": 1, "explain": "السلام يعمّ من عرفت ومن لم تعرف.", "unit": "h1"}, {"q": "من الأحاديث الشاهدة على التأليف بين القلوب حديث:", "options": ["عبد الله بن سلام: أفشوا السلام وأطعموا الطعام", "أنس: إنما الأعمال بالنيات", "عمر: بني الإسلام على خمس", "أبو هريرة: الدين النصيحة"], "answer": 0, "explain": "حديث عبد الله بن سلام فيه: أفشوا السلام وأطعموا الطعام وصلوا والناس نيام تدخلوا الجنة بسلام.", "unit": "h1"}]}, "fiqh_shafii": {"units": [{"id": "s1", "title": "الخلع (ص 9–14)", "lessons": [{"title": "التعريف والحكم والدليل", "body": "• لغة: مشتق من خلع الثوب، لأن كلاً من الزوجين لباس للآخر، فكأنه بفراقه نزع لباسه.\n• شرعاً: فرقة بين الزوجين ولو بلفظ المفاداة، بعوض مقصود يعود إلى جهة الزوج.\n• الحكم: جائز على عوض معلوم. فإن كان العوض مجهولاً وقع الخلع بائناً بمهر المثل.\n\nالدليل:\n١) الكتاب: قوله تعالى: «فلا جناح عليهما فيما افتدت به» (البقرة: ٢٢٩).\n٢) السنة: خبر البخاري في امرأة ثابت بن قيس، قال لها النبي ﷺ: «اقبل الحديقة وطلقها تطليقة»، وهو أول خلع وقع في الإسلام.\n٣) الإجماع على مشروعية الخلع بعوض معلوم."}, {"title": "حكمة المشروعية", "body": "١) لما جاز للزوج أن يملك الانتفاع بالبُضع بعوض (المهر)، جاز له أن يزيل هذا الملك بعوض أيضاً، فالنكاح كالشراء والخلع كالبيع.\n٢) فيه غالباً دفع الضرر عن الزوجة."}, {"title": "أثر الخلع وحكم طلبه", "body": "أثره:\n• تملك المرأة نفسها (بُضعها) بسبب العوض الذي بذلته.\n• لا رجعة للزوج عليها في العدة، فلا تعود إليه إلا بعقد نكاح جديد بأركانه وشروطه.\n• يصح عوض الخلع قليلاً كان أو كثيراً، ديناً أو عيناً أو منفعة.\n\nحكم طلب الزوجة الخلع:\n• جائز لكنه مكروه، لما فيه من قطع النكاح المطلوب شرعاً، وقد قال ﷺ: «أبغض الحلال إلى الله تعالى الطلاق».\n• ويُستثنى من الكراهة حالتان:\n  1) أن يخاف الزوجان أو أحدهما ألا يقيما حدود الله.\n  2) أن يحلف بالطلاق الثلاث على فعل شيء لا بد له منه، فيخلعها ثم يفعل ما حلف عليه."}, {"title": "أركان الخلع وشروطها", "body": "أركان الخلع خمسة:\n١) ملتزم للعوض: يُشترط فيه إطلاق التصرف المالي.\n٢) بُضع.\n٣) عوض.\n٤) صيغة: يُشترط فيها ما سبق في البيع، ولا يضر هنا تخلل كلام يسير.\n٥) زوج: يُشترط فيه صحة طلاقه."}, {"title": "ألفاظ الخلع ووقته وأحكام متفرقة", "body": "ألفاظه:\n• الأصح أن لفظي الخلع والمفاداة صريحان في الطلاق إن ذُكر معهما المال، فيشعر بالبينونة. وإن لم يُذكر المال فهما كنايتان.\n\nوقته:\n• يجوز الخلع في الطهر الذي جامعها فيه، وفي الحيض أيضاً، لأنها ببذلها الفداء رضيت بتطويل العدة.\n\nطلاق المختلعة في عدتها:\n• لا يلحقها طلاق ولا إيلاء ولا ظهار، لأنها صارت أجنبية.\n• بخلاف الرجعية، فيلحقها الطلاق إلى انقضاء العدة لبقاء سلطنة الزوج عليها.\n\nمسائل:\n• قال: إن أبرأتني من صداقك فأنتِ طالق، فأبرأته وهي جاهلة بقدره: لم تطلق، لأن الإبراء لم يصح.\n• خالعها على ما في كفها ولم يكن فيه شيء: وقع بائناً بمهر المثل."}, {"title": "الاختلاف في دعوى الخلع", "body": "• ادّعت الزوجة الخلع وأنكر الزوج: يُصدَّق الزوج بيمينه، لأن الأصل عدم الخلع، فإن أقامت بينة رجلين عُمل بها ولا مال عليها.\n• ادّعى الزوج الخلع وأنكرت: بانت بقوله ولا عوض عليها، وتحلف على نفي العوض ولها نفقة العدة. فإن أقام بينة ثبت المال.\n• اختلفا في عدد الطلاق أو في جنس العوض أو قدره ولا بينة: تحالفا كالمتبايعين، ويجب مهر المثل."}]}, {"id": "s2", "title": "الطلاق (ص 15–29)", "lessons": [{"title": "التعريف والدليل والأركان", "body": "• الطلاق لغة: حل القيد. وشرعاً: حل عقد النكاح بلفظ الطلاق ونحوه.\n• عرّفه النووي بأنه تصرف مملوك للزوج يحدثه بلا سبب فيقطع النكاح.\n\nالدليل: قوله تعالى: «الطلاق مرتان فإمساك بمعروف أو تسريح بإحسان» (البقرة: ٢٢٩)، وقوله ﷺ: «ليس شيء من الحلال أبغض إلى الله تعالى من الطلاق»، والإجماع.\n\nأركانه خمسة: صيغة، ومحل (وهو الزوجة)، وولاية، وقصد، ومطلِّق."}, {"title": "شروط المطلِّق", "body": "يُشترط في المطلِّق ولو بالتعليق شرطان:\n١) التكليف: فلا يصح من غير المكلف لخبر «رُفع القلم عن ثلاثة: عن الصغير حتى يكبر، وعن المجنون حتى يفيق، وعن النائم حتى يستيقظ». ويُستثنى السكران فيصح طلاقه تغليظاً عليه.\n٢) الاختيار: فلا يصح من مُكرَه لخبر «لا طلاق في إغلاق» أي إكراه.\n\nأربعة لا يقع طلاقهم: الصبي، والمجنون، والنائم، والمكره. ويُلحق بالمجنون المعتوه (ناقص العقل). وخالف أبو حنيفة في المكره فقال بوقوع طلاقه."}, {"title": "صيغة الطلاق: الصريح والكناية", "body": "الطلاق ضربان:\n١) الصريح: ما لا يحتمل ظاهره غير الطلاق، فلا يحتاج إلى نية. وألفاظه ثلاثة: الطلاق، والفراق، والسراح، وما اشتق منها (كطلقتك، وأنت طالق، ويا مطلقة، وفارقتك، وسرحتك). أما «أنت الطلاق» أو «أنت طلاق» فكناية لأنها مصادر.\n• وترجمة لفظ الطلاق بغير العربية صريحة لشهرة استعمالها، أما ترجمة الفراق والسراح فكناية.\n• لو قال: لم أنوِ الطلاق، لم يُقبل منه في الصريح.\n٢) الكناية: ما يحتمل الطلاق وغيره، فتحتاج إلى نية الطلاق إجماعاً. ومن ألفاظها: أنت خلية، أنت بتة، أنت بائن، أنت حرام، أنت كالميتة، اغربي.\n• فإن نوى الطلاق وقع، وإن لم ينوِ لم يقع.\n\nالنية بلا لفظ: لا يقع طلاق بنية من غير لفظ، ولا بتحريك اللسان دون أن يُسمع نفسه."}, {"title": "الطلاق بالإشارة وأحكامه الخمسة", "body": "• إشارة الناطق لغو ولا يقع بها طلاق وإن فهمها كل أحد، لأن عدوله عن العبارة إلى الإشارة يُفهم أنه غير قاصد للطلاق.\n• يُعتد بإشارة الأخرس ولو قدر على الكتابة.\n\nينقسم الطلاق إلى الأحكام الخمسة:\n• واجب: كطلاق الحكمين في الشقاق.\n• مندوب: كطلاق زوجة حالها غير مستقيم، كغير العفيفة.\n• حرام: كالطلاق البدعي.\n• مكروه: كطلاق مستقيمة الحال، وعليه يُحمل «أبغض الحلال إلى الله الطلاق».\n• مباح: كطلاق من لا يهواها الزوج ولا تسمح نفسه بمؤنتها من غير استمتاع بها."}, {"title": "الطلاق السني والبدعي", "body": "النساء في الطلاق ضربان:\n١) ضرب في طلاقهن سنة وبدعة: وهن ذوات الحيض (المدخول بهن غير الحوامل).\n• السني: أن يطلقها في طهر لم يجامعها فيه، ولا في حيض قبله، لأنه يعقبه الشروع في العدة ولا ندم. قال تعالى: «فطلقوهن لعدتهن».\n• البدعي (حرام): أن يطلقها في الحيض أو في طهر جامعها فيه وهي ممن تحبل، لأنه يطيل عليها مدة التربص ويؤدي إلى الندم إذا ظهر الحمل.\n٢) ضرب ليس في طلاقهن سنة ولا بدعة، وهن أربع: الصغيرة، والآيسة، والحامل، والمختلعة التي لم يُدخل بها.\n\nما يُطلب ممن طلق بدعياً: تُسنّ له الرجعة، ثم إن شاء طلق بعد تمام طهر. ودليله أن ابن عمر طلق امرأته وهي حائض، فقال النبي ﷺ لعمر: «مُره فليراجعها ثم ليطلقها طاهراً».\nوتعليق الطلاق لا يحرم في الحيض."}, {"title": "عدد الطلقات والاستثناء", "body": "عدد الطلقات: يملك الزوج على زوجته ثلاث تطليقات. والاعتبار في الطلاق بالزوج: «الطلاق بالرجال والعدة بالنساء». ولا يحرم جمع الطلقات الثلاث.\n\nالاستثناء في الطلاق صحيح لوروده في القرآن والسنة وكلام العرب، وشروطه خمسة:\n١) أن يصله باليمين.\n٢) أن ينويه قبل فراغه من اليمين.\n٣) أن يقصد به رفع حكم اليمين.\n٤) أن يتلفظ به مسمعاً نفسه.\n٥) ألا يكون مستغرقاً.\n\nأمثلة:\n• أنت طالق ثلاثاً إلا ثلاثاً: لا يصح الاستثناء وتطلق ثلاثاً.\n• أنت طالق خمساً إلا ثلاثاً: يقع طلقتان.\n• أنت طالق ثلاثاً إلا نصف طلقة: يقع ثلاثاً، لأن بعض الطلقة يكمل."}, {"title": "تعليق الطلاق والمحل القابل له", "body": "يصح تعليق الطلاق بالصفة والشرط.\n• بالصفة: كقوله أنت طالق في شهر كذا، فتطلق مع أول جزء من الليلة الأولى منه. وأنت طالق في آخر شهر كذا: تطلق بآخر جزء منه.\n• بالشرط: وأدواته كثيرة: إنْ (وهي أم الباب)، ومَن، وإذا، ومتى، وكلما، وأي، ومهما، وأين، وحيثما للأمكنة، وكيف للأحوال.\n\nالمحل: لا يقع الطلاق قبل النكاح، حتى لو علّقه عليه، لقوله ﷺ: «لا طلاق إلا بعد نكاح»."}, {"title": "شروط الإكراه", "body": "يحصل الإكراه بتحقق ثلاثة شروط:\n١) قدرة المكرِه على تحقيق ما هدد به عاجلاً ظلماً بولاية أو تغلب.\n٢) عجز المكرَه عن دفعه بهرب أو استغاثة أو غيرها.\n٣) ظنه أنه إن امتنع حقق المكرِه ما خوفه به.\n\nويحصل بالتخويف بضرب شديد أو حبس طويل أو إتلاف مال، ويختلف باختلاف الأشخاص والأسباب.\n\nلا يقع طلاق المكره لقوله ﷺ: «إن الله وضع عن أمتي الخطأ والنسيان وما استُكرهوا عليه». لكن إن ظهرت قرينة اختيار منه (كأن أُكره على ثلاث فطلق واحدة، أو على صريح فكنّى ونوى) وقع الطلاق، لأن مخالفته تشعر باختياره.\nولو قال: طلّق زوجتي وإلا قتلتك، فطلقها وقع على الصحيح."}]}, {"id": "s3", "title": "الرجعة (ص 30–36)", "lessons": [{"title": "التعريف والدليل والأركان", "body": "• الرجعة (بفتح الراء أفصح): لغة المرة من الرجوع. وشرعاً: رد المرأة إلى النكاح من طلاق غير بائن في العدة على وجه مخصوص.\n\nالدليل:\n• قوله تعالى: «وبعولتهن أحق بردهن في ذلك» أي في العدة.\n• قوله ﷺ لعمر في حفصة: «أتاني جبريل فقال: راجع حفصة فإنها صوامة قوامة، وإنها زوجتك في الجنة».\n• الإجماع.\n\nأركانها ثلاثة: محل، ومرتجِع، وصيغة. وأما الطلاق فهو سبب وليس ركناً."}, {"title": "شروط صحة الرجعة (المحل)", "body": "شروط المحل ستة، ذكر المصنف أربعة:\n١) أن يكون الطلاق دون الثلاث.\n٢) أن يكون بعد الدخول بها، فإن كان قبله فلا رجعة لبينونتها.\n٣) ألا يكون الطلاق بعوض (كالخلع)، فإن كان بعوض فلا رجعة.\n٤) أن تكون الرجعة قبل انقضاء العدة.\n٥) أن تكون المطلقة قابلة للحل للمراجع، فلو أسلمت الكافرة وبقي زوجها على كفره لم تصح مراجعته، وكذلك لا تصح مراجعة المرتدة في حال ردتها.\n٦) أن تكون معيّنة، فلو طلق إحدى زوجتيه وأبهم ثم راجع إحداهما لم تصح الرجعة، لأنها تُشبه النكاح وهو لا يصح مع الإبهام. وكذلك لو عيّنها ثم نسيت لم تصح رجعتها في الأصح."}, {"title": "ما يتعلق بصحة الرجعة وشروط المرتجِع", "body": "• إذا طلق امرأته واحدة أو اثنتين بعد الدخول وبلا عوض، فله مراجعتها بغير إذنها ما لم تنقض عدتها، لقوله تعالى: «وبعولتهن أحق بردهن في ذلك».\n\nشروط المرتجِع (الركن الثاني): الاختيار وأهلية النكاح بنفسه. فتصح رجعة السكران والسفيه والمحرم، ولا تصح رجعة المجنون ولا المكره."}, {"title": "صيغة الرجعة وانقضاء العدة", "body": "الصيغة (الركن الثالث): لفظ يشعر بالمراد به. وهي نوعان:\n١) صريحة: كقوله رددتكِ إليّ، وراجعتكِ، وارتجعتكِ، وأرجعتكِ، وأمسكتكِ.\n٢) كناية: كتزوجتكِ ونكحتكِ، ويُشترط فيها التنجيز وعدم التأقيت. فلو قال: راجعتك إن شئتِ، فقالت: شئت، أو قال: راجعتك شهراً، لم تحصل الرجعة.\n\nيُسنّ الإشهاد على الرجعة خروجاً من خلاف من أوجبه، ولم يجب لأنها في حكم استدامة النكاح السابق، أما النكاح فيجب فيه الإشهاد لإثبات الفراش.\n\nإذا انقضت العدة (بوضع حمل أو أقراء أو أشهر): حلّ له نكاحها بعقد جديد، لأنها بانت منه. وتكون معه على ما بقي من عدد الطلاق، فلو طلقها مرة ثم راجعها بقي له طلقتان، وإن كانت الثانية بقيت له تطليقة واحدة."}, {"title": "حكم من طلق ثلاثاً", "body": "إذا طلقها ثلاثاً (معاً أو مرتباً) لم تحل له إلا بعد وجود خمسة شروط:\n١) انقضاء عدتها منه.\n٢) تزويجها بغيره.\n٣) دخول الزوج الثاني بها.\n٤) بينونتها منه بطلاق أو فسخ أو موت.\n٥) انقضاء عدتها منه لاستبراء رحمها."}]}, {"id": "s4", "title": "الإيلاء (ص 37–43)", "lessons": [{"title": "التعريف والحكم والدليل والأركان", "body": "• الإيلاء لغة: الحلف. وشرعاً: حلف زوج يصح طلاقه على الامتناع من وطء زوجته مطلقاً، أو مدة تزيد على أربعة أشهر.\n• دليله: قوله تعالى: «للذين يؤلون من نسائهم تربص أربعة أشهر» (البقرة: ٢٢٦).\n• حكمه: حرام، لما فيه من الإيذاء.\n\nأركانه ستة: حالف، ومحلوف به، ومحلوف عليه، ومدة، وصيغة، وزوجان."}, {"title": "متى يكون الحالف مولياً", "body": "إذا حلف الزوج بالله تعالى أو بصفة من صفاته، أو بالتزام ما يلزمه بنذر، أو بتعليق طلاق، ألا يطأ زوجته وطئاً شرعياً مطلقاً أو مدة تزيد على أربعة أشهر فهو مُولٍ.\n\nأمثلة:\n• والله لا أطؤك (مطلقاً): مولٍ.\n• والله لا أطؤك خمسة أشهر: مولٍ.\n• والله لا أطؤك حتى ينزل عيسى عليه السلام، أو حتى أموت أو تموتي: مولٍ، لأنها مدة بعيدة الحصول.\n\nلا يكون مولياً في هذه الصور:\n• إن حلف على الامتناع من التمتع بغير وطء.\n• إن كانت المحلوف على ترك وطئها غير زوجة.\n• إن حلف لا يطؤها مدة وسكت عن تحديدها، لتردد اللفظ بين القليل والكثير.\n• إن حلف لا يطؤها أربعة أشهر فقط، لأنها تصبر عن الزوج هذه المدة، لكنه يأثم إثم الإيذاء لا إثم الإيلاء.\n\nلو قال: والله لا أطؤك أربعة أشهر، فإذا مضت فوالله لا أطؤك أربعة أشهر: ليس بمول لأنها يمين واحدة. ولو قال: والله لا أطؤك خمسة أشهر، فإذا مضت فوالله لا أطؤك ستة أشهر: فإيلاءان لكل منهما حكمه."}, {"title": "صيغة الإيلاء", "body": "• شرط الصيغة: أن تكون بلفظ يشعر بالإيلاء.\n• الصريح: كقوله والله لا أطؤكِ، أو لا أجامعك. فإن قال: أردت بالوطء الوطء بالقدم، وبالجماع الاجتماع، لم يُقبل في الظاهر ويُدَيَّن فيما بينه وبين الله.\n• الكناية: كقوله والله لا أمسك أو لا أباشرك، فتحتاج إلى نية الوطء لعدم اشتهارها فيه.\n\nمما يُلحق بالصيغة:\n• قال: إن وطئتك فضرتك طالق، فهو مول من المخاطبة، فإن وطئها في مدة الإيلاء أو بعدها طلقت الضرة.\n• قال: والله لا أطؤك سنة إلا مرة، فهو مول إن وطئ وبقي من السنة أكثر من أربعة أشهر، فإن بقي أربعة أشهر فأقل فليس بمول بل حالف."}, {"title": "مدة الإيلاء وما يقطعها", "body": "• تُؤجَّل للمولي أربعة أشهر من حين الإيلاء، وفي الإيلاء من الرجعية من حين الرجعة.\n• ذكر المصنف أن التأجيل يتوقف على سؤال الزوجة، لكن ما عليه الشافعي والأصحاب أن المدة تُحسب بنفسها دون سؤال ولا ضرب القاضي، لثبوتها بنص القرآن.\n\nما يقطع المدة:\n١) الردة بعد الدخول من أحدهما (لارتفاع النكاح أو اختلاله).\n٢) مانع من الوطء بالزوجة، حسي أو شرعي (غير الحيض) كالمرض والجنون والنشوز والصوم الفرض والإحرام والاعتكاف الواجب. وتُستأنف المدة بعد زوال المانع ولا تُبنى على ما مضى."}, {"title": "ما بعد انتهاء المدة", "body": "إذا مضت المدة ولم يطأ من غير مانع، خُيّر المولي بين:\n١) الفيئة: أي الوطء، وسُمّي فيئة لأنه من فاء إذا رجع.\n٢) التكفير لليمين إن كان حلفه بالله.\n٣) الطلاق.\n\nمطالبة الزوجة: تطالبه أولاً بالفيئة، فإن لم يفئ طالبته بالطلاق، لقوله تعالى: «وإن عزموا الطلاق فإن الله سميع عليم». ولو تركت حقها فلها المطالبة بعد ذلك لتجدد الضرر.\n\nإن امتنع من الفيئة والطلاق: طلّق عليه الحاكم طلقة نيابة عنه، فيقول: أوقعتُ على فلانة طلقة، أو حكمتُ عليه في زوجته بطلقة. ولا إجبار على الفيئة لأنها لا تدخلها النيابة.\n• لو طلق الزوج والحاكم معاً وقع الطلاقان.\n• لو طلق الحاكم مع الفيئة لم يقع الطلاق.\n• لو اختلفا في الإيلاء أو في انقضاء مدته فأنكر الزوج، صُدّق بيمينه لأن الأصل عدمه.\n• لو اعترفت الزوجة بالوطء بعد المدة وأنكره، سقط حقها في الطلب."}]}, {"id": "s5", "title": "الظهار (ص 44–50)", "lessons": [{"title": "التعريف والحكم والدليل والأركان", "body": "• الظهار لغة: مأخوذ من الظهر، لأن صورته الأصلية أن يقول لزوجته: أنت عليّ كظهر أمي. وكان طلاقاً في الجاهلية، فغيّر الشرع حكمه إلى تحريمها بعد العود ولزوم الكفارة.\n• شرعاً: تشبيه الزوج زوجته في الحرمة بمحرَّمة عليه.\n• دليله: قوله تعالى: «الذين يظاهرون منكم من نسائهم ما هن أمهاتهم».\n• حكمه: من الكبائر، لقوله تعالى: «وإنهم ليقولون منكراً من القول وزوراً».\n\nأركانه أربعة: صيغة، ومظاهِر، ومظاهَر منها، ومشبَّه به."}, {"title": "الصيغة وشروط الأركان", "body": "الصيغة: أن يقول الزوج لزوجته: أنتِ عليّ (أو مني أو معي أو عندي) كظهر أمي.\n• صريح: كأنتِ عليّ كظهر أمي، أو كرأس أمي، أو كيدها.\n• كناية: كأنتِ كأمي أو كعينها، مما يُذكر للكرامة.\n\nشرط المظاهِر: أن يكون زوجاً يصح طلاقه، فلا يصح الظهار من غير زوج. قال تعالى: «من نسائهم».\nشرط المظاهَر منها: أن تكون زوجة ولو صغيرة أو مجنونة أو رجعية، لا أجنبية ولو مختلعة. فلو قال لأجنبية: إن نكحتك فأنتِ عليّ كظهر أمي لم يصح.\n\nشرط المشبَّه به: كل أنثى محرّمة أو جزء أنثى محرّمة بنسب أو رضاع أو مصاهرة، لم تكن حلاً للزوج، كبنته وأخته من النسب، ومرضعة أبيه أو أمه، وزوجة أبيه التي نكحها قبل ولادته.\n• فلا يصح التشبيه بالذكر والخنثى لأنه ليس محل التمتع.\n• ولا بمن كانت حلاً له كزوجة ابنه.\n• ولا بأزواج النبي ﷺ لأن تحريمهن لشرفه لا للمحرمية."}, {"title": "العود والكفارة", "body": "العود: إذا قال المظاهر ذلك ولم يتبعه بالطلاق، بأن أمسكها زمناً يمكنه فيه الفرقة ولم يفعل، صار عائداً. لأن تشبيهها بالأم يقتضي ألا يمسكها زوجة، فإذا أمسكها فقد خالف ما قال.\n\nإذا صار عائداً لزمته الكفارة، لقوله تعالى: «ثم يعودون لما قالوا فتحرير رقبة».\n\nمسائل:\n• إن كرر لفظ الظهار قاصداً التأكيد فليس بعود على الأصح.\n• لا عود إن اتصلت بالظهار فرقة بطلاق بائن أو رجعي بلا مراجعة، أو فسخ، أو جنّ الزوج عقب ظهاره.\n• لا تسقط الكفارة بعد العود بفرقة.\n• لو قال لزوجاته الأربع: أنتن عليّ كظهر أمي، فأمسكهن زمناً يسع طلاقهن، لزمه أربع كفارات."}, {"title": "أقسام الكفارة وخصال كفارة الظهار", "body": "الكفارة مأخوذة من الكفر وهو الستر، لسترها للذنب.\n• نوعان: مخيّرة في أولها مرتبة في آخرها، وهي كفارة اليمين. ومرتبة في كلها، وهي كفارة القتل والجماع في نهار رمضان والظهار.\n\nخصال كفارة الظهار على الترتيب:\n١) عتق رقبة مؤمنة.\n٢) فإن لم يجد: صيام شهرين متتابعين، ويُحسبان بالهلال. وتجب نية الكفارة لكل يوم مع تبييت النية. ويفوت التتابع بفوات يوم بلا عذر، أما العذر كالمرض المسوّغ للفطر فلا يضر.\n٣) فإن لم يستطع الصوم لهرم أو مرض يدوم أو شهوة شديدة: فإطعام ستين مسكيناً، لكل مسكين مُدّ، من غالب قوت البلد، مع تمليكهم إياه بالسوية.\n\nولا يحل للمظاهر مطلقاً وطء زوجته حتى يكفّر، لقوله تعالى: «من قبل أن يتماسا».\n\nالظهار المؤقت يصح، ويحصل العود فيه بالوطء في المدة لا بالإمساك."}]}, {"id": "s6", "title": "العدد والإحداد (ص 51–59)", "lessons": [{"title": "تعريف العدة وحكمتها", "body": "• العِدد: جمع عدة، مأخوذة من العدد لاشتمالها على عدد من الأقراء أو الأشهر غالباً.\n• شرعاً: اسم لمدة تتربص فيها المرأة لمعرفة براءة رحمها، أو للتعبد، أو لتفجعها على زوجها.\n• حكمتها: صيانة الأنساب وتحصينها من الاختلاط، ورعاية حق الزوجين والولد والناكح الثاني. والمغلَّب فيها التعبد، بدليل أنها لا تنقضي بقرء واحد مع حصول البراءة به."}, {"title": "عدة المتوفى عنها", "body": "المعتدة ضربان: متوفى عنها، وغير متوفى عنها.\n\nالمتوفى عنها:\n• إن كانت حاملاً بولد يلحق الميت: فعدتها بوضع الحمل (انفصال كله، حتى ثاني التوأمين)، لقوله تعالى: «وأولات الأحمال أجلهن أن يضعن حملهن». واستدل بقصة سبيعة الأسلمية حين وضعت بعد موت زوجها بليال فقال لها النبي ﷺ: «قد حللتِ فانكحي من شئت».\n• إن كانت حائلاً (غير حامل): فعدتها أربعة أشهر وعشر ليال، وإن لم توطأ أو كانت صغيرة، لقوله تعالى: «والذين يتوفون منكم ويذرون أزواجاً يتربصن بأنفسهن أربعة أشهر وعشراً». وتُعتبر الأشهر بالأهلة ما أمكن.\n• لو مات عن مطلقة رجعية انتقلت إلى عدة وفاة، أما المطلقة البائن فلا تنتقل لأنها ليست زوجة."}, {"title": "عدة غير المتوفى عنها", "body": "غير المتوفى عنها: المعتدة عن فرقة بطلاق أو فسخ أو رضاع أو لعان.\n١) الحامل: عدتها بوضع الحمل، لقوله تعالى: «وأولات الأحمال أجلهن أن يضعن حملهن».\n٢) الحائل من ذوات الحيض: عدتها ثلاثة قروء، لقوله تعالى: «والمطلقات يتربصن بأنفسهن ثلاثة قروء». والقروء في الاصطلاح هي الأطهار كما روي عن عمر وعلي وعائشة رضي الله عنهم. فإن طُلقت في طهر وبقي منه شيء انقضت عدتها بالطعن في حيضة ثالثة، وإن طُلقت في حيض انقضت بالطعن في حيضة رابعة.\n٣) الصغيرة والآيسة: عدتها ثلاثة أشهر هلالية، لقوله تعالى: «واللائي يئسن من المحيض من نسائكم إن ارتبتم فعدتهن ثلاثة أشهر واللائي لم يحضن».\n• إن طُلقت في أثناء شهر كُمّل من الشهر الرابع ثلاثين يوماً.\n٤) المطلقة قبل الدخول: لا عدة عليها، لقوله تعالى: «إذا نكحتم المؤمنات ثم طلقتموهن من قبل أن تمسوهن فما لكم عليهن من عدة تعتدونها»."}, {"title": "ما يجب للمعتدة", "body": "• المعتدة الرجعية (ولو حائلاً): لها السكنى والنفقة والكسوة وسائر حقوق الزوجية، لبقاء حبس النكاح وسلطنته. وتسقط بنشوزها.\n• البائن الحائل (بخلع أو ثلاث في غير نشوز): لها السكنى دون النفقة. فلا سكنى لمن أبانها ناشزة، إلا إن عادت إلى الطاعة.\n• البائن الحامل: لها النفقة بسبب الحمل على أظهر القولين، ما لم تنشز.\n• المتوفى عنها: لا نفقة لها وإن كانت حاملاً، لخبر «ليس للحامل المتوفى عنها زوجها نفقة»."}, {"title": "الإحداد", "body": "• يجب على المتوفى عنها زوجها الإحداد، لخبر الصحيحين: «لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحدّ على ميت فوق ثلاث إلا على زوج أربعة أشهر وعشراً».\n• الإحداد لغة: المنع. واصطلاحاً: الامتناع من الزينة والطيب.\n\nما يُمنع منه في الإحداد:\n• الزينة في البدن بحلي الذهب والفضة، كبيراً كالخلخال والسوار أو صغيراً كالخاتم والقرط.\n• الطيب في البدن أو الثوب، وكذا في الطعام والكحل. وضابطه: كل ما حرم على المحرم.\n• الكحل بالإثمد لما فيه من الزينة، أما الكحل الأبيض كالتوتياء فلا يحرم.\n• الثوب المصبوغ للزينة.\n• دهن شعر الرأس.\n\nويجوز استعمال قليل من القسط والأظفار (نوعان من البخور) عند الطهر من الحيض أو النفاس. ويجوز الاكتحال بالإثمد والصبر للحاجة كالرمد، فتكتحل ليلاً وتمسحه نهاراً."}, {"title": "ملازمة البيت", "body": "• يجب على المتوفى عنها زوجها والمبتوتة (البائن ببينونة صغرى أو كبرى) ملازمة البيت الذي كانت فيه عند الفرقة، لقوله تعالى: «لا تخرجوهن من بيوتهن ولا يخرجن إلا أن يأتين بفاحشة مبينة».\n• ليس للزوج ولا لغيره إخراجها، ولا لها الخروج منه وإن رضي الزوج إلا لعذر، لأن في العدة حقاً لله تعالى لا يسقط بالتراضي.\n• أما الرجعية فللزوج إسكانها حيث شاء في موضع يليق بها.\n\nيجوز لها الخروج لحاجة: وضابطها كل معتدة لا تجب نفقتها ولا من يقضي حاجتها، فتخرج نهاراً لشراء طعام وقطن وبيع غزل ونحوه. وللتأنس إلى دار جارتها بشرط أن ترجع وتبيت في بيتها. أما من وجبت نفقتها (رجعية أو بائن حامل) فلا تخرج إلا بإذن أو ضرورة."}]}, {"id": "s7", "title": "الرضاع (ص 60–67)", "lessons": [{"title": "التعريف والدليل والأركان", "body": "• الرضاع (بفتح الراء ويجوز كسرها) لغة: اسم لمص الثدي وشرب لبنه.\n• شرعاً: اسم لحصول لبن امرأة أو ما حصل منه في معدة طفل أو دماغه.\n• دليل التحريم: قوله تعالى: «وأمهاتكم اللاتي أرضعنكم وأخواتكم من الرضاعة»، وقوله ﷺ: «يحرم من الرضاع ما يحرم من النسب»، والإجماع.\n\nأركانه ثلاثة: مرضِعة، ورضيع، ولبن."}, {"title": "شروط المرضِعة", "body": "• أن تكون آدمية (امرأة)، خلية أو مزوجة.\n• أن تكون حية حياة مستقرة حال انفصال لبنها. فلبن الميتة لا يحرّم، خلافاً للأئمة الثلاثة.\n• أن تكون قد بلغت تسع سنين قمرية تقريباً. فلو ظهر لصغيرة دون ذلك لبن وارتضع به طفل فلا تحريم.\n• ولو حُلب لبنها قبل موتها وأُوجر لطفل بعد موتها حرّم، لانفصاله في الحياة.\n• لبن البهيمة لا يثبت به تحريم، فلو ارتضع صغيران من شاة لا تثبت بينهما أخوة.\n• ولا يضر تغير اللبن بحموضة أو غيرها."}, {"title": "شروط الرضيع", "body": "شروط الرضاع المحرِّم أربعة:\n١) أن يكون الرضيع دون الحولين، لخبر «لا رضاع إلا ما كان في الحولين». ويُعتبر الحولان بالأهلة، وقال تعالى: «والوالدات يرضعن أولادهن حولين كاملين لمن أراد أن يتم الرضاعة».\n٢) أن يرضع خمس رضعات متفرقات. دليله حديث عائشة عند مسلم: «كان فيما أنزل الله عشر رضعات معلومات يحرّمن، فنُسخن بخمس معلومات». وتُضبط الرضعة بالعرف.\n٣) وصول اللبن إلى المعدة، فلو لم يصل فلا تحريم، ولو وصل ثم تقيأه ثبت التحريم.\n٤) أن يكون الرضيع حياً، فلا أثر لوصول اللبن إلى معدة الميت.\n\nأحكام ضبط الرضعة:\n• لو قطع الرضيع الارتضاع إعراضاً عن الثدي ثم عاد تعددت الرضعة.\n• إن قطع للهو أو نوم خفيف أو تنفس وعاد في الحال فرضعة واحدة.\n• لو حُلب منها اللبن خمس مرات وأُوجره دفعة فرضعة واحدة.\n• لو شك: هل رضع خمساً أو أقل، أو هل رضع في الحولين أو بعدهما؟ فلا تحريم، لأن الأصل عدمه."}, {"title": "أثر الرضاع: ما يحرم", "body": "• تصير المرضعة أماً للرضيع، ويصير زوجها (الذي ينسب إليه الولد) أباً له، لأن الرضاع تابع للنسب. أما من لا ينسب إليه الولد كالزاني فلا تثبت به حرمة من جهته.\n• تنتشر الحرمة من المرضعة والفحل إلى أصولهما وفروعهما وحواشيهما.\n• وتنتشر من الرضيع إلى فروعه فقط (أولاده)، فلا تسري إلى آبائه وإخوته. فلأبي الرضيع وأخيه نكاح المرضعة وبناتها.\n\nما يحرم على الرضيع: التزويج إلى المرضعة وإلى كل من ناسبها، لقوله تعالى: «وأمهاتكم اللاتي أرضعنكم».\nما يحرم على المرضعة: التزويج إلى الرضيع وولده وإن سفل، دون من كان في درجته كأخيه ولا من كان أعلى منه كأبيه.\n\nوالمحرمات بالنسب سبع، واثنتان بالرضاع، وهذا من المحرمات على التأبيد."}, {"title": "إثبات الرضاع وفوائد", "body": "• يثبت الرضاع بشهادة رجلين، أو رجل وامرأتين، أو أربع نسوة، لاختصاص النساء بالاطلاع عليه غالباً. هذا إذا كان الإرضاع من الثدي، أما إن كان بالشرب من إناء أو بإيجار فلا تُقبل فيه شهادة النساء المتمحضات.\n• الإقرار بالرضاع لا بد فيه من رجلين.\n\nفائدة:\n• لو حكم حاكم بالتحريم برضعة أو رضعتين لا يُنقض حكمه، وهو المعتمد.\n• لو حكم بثبوت الرضاع بعد الحولين يُنقض حكمه، لأن عدم التحريم بعد الحولين بالنص."}]}, {"id": "s8", "title": "الحضانة (ص 68–75)", "lessons": [{"title": "التعريف والأهمية", "body": "• الحضانة (بفتح الحاء) لغة: الضم، مأخوذة من الحِضن وهو الجنب، لضم الحاضنة الطفل إليها.\n• شرعاً: تربية من لا يستقل بأموره بما يصلحه ويقيه عما يضره، ولو كبيراً مجنوناً، كأن يتعهده بغسل جسده وثيابه ودهنه وكحله وربط الصغير في المهد وتحريكه لينام.\n• هي نوع ولاية وسلطنة، لكن الإناث أليق بها لأنهن أشفق وأهدى إلى التربية وأصبر على القيام بها."}, {"title": "الأحق بحضانة الولد قبل التمييز", "body": "إذا فارق الرجل زوجته بطلاق أو فسخ أو لعان ولهما ولد لا يميز (ذكراً أو أنثى أو خنثى) فالأم أحق بحضانته إلى سبع سنين لوفور شفقتها.\n\nالترتيب:\n١) الأم.\n٢) أمهات الأم الوارثات وإن علت، فتقدّم القربى فالقربى.\n٣) أمهات الأب كذلك.\n٤) الأخت.\n٥) الخالة.\n٦) بنت الأخت.\n٧) بنت الأخ.\n٨) العمة.\n\nويُقدَّم الأخت والخالة والعمة لأبوين على من كانت لأب، لزيادة قرابتهن، ثم لأب على من كانت لأم، لقوة الجهة.\nولا حضانة لغير الوارثات، وهي من أدلت بذكر بين أنثيين كأم أبي الأم."}, {"title": "التخيير بعد التمييز", "body": "• بعد التمييز يُخيَّر المميز ندباً بين أبويه إن صلحا للحضانة، فأيهما اختار سُلِّم إليه، لأن النبي ﷺ خيّر غلاماً بين أبيه وأمه، والغلامة كالغلام. ولأن المقصد الحفظ والمميز أعرف بحفظه.\n• سن التمييز غالباً سبع أو ثمان سنين، لكن مداره على التمييز نفسه لا على السن.\n• له بعد اختيار أحدهما التحول إلى الآخر وإن تكرر، لأنه قد يظهر له خلاف ما ظنه. إلا إن غلب على الظن أن تكرره لقلة تمييزه فيترك عند من كان عنده قبل التمييز.\n\nإن اختار الذكر أباه:\n• لم يمنعه من زيارة أمه، ولا يكلفها الخروج لزيارته، لئلا يكون ساعياً في العقوق وقطع الرحم.\n• يكون عند أبيه نهاراً ليعلمه الأمور الدينية والدنيوية، وعند أمه ليلاً.\n\nإن اختارت الأنثى أباها:\n• يمنعها من زيارة أمها (للصيانة وعدم البروز)، والأم أولى بالخروج لزيارتها.\n• وإن اختارت أمها فعندها ليلاً ونهاراً، ويزورها الأب على العادة.\n\nإن اختارهما معاً أُقرع بينهما، وإن لم يختر واحداً منهما فالأم أولى."}, {"title": "شروط استحقاق الحضانة", "body": "ذكر المصنف سبعة وهي في الحقيقة اثنا عشر شرطاً:\n١) العقل: فلا حضانة لمجنون وإن تقطع جنونه، لأنها ولاية وليس من أهلها. فإن كان الجنون يسيراً كيوم في سنة لم تسقط.\n٢) الدين (الإسلام): فلا حضانة لكافر على مسلم، وتثبت للكافر على الكافر.\n٣) العفة و٤) الأمانة: فلا حضانة لفاسق، فإن الفاسق لا يلي ولا يؤتمن. وتكفي العدالة الظاهرة.\n٥) الإقامة: أن يكون الأبوان مقيمين في بلد واحد. فإن سافر أحدهما سفر حاجة (كحج وتجارة) فالمقيم أولى. وإن كان السفر لنقلة فالعصبة أولى حفظاً للنسب إن أمن الطريق.\n٦) الخلو من زوج: فلا حضانة لمن تزوجت بأجنبي من الطفل، لحديث: «أنتِ أحق به ما لم تنكحي». فإن كان له حق في الحضانة كعم الطفل فلا يبطل حقها.\n٧) أن تكون مرضعة إن كان المحضون رضيعاً.\n٨) ألا تكون مصابة بمرض دائم يشغلها عن الكفالة.\n٩) ألا تكون برصاء أو جذماء.\n١٠) ألا تكون عمياء.\n١١) ألا تكون مغفلة.\n١٢) ألا تكون صغيرة."}, {"title": "سقوط الحضانة وما بعد البلوغ", "body": "• إذا اختل شرط من الشروط سقطت الحضانة.\n• تستحق المطلقة الحضانة في الحال قبل انقضاء العدة على المذهب.\n• إن غابت الأم أو امتنعت فللجدة (أم الأم) مثلاً، والضابط: إن امتنع القريب كانت الحضانة لمن يليه.\n• لا تُجبر الأم عند الامتناع إلا إذا وجبت عليها نفقة الولد (كأن لم يكن له أب ولا مال).\n\nحكم المحضون إذا بلغ:\n• إن بلغ رشيداً صار ولي أمر نفسه، فلا يُجبر على الإقامة عند أحد أبويه، والأولى ألا يفارقهما ليبرّهما."}]}, {"id": "s9", "title": "الجنايات (ص 76–84)", "lessons": [{"title": "تعريف الجنايات وحكم القتل", "body": "• الجنايات: جمع جناية، وجُمعت وإن كانت مصدراً لتنوعها إلى: عمد، وخطأ، وشبه عمد. وعبّر بها دون الجراح لتشمل الجراح وغيرها من القطع والقتل.\n• دليلها: قوله تعالى: «ولكم في القصاص حياة يا أولي الألباب»، وخبر الصحيحين: «اجتنبوا السبع الموبقات... وقتل النفس التي حرم الله إلا بالحق»، والإجماع.\n\nحكم القتل: قتل الآدمي عمداً بغير حق من أكبر الكبائر بعد الكفر. سُئل النبي ﷺ: أي الذنب أعظم؟ قال: «أن تجعل لله نداً وهو خلقك»، قيل: ثم أي؟ قال: «أن تقتل ولدك مخافة أن يطعم معك».\n• تصح توبة القاتل عمداً، ولا يتحتم عذابه بل هو في خطر المشيئة، ولا يُخلَّد إن عُذب. والمراد بالخلود في الآية المكث الطويل.\n• ومذهب أهل السنة أن المقتول لا يموت إلا بأجله، والقتل لا يقطع الأجل، خلافاً للمعتزلة."}, {"title": "أنواع القتل", "body": "القتل على ثلاثة أضرب: عمد محض، وخطأ محض، وعمد خطأ (شبه عمد).\n\nوجه الحصر: الجاني إن لم يقصد عين المجني عليه فهو خطأ، وإن قصدها فإن كان بما يقتل غالباً فعمد، وإلا فشبه عمد.\n\n١) العمد المحض: أن يقصد ضربه بما يقتل غالباً، ويقصد قتله بذلك عدواناً. (كجارح ومثقل وسحر).\n• لو زلقت رجله فوقع على غيره فمات فهو خطأ.\n• لو رمى زيداً فأصاب عمراً فهو خطأ.\n• لو غرز إبرة في غير مقتل ولم يعقبها ورم فمات فلا قصاص.\n\n٢) الخطأ المحض: أن يقصد الفعل دون الشخص، كأن يرمي إلى شيء (شجرة أو صيد) فيصيب إنساناً فيقتله، أو لم يقصد أصل الفعل كأن زلق فسقط على غيره.\n\n٣) عمد الخطأ (شبه العمد): أن يقصد ضربه بما لا يقتل غالباً كسوط أو عصا خفيفة فيموت."}, {"title": "الواجب في كل نوع", "body": "١) العمد المحض: يجب القَوَد (القصاص)، لقوله تعالى: «كتب عليكم القصاص في القتلى». وسُمّي القصاص قوداً لأنهم يقودون الجاني إلى محل الاستيفاء.\n• فإن عفا المستحق مجاناً سقط القصاص ولا دية.\n• وإن عفا على مال وجبت دية مغلظة حالّة في مال القاتل، وإن لم يرض الجاني، لأنه محكوم عليه.\n• لو عفا عن عضو من أعضاء الجاني سقط القصاص كله.\n• لو عفا بعض المستحقين سقط القصاص كله وإن لم يرض الباقون، لأن القصاص لا يتجزأ.\n\n٢) الخطأ المحض: لا قود عليه لقوله تعالى: «ومن قتل مؤمناً خطأً فتحرير رقبة مؤمنة ودية مسلمة إلى أهله»، بل تجب دية مخففة على العاقلة مؤجلة في ثلاث سنين.\n\n٣) عمد الخطأ: لا قود فيه لفقد الآلة القاتلة غالباً، وتجب دية مغلظة على العاقلة مؤجلة في ثلاث سنين، لقوله ﷺ: «ألا إن في قتيل عمد الخطأ قتيل السوط أو العصا مئة من الإبل مغلظة، منها أربعون خلفة في بطونها أولادها». وهو متردد بين العمد والخطأ، فأُعطي حكم العمد في التغليظ وحكم الخطأ في كونها على العاقلة."}, {"title": "شروط وجوب القصاص", "body": "شروط وجوب القصاص في العمد خمسة:\n١) أن يكون القاتل بالغاً.\n٢) أن يكون عاقلاً: فلا قصاص على صبي ومجنون لرفع القلم عنهما، وتجب الدية في مالهما.\n٣) ألا يكون والداً للمقتول: فلا قصاص بقتله ولده وإن سفل، لخبر «لا يُقاد للابن من أبيه»، ولأنه كان سبباً في وجوده.\n٤) ألا يكون المقتول أنقص من القاتل بهدر دم، تحقيقاً للمكافأة.\n• فيُقتل رجل بامرأة، وعالم بجاهل، وشريف بخسيس، وشيخ بشاب وعكسها.\n٥) عصمة القتيل بإيمان أو أمان كعقد ذمة أو عهد."}, {"title": "قتل الجماعة بالواحد", "body": "• تُقتل الجماعة بالواحد وإن كثروا وإن تفاضلت جراحاتهم، سواء قتلوه بمحدّد أو بغيره.\n• الدليل: أن عمر رضي الله عنه قتل نفراً (خمسة أو سبعة) برجل قتلوه غيلة، وقال: «لو تمالأ عليه أهل صنعاء لقتلتهم به جميعاً» ولم ينكر عليه أحد فصار إجماعاً. ولأن القصاص شُرع لحقن الدماء، فلو لم يجب عند الاشتراك لاتخذ الناس ذلك ذريعة لسفك الدماء.\n• للولي العفو عن بعضهم على الدية، وعن جميعهم عليها. فإن كان القتل بجراحات وُزّعت الدية على عدد الرؤوس، وإن كان بالضرب فعلى عدد الضربات.\n\nمن قتل جماعة:\n• مرتباً: قُتل بأولهم.\n• دفعة واحدة: فبالقرعة.\n• وللباقين الديات لتعذر القصاص عليهم."}, {"title": "القصاص في الأطراف", "body": "• كل شخصين جرى القصاص بينهما في النفس جرى بينهما في الأطراف، وفي الجرح المقدّر كالموضحة، وفي إزالة المنافع المضبوطة كضوء العين والسمع والشم والبطش والذوق.\n\nشروط القصاص في الأطراف (بعد الشروط الخمسة):\n١) الاشتراك في الاسم الخاص: اليمنى باليمنى واليسرى باليسرى، فلا تقطع يسار بيمين ولا شفة سفلى بعليا. ويُقطع الرجل بالمرأة وعكسه.\n٢) ألا يكون بأحد الطرفين شلل: فلا تُقطع صحيحة بشلاء.\n\nأحكام:\n• تُقطع أذن سميع بأصم، ولا تُؤخذ عين صحيحة بحدقة عمياء، ولا لسان ناطق بأخرس.\n• في قلع السن قصاص، ولا قصاص في كسرها كما لا قصاص في كسر العظام.\n• كل عضو أُخذ من مفصل (كالمرفق والأنامل والكوع) ففيه القصاص.\n• لا قصاص في الجروح في سائر البدن لعدم ضبطها، إلا في الموضحة (التي تكشف العظم دون كسر) ففيها القصاص."}]}, {"id": "s10", "title": "الدية (ص 85–97)", "lessons": [{"title": "تعريف الدية ودليلها وأنواعها", "body": "• الدية شرعاً: اسم للمال الواجب بالجناية على النفس أو فيما دونها.\n• دليلها: قوله تعالى: «ودية مسلمة إلى أهله»، وكتاب عمرو بن حزم: «في النفس مئة من الإبل»، والإجماع على وجوبها في الجملة.\n• تنقسم إلى: مغلظة ومخففة."}, {"title": "الدية المغلظة", "body": "• هي مئة من الإبل في القتل العمد، سواء وجب فيه قصاص وعُفي على مال أم لا (كقتل الوالد ولده).\n• تكون مثلثة: ثلاثون حقة، وثلاثون جذعة، وأربعون خلفة (أي حوامل في بطونها أولادها)، لخبر الترمذي. ويثبت حملها بقول أهل الخبرة بالإبل.\n• هي مغلظة في العمد من ثلاثة أوجه: كونها على الجاني، وحالّة، ومثلثة في السن.\n• وفي شبه العمد مغلظة من وجه واحد وهو كونها مثلثة."}, {"title": "الدية المخففة وما يُغلَّظ منها", "body": "• هي مئة من الإبل في الخطأ، مخففة من ثلاثة أوجه:\n١) وجوبها مخمسة: عشرون حقة، وعشرون جذعة، وعشرون بنت لبون، وعشرون ابن لبون، وعشرون بنت مخاض.\n٢) وجوبها على العاقلة.\n٣) وجوبها مؤجلة في ثلاث سنين.\n• وفي شبه العمد مخففة من وجهين: على العاقلة، ومؤجلة في ثلاث سنين.\n• لا يُقبل في إبل الدية معيب بما يثبت الرد في المبيع.\n\nإذا عُدمت الإبل حساً أو شرعاً: انتقل إلى قيمتها وقت وجوب تسليمها (القول الجديد الصحيح)، وقيل (القديم): ينتقل إلى ألف دينار أو اثني عشر ألف درهم.\n\nتُغلَّظ دية الخطأ (تُثلَّث) في ثلاثة مواضع:\n١) إذا قُتل في الحرم (حرم مكة).\n٢) إذا قُتل في الأشهر الحرم: ذو القعدة وذو الحجة والمحرم ورجب.\n٣) إذا قُتل ذا رحم محرم كالأم والأخت."}, {"title": "دية الأطراف: ما تكمل فيه الدية", "body": "تكمل دية النفس في إبانة:\n• اليدين الأصليتين، وكذا الرجلين من الكعبين. وفي إحداهما نصفها.\n• في كل أصبع أصلية عُشر الدية (عشرة أبعرة). وفي أنملة غير الإبهام ثلث العُشر، وفي أنملة الإبهام نصفها (لأن له أنملتين).\n• الأنف (مارنه)، لخبر عمرو بن حزم.\n• الأذنين، وفي كل أذن خمسون من الإبل، سميعاً كان أو أصم.\n• العينين، وفي كل عين نصفها، ولو عين أحول أو أعمش أو أعور.\n• الجفون الأربعة، وفي كل جفن ربع الدية.\n• اللسان للناطق، ولو لأرت أو ألثغ. وفيه ثلاث منافع: الكلام والذوق والاعتماد في الأكل.\n• الشفتين، وفي كل شفة نصف الدية."}, {"title": "دية المنافع والجراح", "body": "تكمل دية النفس في ذهاب:\n• الكلام (في الجناية على اللسان). وتوزَّع الدية على ثمانية وعشرين حرفاً عند إبطال بعضها.\n• البصر من العينين، وفي ذهاب بصر كل عين نصفها.\n• السمع، لخبر البيهقي «وفي السمع الدية»، وقيل إنه أشرف من البصر.\n• الشم من المنخرين.\n• العقل إن لم يُرجَ عوده.\n\nالجراح:\n• الموضحة (في الرأس أو الوجه): نصف عُشر الدية، أي خمس من الإبل.\n• السن: قلع السن الأصلية التامة فيه خمس من الإبل.\n• كل عضو لا منفعة فيه كاليد الشلاء والذكر الأشل: حكومة. وكذا في كسر العظام."}]}, {"id": "s11", "title": "الحدود (ص 98–126)", "lessons": [{"title": "تعريف الحدود والزنا وأقسام الزاني", "body": "• الحدود: جمع حد، وهو لغةً: المنع. وشرعاً: عقوبة مقدرة وجبت زجراً عن ارتكاب ما يوجبه.\n• بدأ بالزنا لأن أهل الملل اتفقوا على تحريمه، وهو من أفحش الكبائر، ولم يحل في ملة قط، ولذلك كان حده أشد الحدود، لأنه جناية على الأعراض والأنساب.\n• الزنا: حصول معاشرة تامة بين رجل وامرأة مكلفين لا يربط بينهما عقد نكاح.\n• الزاني باعتبار الحد ضربان: محصن (استكمل شروط الإحصان)، وغير محصن (لم يستكملها).\n• إقامة الحدود والعقوبات موكولة إلى ولي الأمر أو من ينوب عنه كالقاضي."}, {"title": "حد الزاني المحصن", "body": "• حد المحصن والمحصنة: الرجم حتى الموت، بالإجماع وتظاهر الأخبار، كرجم ماعز والغامدية.\n• قُرئ شاذاً: «والشيخ والشيخة إذا زنيا فارجموهما البتة»، وهذه الآية نُسخ لفظها وبقي حكمها.\n• لو زنى قبل إحصانه ولم يحد، ثم زنى بعد إحصانه: جُلد ثم رُجم."}, {"title": "حد الزاني غير المحصن", "body": "• حده (ذكراً كان أو أنثى، إذا كان حراً): مئة جلدة، لقوله تعالى: «الزانية والزاني فاجلدوا كل واحد منهما مئة جلدة».\n• يجب أن يكون الجلد متتابعاً (ولاءً). فإن فرّقه نُظر: إن لم يزل الألم الأول لم يضر، وإلا فإن كان الذي جُلد خمسين لم يضر، وإن كان أقل ضرّ.\n• سُمّي جلداً لوصول الضرب إلى الجلد.\n• ويُغرَّب عاماً، لرواية مسلم. ولو ادعى المحدود انقضاء العام ولا بينة، صُدّق ويحلف ندباً، لأنه من حقوق الله تعالى.\n• يُغرَّب من بلد الزنا إلى مسافة القصر فما فوقها إن رآه الإمام (مسافة القصر تقارب ثمانين كيلومتراً). لأن ما دونها في حكم الحضر، والمقصود إيحاشه بالبعد عن الأهل والوطن.\n• ويُغرَّب إلى بلد معين يحدده الإمام، وليس للمُغرَّب أن يختار غيره، لأن ذلك أليق بالزجر.\n• غرّب عمر إلى الشام، وعثمان إلى مصر، وعلي إلى البصرة."}, {"title": "شروط الإحصان", "body": "شرائط الإحصان ثلاث:\n١) البلوغ.\n٢) العقل: فلا إحصان لصبي ومجنون لعدم الحد عليهما، لكن يؤدبان بما يزجرهما.\n٣) وجود الوطء في نكاح صحيح: بتغييب الحشفة أو قدرها عند فقدها في القبل، ولو لم تزل البكارة. لأن الشهوة مركبة في النفوس، فإذا وُطئ في نكاح صحيح فقد استوفاها، فحقه أن يمتنع من الحرام.\n• ويُعدّ محصناً ولو كانت الموطوءة في عدة وطء شبهة، أو وطئها في نهار رمضان أو في حيض أو إحرام."}, {"title": "ما يثبت به الزنا وما فيه التعزير", "body": "يثبت الزنا بأحد أمرين:\n١) البينة: أربعة شهود، لقوله تعالى: «واللاتي يأتين الفاحشة من نسائكم فاستشهدوا عليهن أربعة منكم». ويُشترط في البينة التفصيل: يذكرون من زنى بها لاحتمال ألا حد عليه بوطئها، والكيفية لاحتمال إرادة المباشرة.\n٢) الإقرار الحقيقي ولو مرة واحدة، لأنه ﷺ رجم ماعزاً والغامدية بإقرارهما، ويُشترط أن يكون الإقرار مفصلاً كالشهادة.\n• خرج بالإقرار الحقيقي الإقرار التقديري، وهو اليمين المردودة بعد نكول الخصم: فلا يثبت به الزنا، لكن يسقط به الحد عن القاذف.\n• يُسن للزاني ولكل من ارتكب معصية الستر على نفسه، لخبر: «من أتى من هذه القاذورات شيئاً فليستتر بستر الله».\n\nالمباشرة فيما دون الفرج:\n• من باشر فيما دون الفرج بمفاخذة أو معانقة أو قبلة ونحوها عُزّر بما يراه الإمام من ضرب أو صفع أو حبس أو نفي أو توبيخ.\n• ضابط التعزير: عقوبة غير مقدرة مشروعة في كل معصية لا حد فيها ولا كفارة، سواء كانت حقاً لله أو لآدمي. ولا يبلغ الإمام بالتعزير أدنى الحدود وجوباً.\n• أصله: قوله تعالى في النشوز: «واللاتي تخافون نشوزهن فعظوهن واهجروهن في المضاجع واضربوهن»، وروى البيهقي أن علياً رضي الله عنه سُئل عمن قال لرجل: يا فاسق يا خبيث، فقال: «يُعزَّر»."}, {"title": "القذف: تعريفه وألفاظه وحده", "body": "• القذف لغةً: الرمي. وشرعاً: الرمي بالزنا في معرض التعيير.\n• ألفاظه ثلاثة:\n١) الصريح: كقوله لغيره: زنيتَ (بفتح التاء أو كسرها)، يا زاني، يا زانية. وفيه حد القذف، ولا يضر اللحن في التذكير والتأنيث (كقوله للرجل: يا زانية).\n٢) الكناية: كقوله لرجل: يا فاجر، يا فاسق، يا خبيث، ولامرأة: وأنتِ تحبين الخلوة. و«يا لوطي» كناية على المعتمد، بخلاف «يا لائط» فصريح.\n٣) التعريض: كقوله في خصومة: يا ابن الحلال، أو: أما أنا فلست بزان. ليس قذفاً صريحاً ولا كناية ولو نواه.\n• ضابط اللفظ: إن لم يحتمل غير القذف فصريح، وإلا فإن فُهم منه القذف بوضعه فكناية، وإلا فتعريض. وليس الرمي بإتيان البهائم قذفاً.\n• النسبة إلى غير الزنا من الكبائر وغيرها مما فيه إيذاء توجب التعزير لا الحد.\n• دليل حد القذف: الإجماع المستند إلى قوله تعالى: «والذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة»، وقوله ﷺ لهلال بن أمية: «البينة أو حد في ظهرك».\n• حد الحر في القذف: ثمانون جلدة."}, {"title": "شرائط حد القذف وما يسقطه", "body": "شرائط حد القذف ثمانية:\n• ثلاثة (بل ستة) في القاذف:\n١) أن يكون بالغاً. ٢) عاقلاً (فلا حد على صبي ومجنون، لكن يُعزَّران إن كان لهما تمييز). ٣) ألا يكون والداً للمقذوف (فلا يُحد أصل بقذف فرعه وإن سفل). ٤) كونه مختاراً (فلا حد على المكرَه). ٥) كونه ملتزماً للأحكام. ٦) كونه ممنوعاً منه (فلو أذن محصن لغيره في قذفه فلا حد).\n• وأربعة في المقذوف: أن يكون مسلماً، بالغاً، عاقلاً، عفيفاً عن وطء يحد به.\n\nما تبطل به العفة:\n• تبطل بوطء حرام ولو لم يُحد به، كوطء محرمة برضاع أو نسب مع العلم بالتحريم.\n• لا تبطل بوطء حرام في نكاح صحيح، كوطء زوجته في عدة شبهة أو في حيض أو نفاس أو إحرام أو صوم أو اعتكاف، ولا بوطء زوجته الرجعية.\n\nما يسقط به حد القذف (ثلاثة بل خمسة):\n١) إقامة البينة على زنا المقذوف مفصّلة (فإن شهد دون أربعة حُدّوا كما فعل عمر).\n٢) عفو المقذوف عن جميع الحد (فلو عفا عن بعضه لم يسقط شيء).\n٣) لعان الزوج القاذف في حق زوجته.\n٤) إقرار المقذوف بالزنا.\n٥) أن يرث القاذف الحد."}, {"title": "حد شارب الخمر", "body": "• الخمر: المسكر من عصير العنب. وأما سائر الأنبذة (من تمر أو زبيب أو شعير أو ذرة) فحكمها كالخمر في التحريم والحد.\n• شربه من كبائر المحرمات، لقوله تعالى: «يا أيها الذين آمنوا إنما الخمر والميسر والأنصاب والأزلام رجس من عمل الشيطان فاجتنبوه»، وانعقد الإجماع على تحريمه. وحُرِّمت الخمر في السنة الثالثة من الهجرة بعد أحد، وقيل غير ذلك.\n• ويُلحق بالخمر في الحرمة المخدرات والعقاقير التي تغيّب العقل.\n• يُحدّ من شرب الخمر أو مسكراً (وهو مكلف ملتزم للأحكام، مختار لغير ضرورة، عالم بالتحريم) أربعين جلدة، لما في مسلم عن أنس: كان النبي ﷺ يضرب في الخمر بالجريد والنعال أربعين.\n• كل شراب أسكر كثيره حرم هو وقليله وحُدّ شاربه، لقوله ﷺ: «كل مسكر خمر، وكل خمر حرام». وحُرِّم القليل حسماً لمادة الفساد.\n• يجوز للإمام أن يبلغ به ثمانين على وجه التعزير على الأصح، لأن عمر جلد ثمانين، وقال علي: إذا شرب سكر، وإذا سكر هذى، وإذا هذى افترى، وحد الافتراء ثمانون.\n\nأحكام تتعلق بالشارب:\n• لو قال السكران بعد الإفاقة: كنت مكرهاً، أو: لم أعلم أن ما شربته مسكر، صُدّق بيمينه.\n• لو قرب إسلامه وقال: جهلت تحريمها، لم يُحد لأن الحد يُدرأ بالشبهات.\n• لو قال: علمت تحريمها لكن جهلت الحد، حُدّ، لأن من حقه إذا علم التحريم أن يمتنع.\n• يحرم تناول الخمر للدواء، لقوله ﷺ: «إنه ليس بدواء ولكنه داء». ويحرم للعطش لأنها لا تزيله بل تزيده.\n\nما يثبت به الحد:\n• بالبينة: شهادة رجلين، أو بالإقرار. فلا يُحد بشهادة رجل وامرأتين، ولا بيمين مردودة، ولا بالقيء أو الاستنكاه (شمّ الرائحة)، لاحتمال أن يكون شربها غلطاً أو مكرهاً، والحد يُدرأ بالشبهة.\n• يُقبل رجوعه عن الإقرار لأن كل ما ليس من حق آدمي يقبل الرجوع فيه.\n• تُكره إقامة الحدود والتعازير في المسجد."}, {"title": "حد السرقة وشروط القطع", "body": "• السرقة لغةً: أخذ المال خفية. وشرعاً: أخذه خفية ظلماً من حرز مثله بشروط.\n• أركان القطع ثلاثة: مسروق، وسرقة، وسارق.\n• دليله: قوله تعالى: «والسارق والسارقة فاقطعوا أيديهما». والمنوط بالقطع ولي الأمر أو من ينوب عنه.\n\nشروط القطع (ستة بل عشرة):\n١) البلوغ. ٢) العقل.\n٣) أن يسرق نصاباً: وهو ربع دينار فأكثر (يقارب ٤/٢٥ جرام من الذهب)، لخبر مسلم: «لا تقطع يد سارق إلا في ربع دينار فصاعداً». ويُعتبر الذهب الخالص، وتُعتبر القيمة وقت الإخراج من الحرز، فلو نقصت بعد ذلك لم يسقط القطع.\n٤) أن يأخذه من حرز مثله: فلا قطع فيما ليس محرزاً. والحرز يختلف باختلاف الأموال والأحوال والأزمان، وضابطه ما لا يُعدّ صاحبه مضيّعاً له.\n٥) ألا يكون للسارق ملك فيه: فلا قطع بسرقة ماله الذي بيد غيره ولو كان مرهوناً أو مؤجراً.\n٦) ألا تكون له شبهة في مال المسروق منه، لحديث: «ادرؤوا الحدود عن المسلمين ما استطعتم». والشبهة أنواع: شبهة الملك (كمال مشترك)، وشبهة الفاعل (كمن أخذ مالاً يظن أنه ملكه)، وشبهة المحل (كسرقة الابن مال أحد أصوله، والأصل مال فرعه).\n٧) أن يكون مختاراً: فلا يُقطع المكرَه.\n٨) أن يكون ملتزماً للأحكام: فلا يُقطع حربي بمال مسلم.\n٩) أن يكون المسروق مالاً محترماً: فلا قطع بسرقة خمر أو خنزير أو كلب.\n١٠) أن يكون الملك في النصاب تاماً قوياً: فلا يُقطع المسلم بسرقة حصر المسجد المعدة للاستعمال، ولا بمال بيت المال إذا كان له فيه حق.\n\nمسائل مهمة:\n• يُقطع بسرقة ما يتلف سريعاً كالفواكه والبقول، وبالمصحف وكتب العلم الشرعي.\n• لا يُقطع المختلس (الذي يتعمد الهرب من غير غلبة)، ولا المنتهب (الذي يأخذ عياناً بالقوة)، ولا الخائن (كمنكر الوديعة والعارية)، لحديث: «ليس على المختلس ولا المنتهب ولا الخائن قطع».\n• يجب على السارق رد ما أخذه إن كان باقياً، لخبر: «على اليد ما أخذت حتى تؤديه»، فإن تلف ضمن بدله.\n\nما تثبت به السرقة:\n• بإقرار السارق، ولا يشترط تكراره، بشرطين: أن يكون بعد الدعوى عليه، وأن يكون مفصلاً (يبيّن السرقة والمسروق منه وقدر المسروق والحرز). ويُقبل رجوعه عنه.\n• وبشهادة رجلين. فلو شهد رجل وامرأتان ثبت المال ولا قطع.\n• يجوز للقاضي أن يعرّض للمقرّ بالرجوع، كقوله في السرقة: لعلك أخذت من غير حرز، لأنه ﷺ قال للمقرّ بالسرقة: «ما إخالك سرقت»."}, {"title": "قطاع الطريق", "body": "• قطع الطريق: البروز لأخذ مال أو لقتل أو لإرعاب، مكابرةً واعتماداً على القوة، مع البعد عن الغوث.\n• دليله: قوله تعالى: «إنما جزاء الذين يحاربون الله ورسوله ويسعون في الأرض فساداً أن يقتلوا أو يصلبوا أو تقطع أيديهم وأرجلهم من خلاف أو ينفوا من الأرض».\n• يثبت برجلين، لا برجل وامرأتين.\n• قاطع الطريق: ملتزم للأحكام (ولو سكراناً)، مختار، مخيف للطريق، يقاوم من يبرز له بأن يساويه أو يغلبه بحيث يبعد معه الغوث، ولو كان واحداً أو أنثى أو بلا سلاح.\n\nأقسام قطاع الطريق (أربعة):\n١) قتلوا ولم يأخذوا المال: قُتلوا حتماً.\n٢) قتلوا وأخذوا المال (نصاباً): قُتلوا حتماً وصُلبوا، ويكون الصلب بعد القتل والغسل والتكفين والصلاة عليهم، للتنكيل وزجر غيرهم.\n٣) أخذوا المال (نصاباً) ولم يقتلوا: تُقطع أيديهم وأرجلهم من خلاف (اليد اليمنى والرجل اليسرى)، فإن عادوا قُطعت اليد اليسرى والرجل اليمنى.\n٤) أخافوا السبيل ولم يأخذوا مالاً ولم يقتلوا: حُبسوا (يُنفون من الأرض بحبسهم في غير موضعهم)، وعُزّروا.\n• فسّر ابن عباس الآية على التنويع لا التخيير: أن «أو» للتقسيم.\n\nالتوبة:\n• من تاب منهم قبل القدرة عليه سقطت عنه العقوبات الخاصة بالقاطع (تحتم القتل والصلب وقطع اليد والرجل)، لقوله تعالى: «إلا الذين تابوا من قبل أن تقدروا عليهم».\n• لكن يؤخذ بالحقوق: فلا يسقط عنه القود ولا المال ولا باقي الحدود كحد الزنا والسرقة وشرب الخمر والقذف."}]}, {"id": "s12", "title": "الجهاد (ص 127–134)", "lessons": [{"title": "تعريف الجهاد ودليله وحكمه", "body": "• الجهاد: القتال في سبيل الله. ويقصد به أعمّ من ذلك: دفع كل ما يصد عن سبيل الله في النفس والغير، فيدخل فيه رد المعتدين ومقاومة هوى النفس والشيطان، وقد يختص بمقاومة المعتدين ورد اعتدائهم.\n\nالدليل: الأصل فيه قبل الإجماع:\n١) الكتاب: قوله تعالى: «كُتب عليكم القتال»، وقوله تعالى: «وقاتلوا المشركين كافة».\n٢) السنة: خبر الصحيحين: «أُمرت أن أقاتل الناس حتى يقولوا: لا إله إلا الله»، وخبر مسلم: «لَغدوة أو روحة في سبيل الله خير من الدنيا وما فيها».\n٣) الإجماع على مشروعية الجهاد.\n\nحكمه:\n• في عهد النبي ﷺ بعد الهجرة: فرض كفاية.\n• بعد وفاته ﷺ: للكفار حالان:\n١) أن يكونوا ببلادهم: ففرض كفاية، إذا فعله من فيهم كفاية سقط الحرج عن الباقين.\n٢) أن يدخلوا بلدة لنا: ففرض عين على أهلها (انظر الدرس الأخير)."}, {"title": "شروط وجوب الجهاد (فرض الكفاية)", "body": "شرائط وجوب الجهاد حينئذ ست خصال:\n١) الإسلام.\n٢) البلوغ.\n٣) العقل: فلا جهاد على صبي ومجنون لعدم تكليفهما، ولقوله تعالى: «ليس على الضعفاء ولا على المرضى...» (قيل: الضعفاء هم الصبيان لضعف أبدانهم، وقيل: المجانين لضعف عقولهم). ولأن النبي ﷺ رد ابن عمر يوم أحد وأجازه في الخندق.\n٤) الذكورة: فلا جهاد على امرأة، لضعفها، ولأن لفظ المؤمنين ينصرف للرجال دون النساء، ولقوله ﷺ لعائشة وقد سألته عن الجهاد: «لكن أفضل الجهاد حج مبرور». والخنثى كالمرأة.\n٥) الصحة: فلا جهاد على مريض يتعذر قتاله أو تعظم مشقته.\n٦) الطاقة على القتال بالبدن والمال."}, {"title": "من لا جهاد عليهم وعذر الطاقة", "body": "لا جهاد على:\n• أعمى، ولا ذي عرج بيّن ولو في رجل واحدة، لقوله تعالى: «ليس على الأعمى حرج ولا على الأعرج حرج».\n• أقطع يد بكاملها أو معظم أصابعها، ولا أشل يد أو معظم أصابعها، لأن مقصود الجهاد البطش والنكاية وهو مفقود فيهما.\n• عادم أهبة القتال: من نفقة وسلاح، وكذا مركوب إن كان السفر طويلاً.\n\nلا عبرة بـ:\n• صداع ووجع ضرس وضعف بصر إن كان يدرك الشخص ويمكنه اتقاء السلاح.\n• عرج يسير لا يمنع المشي ولا العدو والهرب.\n• فاقد الأقل من الأصابع أو أصابع الرجلين إن أمكنه المشي بغير عرج بيّن.\n\nمسائل:\n• لو مرض بعد الخروج أو فني زاده أو هلكت دابته: فهو بالخيار بين أن ينصرف أو يمضي. فإن حضر الوقعة جاز له الرجوع على الصحيح إذا لم يمكنه القتال.\n• لو كان القتال على باب داره أو حوله: سقط اعتبار المؤن.\n• الضابط: كل عذر منع وجوب الحج (كفقد الزاد والراحلة) منع وجوب الجهاد، إلا الخوف من الطريق من كفار أو لصوص مسلمين فلا يمنع وجوبه، لأن الجهاد مبني على مصادمة المخاوف."}, {"title": "الإذن في الجهاد: الغريم والوالدان", "body": "• يحرم على الرجل سفر الجهاد وسفر غيره إلا بإذن غريمه (صاحب الدَّين) إذا كان الدَّين حالاً على موسر. أما الدَّين المؤجل فلا يحرم السفر وإن قرب الأجل.\n• يحرم على الرجل الجهاد وغيره من الأسفار إلا بإذن أبويه، فإن كان أحدهما حياً لم يجز إلا بإذنه.\n• لا يحرم عليه السفر لتعلّم فرض، ولو كفاية كطلب درجة الإفتاء، بغير إذن أصله.\n• لو أذن أصله أو صاحب الدَّين ثم رجع بعد خروجه وعلم بالرجوع: وجب رجوعه إن لم يحضر الصف، وإلا حرم انصرافه، لقوله تعالى: «إذا لقيتم فئة فاثبتوا».\n• ويُشترط لوجوب الرجوع أيضاً أن يأمن على نفسه وماله ولم تنكسر قلوب المسلمين، وإلا فلا يجب الرجوع بل لا يجوز."}, {"title": "الجهاد إذا دخل الكفار بلدة للمسلمين", "body": "• الحال الثاني: أن يدخل المعتدون بلدة لنا، فيلزم أهلها الدفع بالممكن منهم.\n• ويكون الجهاد حينئذ فرض عين، سواء أمكن تأهبهم للقتال أم لم يمكن، وسواء علم من قُصد أنه إن أُخذ قُتل أو لم يعلم، أو لم تأمن المرأة الفاحشة إن أُخذت.\n• من كان دون مسافة القصر من البلدة التي دخلها الكفار حكمه كأهلها وإن كان في أهلها كفاية، لأنه كالحاضر معهم. فيجب على كل من ذُكر حتى الفقير والولد والمدين بلا إذن من الأصل.\n• ويلزم من كانوا على مسافة القصر المضي إليهم عند الحاجة بقدر الكفاية، دفعاً لهم وإنقاذاً من الهلكة. فيصير فرض عين في حق من قرُب، وفرض كفاية في حق من بعُد."}, {"title": "من أسلم قبل الأسر", "body": "• من أسلم (رجلاً كان أو امرأة) قبل الأسر، أي قبل الظفر به: أحرز ماله من الغنيمة ودمه من السفك، للخبر: «أُمرت أن أقاتل الناس حتى يقولوا: لا إله إلا الله».\n• ويحرز كذلك صغار أولاده الأحرار عن السبي، لأنهم يتبعونه في الإسلام.\n• والجد كذلك في الأصح ولو كان الأب حياً.\n• والولد المجنون أو ولد الولد المجنون كالصغير، ولو طرأ الجنون بعد البلوغ.\n• ويُعصم الحمل تبعاً له."}]}, {"id": "s13", "title": "الصيد والذبائح (ص 135–143)", "lessons": [{"title": "تعريف الصيد والذبائح ودليلهما وأركان الذبح", "body": "• الصيد: مصدر صاد يصيد، ثم أُطلق على المصيد (الحيوان المصاد)، قال تعالى: «لا تقتلوا الصيد وأنتم حرم».\n• الذبائح: جمع ذبيحة بمعنى مذبوحة. وجمعها المصنف لأنها تكون بالسكين أو السهم أو الجوارح.\n• دليل مشروعية الصيد والذبائح: قوله تعالى: «لا تقتلوا الصيد»، وقوله: «إلا ما ذكيتم»، وقوله: «أُحل لكم الطيبات»، والمذكّى من الطيبات.\n• أركان الذبح أربعة: ذبح، وآلة، وذبيح، وذابح."}, {"title": "الركن الأول والثاني: الذبح والذبيح (كيفية الذكاة)", "body": "١) الحيوان المأكول المقدور على ذكاته: ذكاته في حلقه ولبّته، بالإجماع. والحلق: أعلى العنق، واللبّة: أسفله.\n٢) غير المقدور على ذكاته (كالمتوحش): ذكاته عقره، أي جرحه جرحاً مزهقاً للروح في أي موضع كان من بدنه، بالإجماع. ومثله البعير الشارد (نَدّ)، فهو كالصيد يحل بجرحه في غير مذبحه، ويحل بإرسال الكلب عليه.\n• ويحل الجنين الميت في بطن أمه المذكاة بذكاة أمه (انظر الدرس الأخير)."}, {"title": "ما يشترط في الذبح وما يستحب فيه وما يجزئ", "body": "• يُشترط في الذبح القصد: فلو سقطت مدية على مذبح شاة أو احتكت بها فانذبحت، أو استرسلت جارحة بنفسها فقتلت، أو أُرسل سهم لا لصيد فقتل صيداً: حرم.\n• لو رمى شيئاً ظنه حجراً فإذا هو صيد، أو رمى قطيع ظباء فأصاب واحدة منها: حلّ، لصحة قصده.\n\nيُستحب في الذكاة أربعة أشياء:\n١) قطع الحلقوم: مجرى النَّفَس.\n٢) قطع المريء: مجرى الطعام والشراب.\n٣، ٤) قطع الودجين: عرقان في صفحتي العنق محيطان بالحلقوم (وقيل بالمريء)، وهما الوريدان.\n• لأنه أوحى وأسهل لخروج الروح، فهو من الإحسان في الذبح. ولا يستحب قطع ما وراء ذلك.\n\nالمجزئ في الحل شيئان فقط: قطع كل الحلقوم، وكل المريء، مع وجود الحياة المستقرة أول قطعهما، لأن الذكاة صادفته وهو حي.\n• إن انتهى الحيوان لحركة مذبوح قبل ذلك: لم يحل لأنه صار ميتة.\n• لو ذبح شخص حيواناً وأخرج آخر أمعاءه معاً: لم يحل، لأن التذفيف لم يتمحض بقطع الحلقوم والمريء.\n• لو قطع الرقبة من القفا مع الحلقوم حتى التقت السكينان: ميتة، لأن التذفيف حصل بذبحين.\n• لا يُشترط العلم بالحياة المستقرة، بل يكفي الظن بوجودها بقرينة كشدة الحركة أو انفجار الدم. فإن شككنا في استقرارها حرم، تغليباً للتحريم.\n• لا يُشترط قطع الجلدة التي فوق الحلقوم والمريء."}, {"title": "سنن الذبح وآدابه", "body": "• يُسن نحر الإبل في اللبّة (أسفل العنق)، لقوله تعالى: «فصلِّ لربك وانحر»، ولأمر الصحيحين به، لأنه أسهل لخروج الروح لطول عنقها. ويُقاس عليه كل ما طال عنقه كالنعام والإوز والبط.\n• يُسن ذبح البقر والغنم ونحوهما كالخيل بقطع الحلقوم والمريء.\n• يُسن أن يكون نحر البعير قائماً معقولة ركبته اليسرى، لقوله تعالى: «فاذكروا اسم الله عليها صوافّ» (أي قياماً على ثلاث).\n• يُسن أن يكون ذبح البقرة أو الشاة مضجعة على جنبها الأيسر، وتُترك رجلها اليمنى بلا شد وتُشد باقي القوائم.\n• يُسن للذابح أن يحد سكينه، لخبر مسلم: «إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القِتلة، وإذا ذبحتم فأحسنوا الذِّبحة، وليحدّ أحدكم شفرته، وليرِح ذبيحته».\n• يُسن أن يوجّه ذبيحته للقبلة، وأن يقول عند الذبح: «بسم الله»، وأن يصلي على النبي ﷺ عند ذلك. ولا يقل: «بسم الله واسم محمد» لإيهامه التشريك.\n• من أدخل سكيناً بأذن ثعلب مثلاً وقطع الحلقوم والمريء من داخل الجلد لأجل جلده وبه حياة مستقرة: حلّ، وحرم عليه للتعذيب."}, {"title": "الاصطياد بالجارحة المعلَّمة", "body": "• يجوز لمن تحل ذكاته أكل المصاد بكل جارحة معلَّمة من السباع كالكلب والفهد، ومن جوارح الطير كالباز والصقر، لقوله تعالى: «وما علمتم من الجوارح مكلبين».\n• يحل المصاد في أي موضع جرحته الجارحة، حيث لم يكن فيه حياة مستقرة بأن أدركه ميتاً أو في حركة المذبوح.\n• أما الاصطياد بمعنى إثبات الملك فيحصل بكل طريق تيسر.\n\nشرائط تعليم الجارحة أربعة:\n١) إذا أُرسلت استرسلت (هاجت)، قال الشافعي: إذا أمرت الكلب فائتمر وإذا نهيته فانتهى فهو مُكلَّب.\n٢) إذا زُجرت انزجرت (وقفت).\n٣) إذا قتلت صيداً لم تأكل منه شيئاً، لا من لحمه ولا من جلده وحشوته. ويُشترط في جارحة الطير ترك الأكل فقط.\n٤) أن يتكرر ذلك منها بحيث يظن تأدبها، ولا ينضبط ذلك بعدد، بل يرجع فيه إلى أهل الخبرة.\n\n• فإن عُدمت إحدى الشرائط لم يحل ما أخذته بالإجماع، إلا أن يدركه حياً فيذكّى، لقوله ﷺ لأبي ثعلبة الخُشني: «وما صدتَ بكلبك غير المعلَّم فأدركتَ ذكاته فكل»."}, {"title": "الركن الثالث: الآلة", "body": "• تجوز الذكاة بكل ما يجرح، لأنه أسرع في إزهاق الروح: كمحدّد الحديد والقصب والحجر والرصاص والذهب والفضة.\n• إلا بالسن والظفر وباقي العظام، متصلاً كان أو منفصلاً من آدمي أو غيره، لخبر الصحيحين: «ما أنهر الدم وذكر اسم الله عليه فكلوا، ليس السن والظفر، وسأحدثكم عن ذلك: أما السن فعظم، وأما الظفر فمُدى الحبشة».\n• قيل النهي عن العظام تعبدي، وقال النووي: لأنها تتنجس بالدم، وهي طعام إخواننا من الجن. ومعنى «مدى الحبشة» أنهم كفار ونُهينا عن التشبه بهم.\n• ما قتلته الجارحة بظفرها أو نابها حلال.\n• خرج بالمحدّد: القتل بالمثقّل كالبندقة والسوط والسهم بلا نصل ولا حد، أو بسهم وبندقة معاً، أو انخنق بأحبولة منصوبة، أو أصابه سهم فوقع على طرف جبل ثم سقط منه وفيه حياة مستقرة ومات: فكل ذلك حرام.\n• أما المثقّل فلأنها موقوذة، وأما السهم والبندقة فلأنه موت بشيئين مبيح ومحرم فغُلّب المحرم، وأما المنخنقة فلقوله تعالى: «والمنخنقة»."}, {"title": "الركن الرابع: الذابح، وذكاة الجنين، وما قُطع من حي", "body": "الذابح:\n• تحل ذكاة وصيد كل مسلم ومسلمة، وكتابي وكتابية تحل مناكحتنا لأهل ملتهما، لقوله تعالى: «وطعام الذين أوتوا الكتاب حل لكم».\n• قال ابن عباس: إنما أُحلت ذبائح اليهود والنصارى من أجل أنهم آمنوا بالتوراة والإنجيل.\n• الحكمة في اشتراط الذابح وإنهار الدم: تمييز حلال اللحم والشحم من حرامهما، والتنبيه على تحريم الميتة لبقاء دمها.\n\nذكاة الجنين:\n• ذكاة الجنين حاصلة بذكاة أمه، لحديث: «ذكاة الجنين ذكاة أمه».\n• فإذا وُجد جنين ميت أو عيشه عيش مذبوح في بطن مذكّاة (سواء أشعر أم لا، وسواء ذُبحت أمه أو أُرسل عليها سهم أو كلب) حلّ.\n• إلا أن يوجد حياً حياة مستقرة وأمكنت ذكاته: فيُذكّى وجوباً ولا يحل بذكاة أمه.\n\nما قُطع من حيوان حي:\n• ما قُطع من حي فهو ميت، أي كميتته طهارةً ونجاسةً، لخبر: «ما قُطع من حي فهو ميت». فجزء البشر والسمك والجراد طاهر دون جزء غيرها.\n• إلا الشعور والأصواف والأوبار الساقطة من المأكول المنتفع بها فهي طاهرة، لقوله تعالى: «ومن أصوافها وأوبارها وأشعارها أثاثاً ومتاعاً إلى حين».\n• أما شعر غير المأكول فنجس."}]}, {"id": "s14", "title": "الأضحية (ص 144–155)", "lessons": [{"title": "تعريف الأضحية ودليلها وحكمها", "body": "• الأضحية لغةً: مشتقة من الضحى (الضحوة)، وسُميت بأول زمان فعلها وهو وقت الضحى.\n• شرعاً: ما يُذبح من النَّعَم تقرباً إلى الله تعالى من يوم العيد إلى آخر أيام التشريق.\n\nالدليل:\n١) الكتاب: قوله تعالى: «فصلِّ لربك وانحر» (والمراد بالصلاة صلاة العيد وبالنحر الضحايا في أشهر الأقوال).\n٢) السنة: خبر الترمذي عن عائشة: «ما عمل ابن آدم يوم النحر من عمل أحب إلى الله تعالى من إراقة الدم، إنها لتأتي يوم القيامة بقرونها وأظلافها، وإن الدم ليقع من الله بمكان قبل أن يقع على الأرض، فطيبوا بها نفساً».\n٣) الإجماع على مشروعية الأضحية.\n\nحكمها: سنة مؤكدة في حقنا على الكفاية إن تعدد أهل البيت، فإذا فعلها واحد من أهل البيت كفى عن الجميع، وإلا فسنة عين. ولا تجب إلا بالنذر.\n• قال الشافعي: لا أرخّص في تركها لمن قدر عليها، فيُكره للقادر تركها.\n• التضحية أفضل من صدقة التطوع للاختلاف في وجوبها."}, {"title": "شروط المضحي وما يُسن لمن يريد التضحية", "body": "شروط المضحي: المسلم البالغ العاقل المستطيع. ولا بد أن تكون الأضحية فاضلة عن حاجته وحاجة من يعوله، أي فاضلة عن حاجة يوم العيد وأيام التشريق، لأنها نوع صدقة.\n\nما يُسن لمن يريد التضحية:\n• ألا يزيل شعره ولا ظفره في عشر ذي الحجة حتى يُضحّي.\n• أن يذبح الأضحية الرجل بنفسه إن أحسن الذبح، للاتباع. والسنة للمرأة أن توكّل، والخنثى مثلها.\n• من لم يذبح لعذر أو غيره فليشهدها، لما رواه الحاكم أنه ﷺ قال لفاطمة: «قومي إلى أضحيتك فاشهديها، فإنه بأول قطرة منها يُغفر لك ما سلف من ذنوبك».\n\nشرط التضحية: أن تكون من النَّعَم: الإبل والبقر والغنم، لقوله تعالى: «ليذكروا اسم الله على ما رزقهم من بهيمة الأنعام»، ولأن التضحية عبادة تتعلق بالحيوان فاختصت بالنعم كالزكاة."}, {"title": "ما يجزئ في الأضحية من حيث السن والعدد", "body": "يُجزئ من النَّعَم:\n• الجذع من الضأن: وهو ما استكمل سنة وطعن في الثانية، ولو أجذع (سقطت أسنانه) قبل تمام السنة أجزأ، لخبر أحمد: «ضحّوا بالجذع من الضأن فإنه جائز».\n• الثني من المعز: ما استكمل سنتين وطعن في الثالثة.\n• الثني من الإبل: ما استكمل خمس سنين وطعن في السادسة.\n• الثني من البقر الإنسي: ما استكمل سنتين وطعن في الثالثة. ولا يجزئ الوحشي.\n\n• تجزئ التضحية بالذكر والأنثى بالإجماع، والذكر أفضل على الأصح لأن لحمه أطيب.\n\nالاشتراك:\n• تجزئ البدنة (من الإبل) عن سبعة، لما رواه مسلم عن جابر: «أمرنا أن نشترك في الإبل والبقر، كل سبعة منا في بدنة»، سواء اتفقوا في نوع القربة أو اختلفوا.\n• وتجزئ البقرة عن سبعة.\n• وتجزئ الشاة عن واحد فقط، فإن ذبحها عنه وعن أهله أو أشرك غيره في ثوابها جاز، لقول أبي أيوب: «كنا نضحي بالشاة الواحدة يذبحها الرجل عنه وعن أهل بيته».\n• لا يصح الاشتراك في شاتين مشاعتين بين اثنين، ولا في أكثر من سبعة في بقرتين أو بدنتين مشاعتين."}, {"title": "أفضل الأضاحي وما لا يجزئ فيها", "body": "أفضل أنواع التضحية:\n• بالنظر إلى إقامة الشعار: بدنة، ثم بقرة، ثم ضأن، ثم معز، ثم المشاركة في بدنة أو بقرة.\n• بالنظر إلى اللحم: لحم الضأن خير. وشاة أفضل من مشاركة في بدنة لانفراده بإراقة الدم، وسبع شياه أفضل من بدنة أو بقرة.\n• أجمعوا على استحباب السمين.\n• الألوان: البيضاء أفضل، ثم الصفراء، ثم العفراء (التي لا يصفو بياضها)، ثم الحمراء، ثم البلقاء، ثم السوداء.\n\nأربع لا تجزئ في الضحايا، لحديث الترمذي: «أربع لا تجزئ في الأضاحي: العوراء البيّن عورها، والمريضة البيّن مرضها، والعرجاء البيّن عرجها، والعجفاء التي لا تُنقي»:\n١) العوراء البيّن عورها: التي لم تبصر بإحدى عينيها.\n٢) العرجاء البيّن عرجها: التي يشتد عرجها فتسبقها الماشية إلى المرعى وتتخلف عن القطيع.\n٣) المريضة البيّن مرضها: التي يظهر بسببه هزالها وفساد لحمها. ويدخل فيها الهيماء.\n٤) العجفاء: التي ذهب مخها من الهزال (ضد السمن).\n• ولا تجزئ كذلك المجنونة، والجرباء ولو يسيراً على الأصح، والحامل."}, {"title": "ضابط الإجزاء وما يجزئ مع العيب وما لا يجزئ", "body": "ضابط المجزئ في الأضحية: السلامة من كل عيب ينقص اللحم أو غيره مما يؤكل.\n\nيجزئ:\n• الخصي، لأنه ﷺ ضحّى بكبشين موجوءين (خصيّين)، ولأن ما قُطع منه جُبر بزيادة لحمه وطيبه.\n• مكسورة القرن ما لم يُعب اللحم، لأن القرن لا يتعلق به كبير غرض. وذات القرن أولى، لخبر: «خير الضحية الكبش الأقرن».\n• ذاهبة بعض الأسنان (لا الكل).\n• فاقدة الضرع أو الألية أو الذنب خلقة.\n• مشقوقة الأذن أو مخروقتها بشرط ألا يسقط من الأذن شيء.\n• من قُطع منها شيء يسير من الألية (التطريف)، وقطع فلقة يسيرة من عضو كبير كالفخذ.\n\nلا يجزئ:\n• مقطوعة بعض الأذن وإن كان يسيراً، لذهاب جزء مأكول.\n• مقطوعة بعض الذنب وإن قل.\n• مقطوعة بعض اللسان.\n• من قُطع منها جزء كبير بالنسبة للعضو."}, {"title": "وقت الذبح وما يستحب عنده", "body": "وقت ذبح الأضحية:\n• يدخل من وقت مضي قدر صلاة ركعتي العيد وخطبتين خفيفتين، أي بعد طلوع الشمس يوم النحر.\n• ويستمر إلى غروب شمس آخر أيام التشريق (الثلاثة بعد يوم النحر).\n• فلو ذبح قبل ذلك أو بعده لم تقع أضحية، لخبر الصحيحين: «أول ما نبدأ به في يومنا هذا نصلي ثم نرجع فننحر، من فعل ذلك فقد أصاب سنتنا، ومن ذبح قبل ذلك فإنما هو لحم قدّمه لأهله ليس من النسك في شيء»، وخبر ابن حبان: «في كل أيام التشريق ذبح».\n• الأفضل تأخيرها إلى مضي ما بعد ارتفاع الشمس يوم النحر كرمح، خروجاً من الخلاف.\n\nالأضحية المنذورة: من نذر أضحية معينة أو في ذمته لزمه ذبحها في الوقت المذكور. إن تلفت المعينة في الوقت الثاني بقي الأصل عليه، وإن تلفت في الأول بلا تقصير فلا شيء عليه.\n\nيُستحب عند الذبح (خمسة بل تسعة):\n١) التسمية: بسم الله، ولا يقول: بسم الله واسم محمد.\n٢) الصلاة والسلام على رسول الله ﷺ.\n٣) استقبال القبلة بالذبيحة (بمذبحها فقط على الأصح).\n٤) التكبير ثلاثاً بعد التسمية.\n٥) الدعاء بالقبول: «اللهم هذا منك وإليك فتقبل مني».\n٦) تحديد الشفرة في غير مقابلتها.\n٧) إمرارها وتحامل ذهابها وإيابها.\n٨) إضجاعها على شقها الأيسر وشد قوائمها الثلاث غير اليمنى.\n٩) عقل الإبل."}, {"title": "الأكل والبيع والتصدق والنية", "body": "الأكل منها:\n• لا يأكل من الأضحية المنذورة، ولا من الهدي المنذور كدم الجبرانات في الحج، ويحرم عليه ذلك، فإن أكل منها غَرِمه.\n• ويأكل من أضحية التطوع، ويندب له ذلك، قياساً على هدي التطوع في قوله تعالى: «فكلوا منها وأطعموا البائس الفقير». وفي البيهقي أنه ﷺ كان يأكل من كبد أضحيته.\n• لم يجب الأكل منها لأن الله جعلها لنا، وما جُعل للإنسان فهو مخيّر بين أكله وتركه.\n\nالبيع والانتفاع:\n• لا يبيع من الأضحية شيئاً ولو جلدها، ولا يصح البيع، سواء كانت منذورة أم لا.\n• له أن ينتفع بجلد أضحية التطوع كأن يجعله دلواً أو نعلاً أو خفاً، والتصدق به أفضل. ولا يجوز بيعه ولا إجارته، لخبر: «من باع جلد أضحيته فلا أضحية له».\n• ولا يجوز إعطاؤه أجرة للجزار، ويجوز له إعارته.\n• أما الواجبة فيجب التصدق بجلدها. والقرن كالجلد.\n• ولد الأضحية الواجبة يُذبح حتماً كأمه.\n\nالتصدق:\n• يُطعم الفقراء والمساكين من المسلمين وجوباً ولو جزءاً يسيراً من اللحم، ويكفي الصرف لواحد.\n• يُشترط في اللحم أن يكون نيئاً ليتصرف فيه من يأخذه بما شاء. فلا يكفي جعله طعاماً ودعاء الفقراء إليه، ولا تمليكهم مطبوخاً، ولا غير اللحم كالجلد والكرش والطحال.\n• الأفضل التصدق بكلها إلا لقمة أو لقمتين يتبرك بأكلها. ويسن أن يجمع بين الأكل والتصدق والإهداء، وأن يجعله أثلاثاً.\n\nالنية:\n• يشترط النية للتضحية عند ذبح الأضحية أو قبله عند تعيين ما يضحي به، إلا ما عُيّن بنذر فلا يشترط له نية.\n• إن وكّل بالذبح كفت نيته، ولا حاجة لنية الوكيل.\n• لا تضحية لأحد عن آخر بغير إذنه ولو كان ميتاً."}]}, {"id": "s15", "title": "العقيقة (ص 156–162)", "lessons": [{"title": "تعريف العقيقة وحكمها ودليلها", "body": "• العقيقة لغةً: اسم للشعر الذي على رأس المولود حين ولادته.\n• شرعاً: الذبيحة عن المولود عند حلق شعر رأسه (تسمية للشيء باسم سببه).\n• حكمها: مستحبة، وهي سنة مؤكدة.\n• دليلها: خبر «الغلام مرتهن بعقيقته تُذبح عنه يوم السابع ويُحلق رأسه ويُسمّى»، وأنه ﷺ «أمر بتسمية المولود يوم سابعه ووضع الأذى عنه والعقّ» (رواهما الترمذي).\n• معنى «مرتهن بعقيقته»: قيل لا ينمو نمو مثله، وقيل إذا لم يُعق عنه لم يشفع لوالديه يوم القيامة."}, {"title": "وقت العقيقة وأحكامها", "body": "• يدخل وقتها بانفصال جميع الولد، ولا تُستحب قبله، بل تكون شاة لحم.\n• يُسن ذبحها يوم سابعه، ويُحسب يوم الولادة من السبعة (بخلاف الختان فلا يُحسب منها). لأن المرعي هنا المبادرة إلى فعل القربة، وهناك التأخير لزيادة القوة ليحتمله.\n• يُسن أن يقول الذابح بعد التسمية: «اللهم هذا منك وإليك عقيقة فلان»، لخبر رواه البيهقي بإسناد حسن.\n• يُكره لطخ رأس المولود بدمها لأنه من فعل الجاهلية، ولم يحرم للخبر الصحيح.\n• يُسن لطخ رأسه بالزعفران والخلوق (نوع من الطيب).\n• يُسن في سابع ولادته أن يُحلق رأسه كله بعد ذبح العقيقة، وأن يُتصدق بزنة الشعر ذهباً، فإن لم يتيسر ففضة."}, {"title": "التسمية وما يتعلق بها", "body": "• يُسن أن يُسمّى المولود في السابع، ولا بأس بتسميته قبل ذلك. وذكر النووي أن السنة تسميته يوم السابع أو يوم الولادة. وجمع البخاري بين الأخبار: يوم الولادة لمن لم يرد العق، ويوم السابع لمن أراده.\n• يُسن أن يُحسّن اسمه، لخبر: «إنكم تُدعون يوم القيامة بأسمائكم وأسماء آبائكم فحسنوا أسماءكم».\n• أفضل الأسماء: عبد الله وعبد الرحمن، لخبر مسلم: «أحب الأسماء إلى الله عبد الله وعبد الرحمن».\n• تُكره الأسماء القبيحة كشهاب وشيطان وحمار، وما يُتطيّر بنفيه كبركة ونجيح.\n• لا تُكره التسمية بأسماء الملائكة والأنبياء.\n• يحرم تلقيب الشخص بما يكره وإن كان فيه كالأعمش، ويجوز ذكره بقصد التعريف لمن لا يُعرف إلا به. والألقاب الحسنة لا يُنهى عنها.\n• يُسن أن يُكنّى أهل الفضل من الرجال والنساء، ويحرم التكني بأبي القاسم. ولا يُكنّى فاسق ولا مبتدع لأن الكنية للتكرمة."}, {"title": "مقدار العقيقة ومن تجب عليه نفقته", "body": "• يُذبح عن الغلام شاتان متساويتان، وعن الجارية شاة، لخبر عائشة: «أمرنا رسول الله ﷺ أن نعق عن الغلام بشاتين وعن الجارية بشاة».\n• الذي يذبح هو من تلزمه نفقته.\n• يتأدى أصل السنة عن الغلام بشاة، لأنه ﷺ عقّ عن الحسن والحسين كبشاً كبشاً. وكالشاة سُبع بدنة أو بقرة.\n• لا يجوز للولي أن يعق عن المولود من مال المولود، لأن العقيقة تبرع وهو ممتنع من مال المولود.\n• لو كان الولي عاجزاً عنها حين الولادة ثم أيسر قبل تمام السابع: استُحبت في حقه. وإن أيسر بعد السابع وبعد انقضاء النفاس لم يُؤمر بها."}, {"title": "أوجه الاتفاق والاختلاف بين الأضحية والعقيقة", "body": "أوجه الاتفاق (كالأضحية المسنونة): في الجنس، وسلامتها من العيب، والأفضل منها، والأكل منها، وقدر المأكول، والتصدق، والإهداء، وتعيينها إذا عُيّنت، وامتناع بيعها، وإطعام الفقراء والمساكين. لأنها ذبيحة مندوب إليها فأشبهت الأضحية.\n\nأوجه الاختلاف:\n١) يُسن طبخ العقيقة كسائر الولائم بخلاف الأضحية، لما رواه البيهقي عن عائشة أنه السنة.\n٢) يُسن أن تُطبخ بحلو تفاؤلاً بحلاوة أخلاق المولود، وفي الحديث الصحيح أنه ﷺ كان يحب الحلواء والعسل.\n• ويُستثنى من الطبخ رجل الشاة فإنها تُعطى للقابلة، لأن فاطمة فعلت ذلك بأمر النبي ﷺ."}, {"title": "ما يُسن في العقيقة وللمولود", "body": "• يُسن ألا يُكسر من العقيقة عظم، بل يُقطع كل عظم من مفصله تفاؤلاً بسلامة أعضاء المولود، فإن كسره لم يُكره.\n• يُسن أن يُؤذَّن في أذن المولود اليمنى ويُقام في اليسرى، لخبر ابن السني: «من وُلد له مولود فأذّن في أذنه اليمنى وأقام في اليسرى لم تضره أم الصبيان» (أي التابعة من الجن). وليكون إعلامه بالتوحيد أول ما يقرع سمعه، كما يُلقّن عند خروجه من الدنيا.\n• يُسن أن يُحنّك بتمر، ذكراً كان أو أنثى، فيُمضغ ويُدلك به حنكه ويُفتح فوه حتى ينزل إلى جوفه منه شيء. وفي معنى التمر الرطب.\n\nسنن الفطرة لكل أحد: أن يدّهن غبّاً (وقتاً بعد وقت)، وأن يكتحل وتراً، وأن يحلق العانة ويقلم الظفر وينتف الإبط، وأن يغسل البراجم (عقد الأصابع)، وأن يسرّح اللحية، لخبر: «من كان له شعر فليكرمه».\n• يُكره القزع: وهو حلق بعض الرأس. وحلق جميعه لا بأس به لمن أراد التنظف.\n• لا يُسن حلق الرأس إلا في النسك، أو للكافر إذا أسلم، أو للمولود ليُتصدق بزنة شعره.\n• يُكره للمرأة حلق رأسها إلا لضرورة."}]}, {"id": "s16", "title": "الأيمان والنذور (ص 163–177)", "lessons": [{"title": "تعريف اليمين ودليلها وضابط الحالف", "body": "• الأيمان (بفتح الهمزة): جمع يمين، وأصلها لغةً: اليد اليمنى، وأُطلقت على الحلف لأنهم كانوا إذا تحالفوا أخذ كل واحد بيد صاحبه.\n• اصطلاحاً: تحقيق أمر غير ثابت ماضياً كان أو مستقبلاً، نفياً أو إثباتاً، ممكناً كقوله «ليدخلن الدار» أو ممتنعاً كقوله «ليقتلن الميت»، صادقة كانت أو كاذبة.\n• خرج بالتحقيق لغو اليمين فليست يميناً، وبغير الثابت نحو «والله لأموتن» لتحققه في نفسه.\n\nالدليل: قوله تعالى: «لا يؤاخذكم الله باللغو في أيمانكم»، وقوله ﷺ: «والله لأغزون قريشاً» ثلاث مرات ثم قال في الثالثة: «إن شاء الله»، والإجماع.\n\nضابط الحالف: مكلف مختار قاصد. فلا تنعقد يمين الصبي والمجنون والمكره، ولا يمين اللغو."}, {"title": "ما تنعقد به اليمين", "body": "لا تنعقد اليمين إلا بذات الله تعالى، أو باسم من أسمائه، أو صفة من صفات ذاته.\n١) بذات الله: بما يُفهم منه ذات الباري سبحانه.\n٢) باسم من أسمائه المختصة به: سواء كان مفرداً كقوله «والله» أو مضافاً كـ«ورب العالمين» و«مالك يوم الدين»، أو لم يكن اسماً كقوله «والذي أعبده» و«نفسي بيده».\n• إلا أن يريد به غير اليمين فيُقبل منه (ولا يُقبل في الطلاق ظاهراً). أما إن أراد غير الله فلا يُقبل ظاهراً ولا باطناً.\n• الأسماء الغالب إطلاقها عليه تعالى وعلى غيره (كالرحيم والخالق والرازق والرب): تنعقد ما لم يُرد غيره تعالى.\n• ما يُطلق عليه وعلى غيره سواء (كالموجود والعالم والحي): تنعقد إن أراده تعالى، بخلاف ما إذا أراد غيره أو أطلق.\n٣) بصفة من صفات ذاته: كعظمته وعزته وكبريائه وكلامه ومشيئته وعلمه وقدرته وحقه، إلا أن يريد بالحق العبادات، وبعلمه وقدرته المعلوم والمقدور، وبالبقية ظهور آثارها.\n• قوله «وكتاب الله» يمين، وكذا «والقرآن» و«والمصحف»، إلا أن يريد بالقرآن الخطبة والصلاة، وبالمصحف الورق والجلد."}, {"title": "حروف القسم وألفاظه والحلف بغير الله", "body": "حروف القسم المشهورة: الباء والواو والتاء، كـ«بالله، والله، تالله لأفعلن كذا».\n• يختص لفظ الله بالتاء الفوقية (تالله)، والمظهر مطلقاً بالواو. وتدخل الباء على المظهر والمضمر فهي الأصل، تليها الواو ثم التاء.\n\nألفاظ هي كناية (إن نوى بها اليمين فيمين وإلا فلا): «الله لأفعلن»، «أشهد بالله»، «لعمر الله»، «على عهد الله وميثاقه وذمته وأمانته وكفالته».\n• قوله «أقسمت» أو «أقسم» أو «حلفت» أو «أحلف بالله لأفعلن كذا» يمين، إلا إن نوى خبراً ماضياً.\n• قوله لغيره «أقسم عليك بالله» أو «أسألك بالله لتفعلن كذا» يمين إن أراد به يمين نفسه، وإلا حُمل على الشفاعة.\n\nالحلف بغير الله:\n• لا تنعقد اليمين بمخلوق كالنبي وجبريل والكعبة، ولو مع قصده، بل يُكره الحلف به إلا أن يسبق إليه لسانه.\n• لو قال «إن فعلت كذا فأنا يهودي» أو «بريء من الإسلام» أو «من الله» أو «من رسوله»: فليس بيمين، ولا يكفر به إن أراد تبعيد نفسه عن الفعل أو أطلق. وليقل: لا إله إلا الله محمد رسول الله ويستغفر الله. وإن قصد الرضا بذلك إذا فعله فهو كافر في الحال."}, {"title": "نذر اللجاج ولغو اليمين", "body": "• من حلف بصدقة ماله (كقوله: لله عليّ أن أتصدق بمالي إن فعلت كذا) أو بالعتق، ويُسمى نذر اللجاج والغضب: فهو مخيّر على أظهر الأقوال بين فعل ما التزمه أو كفارة يمين، لخبر مسلم: «كفارة النذر كفارة يمين».\n• لو قال «إن فعلت كذا فعليّ كفارة يمين» أو «كفارة نذر»: لزمته الكفارة عند وجود الصفة.\n\nلغو اليمين: لا شيء فيه، لقوله تعالى: «لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان».\n• قالت عائشة: لغو اليمين قول الرجل: «لا والله، وبلى والله»، كأن يقول ذلك في حال غضب أو لجاج أو صلة كلام.\n• لو حلف على شيء فسبق لسانه إلى غيره كان من لغو اليمين.\n• ومنه: دخل على صاحبه فأراد أن يقوم له فقال: والله لا تقوم لي."}, {"title": "أحكام الحنث", "body": "• من حلف ألا يفعل شيئاً معيناً (كألا يبيع أو لا يشتري) ففعل شيئاً غيره: لم يحنث، لأنه لم يفعل المحلوف عليه.\n• أما إذا فعل المحلوف عليه بنفسه أو بوكالة، فإن كان عالماً مختاراً حنث، وإن كان ناسياً أو جاهلاً أو مكرهاً: لم يحنث.\n• ومن صور الجهل: حلف ألا يدخل داراً فدخلها وهو لا يعرف أنها المحلوف عليها، أو حلف ألا يسلم على زيد فسلم عليه في ظلمة وهو لا يعرفه.\n• من حلف ألا يفعل شيئاً (كألا يطلق امرأته أو لا يضرب غلامه) فأمر غيره ففعله: لم يحنث، لأنه حلف على فعله ولم يفعل. إلا أن يريد ألا يفعله هو ولا غيره فيحنث بفعل وكيله.\n• لو حلف لا يبيع ولا يوكّل وكان وكّل قبل ذلك فباع الوكيل بعد يمينه: لا يحنث.\n• لو حلف ليثنين على الله أحسن الثناء فليقل: «الحمد لله حمداً يوفّي نعمه ويكافئ مزيده»."}, {"title": "كفارة اليمين", "body": "• كفارة اليمين مخيّرة في الابتداء مرتبة في الانتهاء، وسبب وجوبها عند الجمهور الحنث واليمين معاً.\n• المكفّر الحر الرشيد مخيّر ابتداءً بين ثلاثة أشياء:\n١) عتق رقبة مؤمنة.\n٢) إطعام عشرة مساكين، لكل مسكين مُدّ من جنس الفطرة.\n٣) كسوتهم بما يسمى كسوة مما يُعتاد لبسه، ولو ثوباً ثوباً، أو عمامة، أو إزاراً، أو طيلساناً، أو منديلاً.\n• يُندب أن يكون الثوب جديداً، لقوله تعالى: «لن تنالوا البر حتى تنفقوا مما تحبون».\n• لا يجزئ إطعام خمسة وكسوة خمسة، كما لا يجزئ إعتاق نصف رقبة وإطعام خمسة.\n• فإن لم يجد شيئاً من الثلاثة لعجزه عنها: فصيام ثلاثة أيام، لقوله تعالى: «فصيام ثلاثة أيام».\n• العاجز بغيبة ماله كغير العاجز لأنه واجد، فينتظر حضور ماله.\n• لا يجب التتابع في صيام الكفارة لإطلاق الآية. وأما قراءة ابن مسعود «متتابعات» فنُسخت تلاوةً وحكماً فلا يُستدل بها."}, {"title": "النذر: تعريفه ودليله وأركانه وشروطه", "body": "• النذر لغةً: الوعد بخير أو شر. وشرعاً: الوعد بخير خاصة (الروياني والماوردي)، وقال غيرهما: التزام قربة لم تتعين.\n• ذكره المصنف عقب الأيمان لأن كلاً منهما عقد يعقده المرء على نفسه تأكيداً لما التزمه.\n• دليله: قوله تعالى: «وليوفوا نذورهم»، وخبر البخاري: «من نذر أن يطيع الله فليطعه، ومن نذر أن يعصي الله فلا يعصه».\n• أركانه ثلاثة: صيغة، ومنذور، وناذر.\n\nشروط الناذر: إسلام، واختيار، ونفوذ تصرف فيما ينذره. فلا يصح من كافر، ولا من مكره، ولا ممن لا ينفذ تصرفه كمحجور سفه أو فلس في القرب المالية المعينة، وصبي ومجنون.\n• شرط الصيغة: لفظ يشعر بالتزام، كقوله «لله عليّ كذا» أو «عليّ كذا»."}, {"title": "النذر الذي يلزم والذي لا يلزم", "body": "• يلزم النذر على فعل طاعة مقصودة لم تتعين: كعتق، وعيادة مريض، وسلام، وتشييع جنازة، وقراءة سورة معينة، وطول قراءة صلاة، وصلاة جماعة.\n• لا يصح نذر: الواجب العيني كصلاة الظهر (لأنه لزم بإلزام الشرع)، أو المخيّر كأحد خصال كفارة اليمين، أو المعصية كشرب خمر، أو المكروه كصوم الدهر لمن خاف به ضرراً أو فوت حق. لخبر: «لا نذر إلا فيما ابتغي به وجه الله تعالى».\n• نذر المباح (كأكل وشرب) لا ينعقد باتفاق الأصحاب، ولا كفارة فيه على المعتمد.\n\nنذر المجازاة (نوع من التبرر، وهو المعلق بشيء): كقوله «إن شفى الله مريضي فلله عليّ أن أصلي أو أصوم أو أتصدق». ويلزمه بعد حصول المعلق عليه ما يقع عليه الاسم: في الصلاة ركعتان على الأظهر، وفي الصوم يوم واحد، وفي الصدقة ما يُتموَّل شرعاً.\n• نذر التبرر غير المعلق: كقوله ابتداءً «لله عليّ صوم أو حج»، يلزمه ما التزمه.\n• لو علق النذر بمشيئة الله أو مشيئة زيد لم يصح، لعدم الجزم اللائق بالقرب.\n\nنذر المعصية: لا يصح ولا تجب به كفارة إن حنث، كقوله «إن قتلت فلاناً فلله عليّ كذا»، لحديث مسلم: «لا نذر في معصية الله».\nنذر ترك المباح أو فعله: لا ينعقد، كقوله «لا آكل لحماً ولا أشرب لبناً»، لخبر أبي إسرائيل الذي نذر أن يصوم ولا يقعد ولا يستظل ولا يتكلم فقال ﷺ: «مروه فليتكلم وليستظل وليقعد وليتم صومه»."}]}, {"id": "s17", "title": "الأقضية والشهادات (ص 178–215)", "lessons": [{"title": "تعريف الأقضية والشهادات ودليل القضاء وحكمه", "body": "• الأقضية: جمع قضاء (بالمد كقباء وأقبية). وهو لغةً: إمضاء الشيء وإحكامه. وشرعاً: فصل الخصومة بين خصمين فأكثر بحكم الله تعالى.\n• الشهادات: جمع شهادة، وهي إخبار عن شيء بلفظ خاص.\n\nدليل القضاء: قوله تعالى: «وأن احكم بينهم بما أنزل الله»، وقوله: «فاحكم بينهم بالقسط»، وخبر الصحيحين: «إذا اجتهد الحاكم فأخطأ فله أجر وإن أصاب فله أجران».\n• أجمع المسلمون (كما قال النووي) أن هذا الحديث في حاكم عالم أهل للحكم. أما من ليس بأهل فلا يحل له أن يحكم، وإن حكم فهو آثم ولا ينفذ حكمه سواء وافق الحق أم لا.\n• وروى الأربعة والحاكم: «القضاة ثلاثة: قاضيان في النار وقاض في الجنة: فأما الذي في الجنة فرجل عرف الحق وقضى به، واللذان في النار: رجل عرف الحق فجار في الحكم، ورجل قضى للناس على جهل».\n\nحكم تولي القضاء: فرض كفاية في حق الصالحين له في ناحية. أما تولية الإمام لأحدهم ففرض عين عليه، فمن تعيّن عليه لزمه طلبه وقبوله."}, {"title": "شروط القاضي (أربع عشرة خصلة)", "body": "لا يصح أن يلي القضاء إلا من استكملت فيه أربع عشرة خصلة:\n١) الإسلام: فلا تصح ولاية كافر ولو على كافر.\n٢) البلوغ.\n٣) العقل: فلا تصح ولاية غير مكلف.\n٤) الذكورية: فلا تصح ولاية امرأة.\n٥) العدالة: فلا تصح ولاية فاسق.\n٦) معرفة أحكام الكتاب والسنة على طريق الاجتهاد، ولا يُشترط حفظ آياتها وأحاديثها عن ظهر قلب (وآيات الأحكام نحو خمسمائة آية). ويعرف العام والخاص، والمجمل والمبين، والمطلق والمقيد، والناسخ والمنسوخ، والمتواتر والآحاد.\n٧) معرفة الإجماع والاختلاف: ليحذر أن يقع في حكم أجمعوا على خلافه.\n٨) معرفة طرق الاجتهاد.\n٩) معرفة طرف من لسان العرب لغةً وإعراباً وتصريفاً.\n١٠) معرفة طرف من تفسير كتاب الله.\n١١) أن يكون سميعاً (ولو بصياح في أذنه): فلا يُولّى أصم لا يسمع أصلاً.\n١٢) أن يكون بصيراً: فلا يُولّى أعمى. وتصح تولية الأعور. وقد استخلف النبي ﷺ ابن أم مكتوم على المدينة في إمامة الصلاة دون الحكم.\n١٣) أن يكون كاتباً (على أحد وجهين)، والأصح عدم اشتراطه لأنه ﷺ كان أمياً.\n١٤) أن يكون متيقظاً، بحيث لا يُؤتى من غفلة ولا يُخدع. (والمجزوم به أن ذلك مستحب لا شرط).\n\n• إذا عرف الإمام أهلية أحد ولّاه، وإلا بحث عن حاله كما اختبر النبي ﷺ معاذاً.\n• لو وُلّي من لا يصلح مع وجود الصالح والعلم بالحال أثم المولّي والمولّى، ولا ينفذ قضاؤه وإن أصاب.\n• فإن تعذر وجود جميع الشروط فولّى سلطان ذو شوكة فاسقاً أو مقلداً نفذ قضاؤه للضرورة، لئلا تتعطل مصالح الناس."}, {"title": "زوال أهلية القاضي وعزله وجلوسه", "body": "زوال الأهلية والعزل:\n• لو زالت أهلية القاضي بجنون أو إغماء انعزل، ولو عادت لم تعد ولايته.\n• للقاضي عزل نفسه كالوكيل. وللإمام عزله بخلل فيه أو بوجود من هو أفضل منه أو بمصلحة كتسكين فتنة، وإلا حرم.\n• لا ينعزل القاضي قبل بلوغه خبر العزل.\n• لا ينعزل القاضي ولا الوالي بانعزال الإمام.\n\nمكان الجلوس وآدابه:\n• يُستحب أن يجلس القاضي في وسط البلد ليتساوى أهله في القرب منه، في موضع فسيح بارز للناس ظاهر لهم، مصون من أذى الحر والبرد.\n• يُكره له أن يتخذ حاجباً (وقت الحكم) لخبر: «من ولي من أمور الناس شيئاً فاحتجب حجبه الله يوم القيامة». أما من وظيفته ترتيب الخصوم فلا بأس به.\n• أول ما ينظر فيه: أهل الحبس، ثم الأوصياء، ثم يتخذ كاتباً عدلاً. ويتخذ مترجمين ودِرّة للتأديب وسجناً.\n• يُكره أن يتخذ المسجد مجلساً للحكم صوناً له عن ارتفاع الأصوات واللغط. ولو اتفقت قضية وقت حضوره فيه لصلاة فلا بأس بفصلها. وإقامة الحدود فيه أشد كراهة."}, {"title": "ما يجب على القاضي وما يُحظر عليه", "body": "يجب على القاضي أن يسوّي بين الخصمين في سبعة أشياء:\n١) المجلس: يُجلسهما بين يديه.\n٢) استماع اللفظ منهما.\n٣) اللحظ (النظر) إليهما.\n٤) دخولهما عليه: فلا يدخل أحدهما قبل الآخر.\n٥) القيام لهما: فلا يخصّ أحدهما بالقيام إن علم أنه في خصومة.\n٦) جواب سلامهما إن سلّما معاً.\n٧) طلاقة الوجه وسائر أنواع الإكرام.\n\nيُندب ألا يشتري ولا يبيع بنفسه لئلا يشتغل قلبه ولأنه قد يُحابَى، وألا يكون له وكيل معروف.\n\nالهدية للقاضي:\n• لا يجوز للقاضي أن يقبل الهدية وإن قلّت، لخبر: «هدايا العمال سُحت». فإن أُهدي إليه من له خصومة في الحال عنده، أو لم يُهد له قبل ولايته: حرم قبولها. ولا يملكها لو قبلها، ويردها على مالكها، فإن تعذر وضعها في بيت المال.\n\nيحظر على القاضي:\n• أن يسأل المدعى عليه الجواب إلا بعد كمال الدعوى الصحيحة.\n• أن يُحلّف المدعى عليه إلا بعد طلب المدعي تحليفه.\n• أن يلقّن خصماً حجة يستظهر بها على خصمه (أما الشاهد فيجوز تعريفه كيفية أداء الشهادة).\n• أن يتعنّت بالشهود كأن يقول لهم: لِمَ شهدتم؟\n• ألا يقبل الشهادة إلا ممن ثبتت عدالته.\n• ولا ينفذ حكم القاضي لنفسه، ولا لشريكه في المال المشترك للتهمة."}, {"title": "المواضع التي يُكره القضاء فيها وكتاب القاضي", "body": "ضابط المواضع التي يُكره للقاضي القضاء فيها: كل حال يتغيّر فيه خُلقه وكمال عقله.\nوهي (عشرة بل أكثر):\n١) عند الغضب، لخبر الصحيحين: «لا يحكم أحد بين اثنين وهو غضبان».\n٢) الجوع. ٣) العطش (المفرطين، وكذا الشبع المفرط).\n٤) شدة الشهوة. ٥) الحزن المفرط. ٦) الفرح المفرط.\n٧) المرض المؤلم. ٨) مدافعة الأخبثين (البول والغائط). ٩) النعاس.\n١٠) شدة الحر والبرد.\n• وأُهمل: الخوف المزعج، والملل.\n• إنما كُره القضاء في هذه الأحوال لتغيّر العقل والخلق فيها. فلو خالف وقضى نفذ قضاؤه.\n• تنتفي الكراهة إذا دعت الحاجة إلى الحكم في الحال.\n\nشهادة العدو والأصول والفروع:\n• لا تُقبل شهادة عدو على عدوه، لحديث: «لا تُقبل شهادة ذي غمر على أخيه» (الغمر: الغل والحقد). والمراد العداوة الدنيوية الظاهرة. وتُقبل شهادته له.\n• لا تُقبل شهادة والد وإن علا لولده وإن سفل، ولا ولد لوالده، للتهمة. وتُقبل شهادة الوالد على ولده وعكسه.\n• تُقبل شهادة أحد الزوجين للآخر. وتُقبل شهادة الأخ لأخيه، والصديق لصديقه.\n• أما العداوة الدينية فلا توجب رد الشهادة: فتُقبل شهادة المسلم على الكافر.\n\nكتاب القاضي إلى قاض:\n• لا يقبل القاضي كتاب قاضٍ كتب له به إلى قاض آخر (ولو غير معين) فيما أنهاه فيه من الأحكام إلا بعد شهادة شاهدين عدلين يشهدان بما فيه."}, {"title": "الدعوى والبينات", "body": "• الدعوى لغةً: الطلب والتمني. وشرعاً: إخبار عن وجوب حق له على غيره عند حاكم.\n• البينات: جمع بينة، وهم الشهود، سُمّوا بذلك لأن بهم يتبيّن الحق.\n\nدليلها: قوله تعالى: «فاستشهدوا شهيدين من رجالكم»، وخبر مسلم: «لو يُعطى الناس بدعواهم لادّعى ناس دماء رجال وأموالهم، ولكن اليمين على المدعى عليه»، وقوله ﷺ: «البينة على المدّعي واليمين على من أنكر».\n\nما يتعلق بهذا الفصل خمسة أمور: الدعوى، وجوابها، واليمين، والبينة، والنكول.\n• المدعي: من خالف قوله الظاهر. والمدعى عليه: من وافق قوله الظاهر.\n\nشروط صحة الدعوى (ستة):\n١) أن تكون معلومة غالباً بأن يفصّل المدعي ما يدعيه.\n٢) أن تكون ملزمة.\n٣) أن يعيّن مدعىً عليه: فلو قال قتله أحد هؤلاء لم تُسمع.\n٤، ٥) أن يكون كل من المدعي والمدعى عليه غير عدو لا أمان له، مكلفاً، فلا دعوى لصبي ولا مجنون ولا عليهما.\n٦) ألا تناقضها دعوى أخرى.\n\nأحكام الدعوى:\n• إذا كان مع المدعي بينة سمعها الحاكم وحكم له بها إن كانت معدّلة.\n• وإن لم تكن له بينة فالقول قول المدعى عليه بيمينه، لموافقته الظاهر.\n• إن نكل المدعى عليه (امتنع عن اليمين) رُدّت اليمين على المدعي، فيحلف ويستحق المدعى به بيمينه لا بنكول خصمه، لأنه ﷺ ردّها على صاحب الحق، وفعله عمر.\n• اليمين المردودة كإقرار الخصم لا كالبينة. فإن لم يحلف المدعي يمين الرد وهو بلا عذر سقط حقه من اليمين والمطالبة.\n• إن أبدى عذراً (كإقامة حجة وسؤال فقيه ومراجعة حساب) أُمهل ثلاثة أيام فقط.\n\nالتداعي:\n• إذا تداعيا شيئاً في يد أحدهما ولا بينة: فالقول قول صاحب اليد بيمينه.\n• إن كان في يديهما ولا بينة تحالفا وجُعل بينهما نصفين، لقضائه ﷺ بذلك.\n• لو أقام كل منهما بينة بما ادعاه وهو بيد ثالث: سقطتا.\n\nصفة اليمين:\n• من حلف على فعل نفسه (إثباتاً أو نفياً) حلف على البتّ والقطع.\n• من حلف على فعل غيره: إن كان إثباتاً حلف على البتّ والقطع، وإن كان نفياً مطلقاً حلف على نفي العلم أي أنه لا يعلم."}, {"title": "الشهادات: ركنها وشروط الشاهد والعدالة", "body": "• الشهادة: إخبار عن شيء بلفظ خاص.\n• دليلها: قوله تعالى: «واستشهدوا شهيدين من رجالكم»، وخبر الصحيحين: «ليس لك إلا شاهداك أو يمينه»، وخبر: «ترى الشمس؟ قال: نعم، قال: على مثلها فاشهد أو دع».\n• أركانها خمسة: شاهد، ومشهود له، ومشهود عليه، ومشهود به، وصيغة.\n\nشروط الشاهد عند أداء الشهادة (خمس بل تسع):\n١) الإسلام.\n٢) البلوغ. ٣) العقل: فلا تُقبل شهادة صبي ولا مجنون.\n٤) العدالة: فلا تُقبل شهادة فاسق، لقوله تعالى: «إن جاءكم فاسق بنبأ فتبيّنوا».\n٥) المروءة: لقوله ﷺ: «إذا لم تستح فاصنع ما شئت».\n٦) أن يكون غير متهم في شهادته.\n٧) أن يكون ناطقاً: فلا تُقبل شهادة الأخرس وإن فُهمت إشارته.\n٨) أن يكون يقظاً: فلا تُقبل شهادة مغفّل.\n٩) ألا يكون محجوراً عليه بسفه.\n• خرج بقيد الأداء: التحمل، فلا يُشترط عنده هذه الشروط.\n\nشروط العدالة (خمس):\n١) أن يكون مجتنباً للكبائر.\n٢) أن يكون غير مُصرّ على القليل من الصغائر.\n٣) أن يكون سليم السريرة: أي ألا يكون مبتدعاً يكفر أو يفسق ببدعته.\n٤) أن يكون مأموناً عند الغضب مما يُوقع فيه النفس الأمارة من قول الزور والغيبة والكذب.\n٥) أن يكون محافظاً على مروءة مثله."}, {"title": "أنواع الحقوق المشهود بها", "body": "الحقوق المشهود بها ضربان: حق الله تعالى، وحق الآدمي.\n\nأولاً: حق الآدمي (ثلاثة أضرب):\n١) ضرب لا يُقبل فيه إلا شاهدان ذكران (رجلان): وهو ما لا يُقصد منه المال ويطّلع عليه الرجال غالباً، كالطلاق، والنكاح، والرجعة، والإقرار بنحو زنا، والموت، والوكالة، والوصاية، والشركة، والقراض، والكفالة، والشهادة على شهادة.\n٢) ضرب يُقبل فيه شاهدان أو رجل وامرأتان أو شاهد ويمين المدعي: وهو ما كان مالاً أو القصد منه المال: كالبيع، والحوالة، والإقالة، والضمان، والخيار، والأجل. لقوله تعالى: «فإن لم يكونا رجلين فرجل وامرأتان»، ولقضائه ﷺ بشاهد ويمين.\n٣) ضرب يُقبل فيه رجلان أو رجل وامرأتان أو أربع نسوة: وهو ما لا يطّلع عليه الرجال غالباً، كالبكارة، والولادة، والحيض، والرضاع، وعيب المرأة تحت ثوبها، واستهلال الولد.\n\nثانياً: حقوق الله تعالى: فلا تُقبل فيها النساء أصلاً، وهي ثلاثة أضرب:\n١) ما لا يُقبل فيه أقل من أربعة رجال: وهو الزنا، لقوله تعالى: «لولا جاؤوا عليه بأربعة شهداء». وإنما تُقبل شهادتهم إذا قالوا: حانت منا التفاتة فرأينا، ويقولون: رأيناه أدخل حشفته في فرجها.\n٢) ما يُقبل فيه اثنان (رجلان): وهو ما سوى الزنا من الحدود (كالردة وقطع الطريق وقطع السرقة وجلد شارب المسكر).\n٣) ما يُقبل فيه رجل واحد: وهو هلال رمضان بالنسبة للصوم، احتياطاً للصوم."}, {"title": "شهادة الأعمى وشهادة التهمة والحسبة", "body": "• لا تُقبل شهادة على فعل كزنا وشرب خمر وغصب وإتلاف وولادة ورضاع واصطياد إلا بإبصار لذلك الفعل مع فاعله. قال تعالى: «ولا تقف ما ليس لك به علم»، وقال ﷺ: «على مثلها فاشهد أو دع».\n\nلا تُقبل شهادة الأعمى فيما يتعلق بالبصر، لجواز اشتباه الأصوات، إلا في ستة مواضع:\n١) الموت: يثبت بالتسامع.\n٢) النسب (من الأب
