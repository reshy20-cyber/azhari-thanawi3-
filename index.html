وسف: يمين، وهو المختار اعتباراً للعرف. و«والحق» يمين لأنه من أسماء الله. و«حقاً» ليس يميناً لأنه تأكيد الكلام.\n• قال: إن فعلت كذا فعليه لعنة الله أو هو زانٍ أو شارب خمر: ليس بيمين، وكذلك غضب الله وسخطه لأنه غير متعارف في الأيمان.\n• يمين: لعمر الله، وايم الله، وعهد الله، وميثاقه، وعليّ نذر، ونذر الله. أما عمر الله فبقاؤه، وأما وايم الله فمعناه أيمن الله، وعهد الله لقوله تعالى: «ولا تنقضوا الأيمان بعد توكيدها»، والنذر يمين لقوله ﷺ: «النذر يمين وكفارته كفارة يمين».\n• قال: أحلف أو أقسم أو أشهد أو زاد فيها ذكر الله فهو يمين، وكذا أعزم بالله وعليّ يمين ويمين الله. وقال زفر: لا يكون يميناً إلا أن يذكر اسم الله. ووجه الله يمين على رواية (ابن سماعة)، وروى الحسن عن أبي حنيفة أنه ليس بيمين."}, {"title": "تحريم المباح والاستثناء", "body": "• من حرّم على نفسه ما يملكه (كمالي عليّ حرام أو ثوبي أو ركوب هذه الدابة) فإن استباحه أو شيئاً منه لزمته الكفارة. قال ﷺ: «تحريم الحلال يمين وكفارته كفارة يمين». وهو أولى من الحرمة المؤبدة لأن له نظيراً في الشرع وأرفق.\n• الحرمة تتناول الكل جزءاً جزءاً فأي جزء استباح منه حنث (كقوله: لا أشرب الماء). ولو وهبه أو تصدق به فلا حنث لأن المراد حرمة الاستمتاع عرفاً.\n• قال: كل حلال عليّ حرام: فهو على الطعام والشراب إلا أن ينوي غيرهما. وقال زفر: يحنث متى فرغ لأنه باشر فعلاً حلالاً وهو التنفس. ولنا: أن المقصود البر ولا يحصل على اعتبار العموم فينصرف إلى الطعام والشراب.\n• وإن نوى امرأته وحدها صُدّق ولا يحنث بالأكل والشرب. وفي عرفنا يكون طلاقاً عرفاً ويقع بغير نية لأنهم تعارفوه فصار كالصريح وعليه الفتوى.\n• قال: مال فلان عليّ حرام فأكله أو أنفقه حنث إلا أن ينوي أنه لا يحل لي.\n• من حلف ألا يرتكب حراماً فهو على الزنا. وتبطل اليمين بالردة، فلو أسلم بعدها لا يلزمه حكمها.\n• من قال: إن شاء الله متصلاً بيمينه فلا حنث عليه، ولا بد من الاتصال لأن بالسكوت يتم الكلام فالاستثناء بعده رجوع ولا رجوع في اليمين."}]}, {"id": "n24", "title": "فصل في النذر (ص 194–198)", "lessons": [{"title": "النذر: تعريفه وحكمه ودليله", "body": "• النذر لغةً: الوعد بخير أو شر. وشرعاً: الوعد بخير خاصة، وقيل: التزام قربة لم تتعيّن، وقال الراغب: أن توجب على نفسك ما ليس بواجب لحدوث أمر.\n• حكمه: قربة مشروعة. أما كونه قربة فلما يلازمه من القُرَب كالصوم والصلاة والحج والعتق والصدقة. وأما شرعيته فللأوامر الواردة بإيفائه.\n• دليله:\n  - القرآن: «وليوفوا نذورهم».\n  - السنة: «أوفِ بنذرك»، «من نذر وسمّى فعليه الوفاء بما سمّى»، «من نذر أن يطيع الله فليطعه».\n  - الإجماع على مشروعيته.\n\nما يصح النذر به:\n• لا يصح إلا بقربة لله تعالى من جنسها واجب، كالصوم والصلاة والحج والعتق والصدقة.\n• ولا يصح بما ليس لله من جنسه واجب كالتسبيح والتحميد وعيادة المرضى وتكفين الميت وتشييع الجنازة وبناء المساجد.\n• الأصل: أن إيجاب العبد معتبر بإيجاب الله تعالى، إذ لا ولاية له على الإيجاب ابتداءً، وإنما صححناه فيما أوجبه الله تحصيلاً للمصلحة.\n• ولا يصح النذر بمعصية، قال ﷺ: «لا نذر في معصية الله تعالى»."}, {"title": "أنواع النذر وأحكامه", "body": "١) النذر المطلق: بغير شرط ولا تعليق كقوله: عليّ صوم شهر. فعليه الوفاء به.\n٢) النذر المعلق: كذلك إن علّقه بشرط فوُجد، لأن المعلق بالشرط كالمنجَّز عنده نظراً إلى الجزاء، والجزاء هو الأصل والشرط تبع.\n• وعن أبي حنيفة آخراً: أنه يجزئه كفارة يمين إذا كان شرطاً لا يريد وجوده، كقوله: إن كلمت فلاناً أو دخلت الدار فعليّ صوم سنة. وهو قول محمد واختاره بعض المشايخ للبلوى والضرورة. ولو أدى ما التزمه خرج عن العهدة أيضاً.\n• ولو كان شرطاً يريد وجوده كقوله: إن شفى الله مريضي أو قضى ديني أو قدمت من سفري، لا يجزئه إلا الوفاء بما سمّى لأنه نذر بصيغته وليس فيه معنى اليمين.\n\nمسائل:\n• قال: إن فعلت كذا فألف درهم من مالي صدقة ففعل وليس في ملكه إلا مائة لا يلزمه غيرها لأن النذر بما لا يملك لا يصح.\n• قال: لله عليّ إطعام عشرة مساكين أو كسوتهم: قال أبو حنيفة لا يجزئه إلا ما يجزئ في كفارة اليمين.\n• قال أبو يوسف: لو قال لله عليّ طعام أطعم ما شاء ولو لقمة.\n• لو قال: لله عليّ نذر ونوى الصوم أو الصدقة دون العدد لزمه في الصوم ثلاثة أيام وفي الصدقة إطعام عشرة مساكين، اعتباراً بالواجب في كفارة اليمين إذ هو الأقل.\n• لو نذر صوم اليوم الذي يقدم فيه فلان فقدم ليلاً فلا شيء عليه. وكذا لو قدم بعد الزوال أو قبله وقد أكل عند محمد. وقال أبو يوسف: يقضي في الأخيرين. ولو قدم في رمضان أو يوم الفطر قضاه ولا يجزئه صومه.\n• لو نذر صلاة ركعة أو صوم نصف يوم صلى ركعتين وصام يوماً، لأن الركعة صلاة وقربة في الجملة، وصوم نصف يوم قربة فصح التزامه ثم يلزمه إتمامه لعدم التجزؤ.\n• لو نذر ثلاث ركعات لزمه أربع عند أبي يوسف وركعتان عند زفر.\n• لو نذر أن يصلي بغير وضوء فليس بشيء. وعن أبي يوسف: يلزمه بوضوء."}]}, {"id": "n25", "title": "كتاب الحدود: الزنا والتعزير (ص 205–219)", "lessons": [{"title": "الحدود: تعريفها ودليلها وحكمتها", "body": "• الحدود: جمع حد، وهو لغةً: المنع (ومنه الحدّاد للبواب لمنعه الناس من الدخول، وحدود العقار موانع من الاشتراك، وأحدّت المعتدة إذا منعت نفسها من التنعم). وحدود الشرع: موانع وزواجر عن ارتكاب أسبابها.\n• شرعاً: عقوبة مقدّرة وجبت حقاً لله تعالى.\n• القصاص لا يُسمى حداً لأنه حق العباد، وكذا التعزير لأنه ليس بمقدَّر.\n• دليل مشروعيتها: الكتاب (الزانية والزاني فاجلدوا، والسارق والسارقة فاقطعوا، والذين يرمون المحصنات) والسنة (حديث ماعز والغامدية والعسيف).\n• حكمة مشروعيتها: أن الطباع البشرية والشهوة النفسانية مائلة إلى قضاء الشهوة واقتناص اللذات من الشرب والزنا والتشفي بالقتل وأخذ مال الغير والاستطالة بالشتم والضرب خصوصاً من القوي على الضعيف، فاقتضت الحكمة شرع الحدود حسماً لهذا الفساد وزجراً عن ارتكابه ليبقى العالم على نظم الاستقامة. وإليه الإشارة بقوله تعالى: «ولكم في القصاص حياة يا أولي الألباب»، ومن كلام العرب: القتل أنفى للقتل."}, {"title": "الزنا وما يثبت به", "body": "تعريف الزنا:\n• الزنا: وطء الرجل المرأة في القُبُل في غير الملك وشبهته.\n• «وطء»: لعموم استعمال اسم الزنا، ولأن ماعزاً لما فسّر الزنا بالوطء في القبل كالميل في المكحلة حدّه النبي ﷺ.\n• «في غير الملك»: لأن الملك سبب الإباحة. «وشبهته»: لقوله ﷺ: «ادرؤوا الحدود بالشبهات».\n• لا بد فيه من مجاوزة الختان لأن المخالطة بذلك تتحقق.\n\nما يثبت به الزنا: البينة والإقرار.\n\nالبينة:\n• أن يشهد أربعة على رجل وامرأة بالزنا، لقوله تعالى: «واللاتي يأتين الفاحشة من نسائكم فاستشهدوا عليهن أربعة منكم».\n• فإذا شهدوا سألهم القاضي عن ماهيته وكيفيته ومكانه وزمانه والمزني بها، احتيالاً للدرء المندوب إليه بقوله ﷺ: «ادرؤوا الحدود ما استطعتم».\n  - الماهية والكيفية: لاحتمال أنه اشتبه عليه فظن غير الزنا زنا، فإن ما دون الزنا يُسمى زنا مجازاً («والعينان تزنيان واليدان تزنيان…»).\n  - المكان والزمان: لاحتمال أنه زنا في زمان الصبا أو في المتقادم من الزمان فيسقط الحد.\n  - المزني بها: لاحتمال أنها ممن تحل له أو له فيها شبهة. فإن قالوا: لا نزيد على هذا لا يُحدّون لأنهم شهدوا بالزنا وهم أربعة.\n• فإذا بيّنوا ذلك وذكروا أنها محرمة عليه من كل وجه وشهدوا به كالميل في المكحلة وعُدِّلوا في السر والعلانية حُكم به. ولم يكتف أبو حنيفة بظاهر العدالة احتيالاً للدرء.\n• إن نقصوا عن أربعة فهم قذفة يُحدّون للقذف إذا طلب المشهود عليه، وكذلك إن جاؤوا متفرقين إلا أن يكونوا في مجلس واحد في ساعة واحدة.\n• وإن شهدوا أنه زنى بامرأة لا يعرفونها لم يُحدّ للشبهة.\n\nالرجوع في الشهادة:\n• إن رجعوا قبل الرجم سقط الحد عن المتهم وحُدّ الشهود حد القذف.\n• وإن رجعوا بعد الرجم ضمنوا الدية ويُحدّون كذلك (خلافاً لزفر). وإن رجع واحد فربع الدية.\n• وإن رجعوا بعد الجلد فالحد لما مر ولا يضمنون أرش السياط (وقال الصاحبان: يضمنون)."}, {"title": "التقادم والإقرار بالزنا", "body": "الشهادة بزنا متقادم:\n• إن شهدوا بزنا متقادم لم يمنعهم عن إقامته بُعدُهم عن الإمام لم تُقبل، لأن عمر خطب فقال: «أيما شهود شهدوا بحد لم يشهدوا عند حضرته فإنما هم شهود ضغن»، ولأنها شهادة تمكنت فيها تهمة.\n• الشهود إذا عاينوا الفاحشة فهم بالخيار: إن شاؤوا شهدوا حسبةً لإقامة الحد وإن شاؤوا سترواً على المسلم. فإن اختاروا الأداء حرم عليهم التأخير.\n• التقادم في الحدود الخالصة لله (الزنا والشرب والسرقة) يمنع قبول الشهادة إلا إذا كان التأخير لعذر كبعد المسافة أو مرض. وحد القذف فيه حق العبد فلا يمنع التقادم قبول الشهادة. ولا يلزم حد السرقة لأن الدعوى شرط للمال لا للحد.\n• لم يقدّر أبو حنيفة مدة التقادم وفوّضها إلى رأي الحاكم. وروى الحسن ومحمد عنه: بعد سنة. وقال أبو يوسف ومحمد: بعد شهر. وعن الطحاوي: ستة أشهر.\n\nالإقرار بالزنا:\n• يثبت بإقرار العاقل البالغ أربع مرات في أربع مجالس يرده القاضي في كل مرة حتى لا يراه، ثم يسأله كما يسأل الشهود إلا عن الزمان، فإذا بيّن ذلك لزمه الحد.\n• العقل والبلوغ شرط للتكاليف. والأربع لحديث ماعز: أقر فأعرض عنه ثم عاد حتى الرابعة فقال ﷺ: «الآن أقررت أربعاً فبمن؟». ووجه الاستدلال: لو وجب الحد بمرة لما أخّره، وقوله «أقررت أربعاً» دليل على أن الموجب هو الإقرار أربعاً، وأن أبا بكر قال له: إن أقررت الرابعة رجمك رسول الله ﷺ. وروي عن بريدة أن ماعزاً لو قعد بعد الثالثة لم يرجمه ﷺ. ولأن الزنا اختص بزيادة تأكيد.\n• اختلاف المجالس لما روينا، ولأن اتحاد المجلس يؤثر في المتفرقات فتثبت شبهة الاتحاد. والمعتبر اختلاف مجلس المقر.\n• يسأل القاضي عن حاله: «أبك داء؟ أبك خبل؟ أبك جنون؟». ثم يسأله عن الزنا لاحتمال أنه وطئها فيما دون الفرج («لعلك لمست لعلك قبلت لعلك باشرت»)، وعن المزني بها («فبمن؟»)، وعن المكان، ولا يسأله عن الزمان لأن التقادم لا يمنع قبول الإقرار.\n\nالرجوع عن الإقرار:\n• إذا رجع عن إقراره قبل الحد أو في وسطه خُلّي سبيله، لأن رجوعه إخبار يحتمل الصدق ولا مكذّب له فتحققت الشبهة. بخلاف القصاص وحد القذف لأنه حق العبد فهو يكذبه.\n• روي أن ماعزاً لما مسه حر الحجارة هرب فذكر ذلك للنبي ﷺ فقال: «هلّا خليتم سبيله».\n• يستحب للإمام أن يلقّنه الرجوع كقوله: لعلك وطئت بشبهة أو قبّلت أو لمست، وقال ﷺ للسارق: «ما إخالك سرقت»."}, {"title": "حد الزنا والتعزير ومراتب الضرب", "body": "حد الزاني المحصن: الرجم، لحديث ماعز وكان محصناً، ولقوله ﷺ: «لا يحل دم امرئ مسلم إلا بإحدى ثلاث» وذكر منها «زنا بعد إحصان»، ولأنه رجم الغامدية. وقال عمر: مما أنزل الله آية الرجم «الشيخ والشيخة إذا زنيا فارجموهما ألبتة»، وهو مما نُسخ لفظه وبقي معناه، وعليه إجماع العلماء. ويُغسَّل ويُكفَّن ويُصلى عليه، لقوله ﷺ في ماعز: «اصنعوا به ما تصنعون بموتاكم فقد تاب توبة لو تابها صاحب مكس غفر له».\nحد الزاني غير المحصن: جلد مائة، لقوله تعالى: «الزانية والزاني فاجلدوا كل واحد منهما مائة جلدة».\n\nما يثبت به الإحصان:\n• بالإقرار، أو بشهادة رجلين أو رجل وامرأتين (لأن الإحصان ليس علة لوجوب الرجم بل شرط محض)، أو إن كان بينهما ولد معروف بهما لأنه دليل ظاهر على الدخول في النكاح الصحيح.\n• يكفي أن يقول الشهود: دخل بها. وقال محمد: لا بد أن يقولوا: باضعها أو جامعها لأن الدخول مشترك. ولهما: أن الدخول إذا أُضيف إلى المرأة بالباء لا يراد به إلا الجماع.\n• إذا كان أحدهما محصناً دون الآخر خُصّ كل واحد بحده.\n\nما يؤخر إقامة الحد:\n• المريض: إن كان محصناً رُجم لأن الإتلاف مستحق عليه، وإلا لا يُجلد حتى يبرأ لأنه ربما أفضى إلى الهلاك، ولهذا لا يُقطع في البرد الشديد والحر الشديد.\n• الحامل لا تُحد حتى تضع حملها لأنه يُخاف هلاك ولدها البريء. وروي أن علياً قال لعمر لما همّ برجم حامل: إن كان لك عليها سبيل فلا سبيل لك على ما في بطنها. فإذا ولدت: إن كان حدها الجلد فحتى تتعافى من نفاسها، وإن كان الرجم فعقيب الولادة، فإن لم يكن للصغير من يربيه فحتى يستغني عنها. وقال ﷺ للغامدية: «اذهبي حتى تضعي» ثم «حتى يستغني ولدك».\n• يُحبس المريض حتى يبرأ والحامل حتى تضع إن ثبت بالبينة مخافة أن تهرب، وإن ثبت بالإقرار لا يُحبس.\n\nالتعزير:\n• تأديب دون الحد. أكثره تسعة وثلاثون سوطاً وأقله ثلاثة (عند أبي حنيفة ومحمد). وقيل: ما يراه الإمام. وقيل: بقدر الجناية. وقال أبو يوسف: أكثره خمسة وسبعون وفي رواية تسعة وسبعون.\n• الأصل: قوله ﷺ: «من بلغ حداً في غير حد فهو من المعتدين». فاعتبرا أدنى الحد وهو حد العبد (أربعون) فنقصا منه سوطاً، واعتبر أبو يوسف حد الأحرار (ثمانون) فنقص خمسة.\n• إن رأى الإمام أن يضم الحبس إلى التعزير فعل.\n\nمراتب الضرب: التعزير أشد الضرب، ثم حد الزنا، ثم حد الشرب، ثم حد القذف.\n• التعزير: لأنه خُفِّف من جهة العدد فيثقل من جهة الوصف. الزنا: ثبت بدليل مقطوع به وهو أعظم جريمة. الشرب: لأن سببه متيقَّن. القذف: لأن سببه محتمل (يحتمل صدق القاذف)."}]}, {"id": "n26", "title": "باب حد القذف (ص 221–226)", "lessons": [{"title": "القذف: تعريفه ومقداره وشروطه", "body": "• القذف لغةً: الرمي مطلقاً (ومنه القذيفة، وبين قاذف وحاذف، والتقاذف: الترامي بمعنى التشاتم).\n• شرعاً: رمي مخصوص وهو الرمي بالزنا (ومنه قذف هلال بن أمية زوجته).\n• مقدار الحد: ثمانون سوطاً للحر، ويجب بقذف المحصن بصريح الزنا، لقوله تعالى: «والذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة». والمراد بالرمي القذف بالزنا إجماعاً.\n• صريح الزنا: يا زاني، أو زنيت، أو يا ابن الزانية. ولو قال: يا ابن الزنا فهو قذف (أي أنت متولد من الزنا). ويجب الحد بأي لسان قذفه.\n• إحصان القذف خمسة شروط: العقل، والبلوغ، والحرية، والإسلام، والعفة عن الزنا.\n  - الإسلام: لما مر في حد الزنا.\n  - العقل والبلوغ: لأن الصبي والمجنون لا يلحقهما العار لعدم تحقق فعل الزنا منهما.\n  - العفة: لأن غير العفيف لا يلحقه العار، ولأن الحد جزاء على الكذب والقاذف لغير العفيف صادق."}, {"title": "أحكام حد القذف", "body": "متى تجب إقامته:\n• بطلب المقذوف، لما فيه من حقه وهو دفع العار عنه.\n• عند عجز القاذف عن إقامة أربعة شهود على صدق مقالته، فيُضرب ثمانين وتُرد شهادته أبداً.\n\nكيفية الإقامة: يُفرَّق الضرب على الأعضاء، ولا يُنزع عنه إلا الفرو والحشو، لأن سببه غير مقطوع به، وإنما ينزع الفرو والحشو لأنهما يمنعان إيصال الألم.\n\nبم يثبت: بإقراره مرة واحدة، أو بشهادة رجلين كسائر الحقوق.\nولا يبطل بالتقادم والرجوع لتعلق حق العبد به.\n\nمسائل:\n• من قال: يا ابن الزانية، أو لستَ لأبيك: حُدَّ لأنه صريح في القذف.\n• من نفاه عن جده أو نسبه إلى خاله أو عمه أو زوج أمه، أو قال: يا ابن ماء السماء: لم يُحد، لأن نفيه عن جده صدق ونسبته إلى هؤلاء مجاز عادةً وشرعاً. قال تعالى: «قالوا نعبد إلهك وإله آبائك إبراهيم وإسماعيل وإسحاق» وإبراهيم جده وإسماعيل عمه.\n• من قال لغيره: لستَ بابن فلان: إن كان في حالة الغضب حُدّ لأنه يراد به السب، وإن لم يكن في حالة الغضب لا يُحد لأنه يراد به المعاتبة عادةً لنفي شبهه بأبيه في الكرم والمروءة.\n• لا يطالب بقذف الميت إلا من يقع القدح بقذفه في نسبه، لأن العار يلحقهم للجزئية.\n• ليس للابن أن يطالب أباه بقذف أمه، لأن الأب لا يُعاقب بسبب ابنه.\n• إذا مات المقذوف بطل الحد، ولو مات بعدما أُقيم بعضه بطل الباقي.\n• لا يُورث حد القذف ولا يصح العفو عنه ولا الاعتياض، ويجري فيه التداخل. وهذا بناء على أن الغالب فيه حق الشرع (وفيه حق العبد أيضاً لأنه شُرع لدفع العار عن المقذوف)، وغلّب أصحابنا حق الشرع لأن حق العبد يتولاه مولاه فيصير مستوفىً ضمناً، بخلاف العكس."}, {"title": "التعزير بالسب وتداخل الحدود", "body": "التعزير للتنابز بالألقاب:\n• من قال لمسلم: يا فاسق، أو يا خبيث، أو يا كافر، أو يا سارق، أو يا مخنَّث: عُزِّر، لأنه آذاه وألحق به الشين، والحدود لا تثبت قياساً فوجب التعزير ليزجر ويعتبر غيره.\n• وعن أبي حنيفة: يا شارب الخمر، يا خائن يُعزَّر، وكذا: أنت تأوي اللصوص أو الزواني.\n• وقيل: يُعزَّر في حق الكل في عرفنا لأنهم يعدّونه سباً. وقيل: لا يُعزَّر في حق الكل لأنا تيقنا بنفيه فما لحقه شين وإنما لحق القاذف شين الكذب.\n\nمن حدّه الإمام أو عزّره فمات فهو هدر، لأنه مأمور من جهة الشرع فلا يتقيد بالسلامة كالفصّاد، أو لأنه استوفى حق الله بأمره فكأن الله أماته بغير واسطة فلا ضمان.\n\nتداخل الحدود:\n• من سرق أو زنى أو شرب غير مرة فحُدّ فهو للكل، لأن المقصود الانزجار وهو يحتمل حصوله بالأول فتتمكن في الثاني شبهة عدم المقصود.\n• أما لو زنى وشرب وسرق فيجب لكل واحد حد على حدة، لأنه لو ضُرب لأحدها ربما اعتقد أنه لا حد في الباقي فلا ينزجر، بخلاف اتحاد الجناية."}]}, {"id": "n27", "title": "باب حد الشرب (ص 228–230)", "lessons": [{"title": "حد الشرب", "body": "• هو كحد الزنا كيفيةً، وكحد القذف كميةً وثبوتاً.\n• دليله: قوله ﷺ: «من شرب الخمر فاجلدوه، فإن عاد فاجلدوه».\n• مقداره: ثمانون سوطاً للحر بإجماع الصحابة.\n• يثبت بإقراره مرة واحدة (وعن أبي يوسف: مرتين)، أو بشهادة رجلين كحد القذف.\n• يبطل بالرجوع، وبالتقادم في البينة والإقرار.\n• التقادم: بذهاب السكر والرائحة. فلو أقر بعد ذهاب الريح أو شهد عليه بعد السكر وذهاب الرائحة لم يُحد.\n  - وقال محمد: يُحد؛ ويقدّر التقادم بالزمان كالزنا لأن الرائحة مشتبهة.\n  - وعندهما (أبي حنيفة وأبي يوسف): مقدر بزوال الرائحة، لأن الحد ثبت بإجماع الصحابة ولا إجماع بدون رأي ابن مسعود الذي شرط وجود الرائحة، فقال لعم الغلام الذي جاء به: «بئس وليّ اليتيم أنت، لأدّبته صغيراً ولسترت عليه كبيراً. تلتلوه ومزمزوه واستنكهوه، فإن وجدتم ريح الخمر فاجلدوه».\n• لو أُخذ وريحها توجد منه فلما وصل إلى الإمام انقطعت لبعد المسافة حُدّ بالإجماع لأنه عذر.\n• لا يُحد السكران بإقراره على نفسه لزيادة احتمال الكذب فتمكنت الشبهة، بخلاف حد القذف لأن فيه حق العبد والسكران فيه كالصاحي عقوبةً له."}, {"title": "موجبات الحد في الشرب والسكران", "body": "موجباته: يُحد بشرب قطرة من الخمر، وبالسكر من النبيذ. لقوله ﷺ: «حُرّمت الخمر لعينها والسكر من كل شراب»، ولإطلاق قوله: «من شرب الخمر فاجلدوه»، وعليه إجماع الصحابة.\n\nالسكران:\n• عند أبي حنيفة: من لا يعرف الرجل من المرأة والأرض من السماء، لأنه يأخذ في أسباب الحدود بأقصاها درءاً للحد، فإن من ميّز فهو دليل الصحو أو بعضه وهو ضد السكر.\n• وقال الصاحبان: هو الذي يخلط كلامه ويهذي، لأنه المتعارف بين الناس، وهو اختيار أكثر المشايخ.\n\nمتى يُقام الحد على السكران:\n• لا يُحد حتى يُعلم أنه سكر من النبيذ وشربه طوعاً، لأن السكر يكون من المباحات كالبنج ولبن الرماك، والشرب مكرهاً لا يوجب الحد.\n• لا يُحد حتى يزول عنه السكر ليتألم بالضرب فتحصل مصلحة الزجر.\n• لا يُحد من وُجدت منه رائحة الخمر أو تقيّأها، لأن الرائحة مشتبهة واحتمال أنه شربها مكرهاً ثابت، والحدود لا تجب مع الشك."}]}, {"id": "n28", "title": "كتاب السرقة (ص 232–240)", "lessons": [{"title": "السرقة: تعريفها ودليلها وحكمتها", "body": "• السرقة لغةً: أخذ الشيء على سبيل الخفية والاستسرار بغير إذن المالك، سواء كان المأخوذ مالاً أو غير مال.\n• شرعاً: أخذ العاقل البالغ نصاباً محرَزاً، أو ما قيمته نصاب، ملكاً للغير لا شبهة له فيه، على وجه الخفية.\n• المعنى اللغوي مراعى ابتداءً وانتهاءً، أو ابتداءً في بعض الصور كمن نقب البيت خفية وأخذ المال مكابرةً بالليل (لأن الغوث بالليل لا يلحق فيقطع، بخلاف النهار).\n• في السرقة الصغرى هي مسارقة عين المالك أو من يقوم مقامه. وفي قطع الطريق (السرقة الكبرى) هي مسارقة عين الإمام وأعوانه لأنه المتصدي لحفظ الطريق.\nدليل وجوب القطع:\n• الكتاب: «والسارق والسارقة فاقطعوا أيديهما جزاء بما كسبا نكالاً من الله» (وقرأ ابن مسعود: فاقطعوا أيمانهما).\n• السنة: «من سرق قطعناه»، وأنه ﷺ رُفع إليه سارق فقطعه.\n• الإجماع: على وجوب القطع وإن اختلفوا في مقدار النصاب.\nالحكمة: أن المال محبوب إلى النفوس خصوصاً عند الحاجة والضرورة، ومن الناس من لا يردعه عقل ولا يمنعه نقل ولا تزجرهم ديانة ولا مروءة، فلولا الزواجر الشرعية من القطع والصلب لبادروا إلى أخذ الأموال مكابرةً أو خفيةً، فشُرعت حسماً لباب الفساد وإصلاحاً لأحوال العباد."}, {"title": "شروط القطع والنصاب", "body": "يشترط لإقامة الحد:\n١) العقل والبلوغ: لأن القطع شُرع زاجراً عن الجناية ولا جناية من الصبي والمجنون. (واشترط بعضهم النطق والبصر فلا قطع في الأخرس والأعمى لوجود الشبهة).\n٢) النصاب: لما روي أن اليد لم تكن تُقطع على عهد رسول الله ﷺ إلا في ثمن المِجَنّ. وعن عائشة: «كانت اليد لا تقطع في الشيء التافه»، ولأنه لا بد من اعتبار مال له خطر لتتحقق الرغبة فيه فيجب الزجر عنه، أما الحقير فلا.\n٣) أن يكون محرَزاً: لأنه ﷺ لم يوجب القطع في حريسة الجبل.\n٤) أن يكون غير مأذون له بالدخول فيه، لأن بالإذن يخرج من أن يكون حرزاً في حقه.\n٥) أن يكون ملكاً للغير لا شبهة له فيه، لأن الحدود تُدرأ بالشبهات.\n٦) أن تكون على سبيل الخفية، لأن السرقة لا تكون على الجهر.\n\nمقدار النصاب:\n• عشرة دراهم مضروبة من النقرة (الفضة)، أو دينار (نحو ٤٫٢٥ جرام ذهباً). والدرهم نحو ٣٫١٢٥ جرام فضة.\n• دليله: قوله ﷺ: «لا قطع في أقل من عشرة دراهم». واختلفت الروايات في قدر المِجَنّ فأخذ الحنفية بأكثره وهو عشرة دراهم لئلا تُقطع اليد المعصومة بالشك.\n• وروي عن أبي يوسف ومحمد: لا يُقطع في عشرة دراهم تبر ما لم تكن مضروبة. وروى أبو يوسف عن أبي حنيفة: تُعتبر قيمته بنقد البلد."}, {"title": "الحرز وأقسامه", "body": "• حرز كل شيء على حسب ما يليق به. قال ﷺ: «فإذا آواه الجرين ففيه القطع»، وقال: «لا قطع في حريسة الجبل، وما آواه المراح ففيه القطع».\n• الحرز يكون بالحافظ وبالمكان.\n\nأولاً: الحرز بالحافظ:\n• كمن جلس في الصحراء أو المسجد أو الطريق وعنده متاعه فهو محرَز به، سواء كان نائماً أو مستيقظاً. وقد قطع النبي ﷺ سارق رداء صفوان من تحت رأسه وهو نائم في المسجد. وسواء كان المتاع تحته أو عنده لأنه يُعدّ حافظاً له عرفاً.\n• المسجد والصحراء حرز بالحافظ: لأن الصحراء ليست بحرز، والمسجد ما بُني للحفظ والإحراز. فلو سرق منه وصاحبه عنده يحفظه قُطع.\n• بخلاف الحمام وكل حرز أُذن بالدخول فيه فلا يُقطع فيه وإن كان صاحبه عنده، لأنه بُني للإحراز فلا يعتبر فيه الحافظ.\n• يجب القطع بمجرد الأخذ في المحرَز بالحافظ لأن يد المالك زالت بالأخذ.\n\nثانياً: الحرز بالمكان:\n• هو ما أُعدّ للحفظ كالدور والبيوت والحانوت والصندوق، ولا يعتبر فيه الحافظ لأنه محرز بدونه.\n• لكن القطع لا يجب بالأخذ منه إلا بالإخراج منه، لأن يد المالك قائمة ما لم يخرجه.\n• الجوالق والفسطاط كالبيت لأنه عُمل للحفظ.\n• فإن سرق الفسطاط أو الجوالق نفسهما لا يُقطع لأنهما ليسا في حرز وإن كانا حرزاً لما فيهما، إلا أن يكون لهما حافظ فيُقطع.\n• قال أصحابنا: ما كان حرزاً لنوع فهو حرز لجميع الأنواع، حتى جعلوا شريجة البقال حرزاً للجواهر لأنه يُحرز خلفها الدراهم والدنانير.\n• ولهذا قالوا: لا يُقطع النباش، لأن القبر ليس بحرز لغير الكفن فلا يكون حرزاً للكفن."}, {"title": "ثبوت السرقة وأحكامها", "body": "ما تثبت به السرقة: ما يثبت به القذف، أي:\n• الإقرار مرة واحدة. وقال أبو يوسف: لا بد من مرتين، لأنه إحدى الحجتين فيعتبر فيها التثنية كالبينة. ولهما: أن السرقة والشرب يثبتان بالمرة فلا حاجة لأخرى كالقصاص وحد القذف، والتثنية في الشهادة منصوص عليها ويفيد تقليل تهمة الكذب بخلاف الإقرار، واشتراط الزيادة في الزنا خلاف القياس فيقتصر على مورد النص.\n• شهادة شاهدين كسائر الحقوق.\n\nما ينبغي على القاضي:\n• يسأل الشهود عن كيفيتها وزمانها ومكانها وماهيتها، لأنها تلتبس على كثير من الناس فيسأل احتياطاً في الحدود.\n• ينبغي أن يُلقَّن المقرُّ الرجوع احتيالاً للدرء، فقد أُتي ﷺ بسارق فقال: «أسرقت؟ ما إخالك سرقت».\n\nرجوع المقر: إذا رجع عن الإقرار صح في القطع لأنه خالص حق الله ولا مكذّب له فيه، ولا يصح في المال لأن صاحبه يكذّبه.\n\nحضور المسروق منه: لا بد من حضوره عند الإقرار والشهادة والقطع، حتى لا يُقطع ما لم يصدّقه لأن حقه متعلق بالسرقة فلا تثبت بدون دعواه، ولاحتمال أن يهبه المسروق أو يملكه فيسقط القطع.\n\nالاشتراك: إذا دخل جماعة الحرز وتولى بعضهم الأخذ قُطعوا جميعاً إن أصاب كل واحد نصاباً، لوجود السرقة من كل واحد منهم معنىً بالمعاونة كما في قطع الطريق. وإن كان الأقل من نصاب لم يُقطع لأن القطع يجب على كل واحد بجنايته فيعتبر كمالها في حقه."}, {"title": "صور في هتك الحرز والإخراج", "body": "• إن نقب فأدخل يده وأخرج المتاع لم يُقطع: لأنه لم يوجد هتك الحرز على وجه الكمال وهو الدخول، فصار فيه شبهة العدم فلا يجب الحد. (وعن أبي يوسف: يُقطع لأن المقصود إخراج المال من الحرز وقد وجد، كمن أدخل يده في صندوق الصيرفي. وجوابه: أن كمال الهتك بالدخول ممكن معتاد ولم يوجد، بخلاف الصندوق إذ الممكن فيه إدخال اليد دون الدخول).\n• إن دخل فناول المتاع آخر من خارج لم يُقطع: لأن الداخل لم يُخرج المتاع لاعتراض يد معتبرة عليه قبل إخراجه، والخارج لم يوجد منه هتك الحرز فلم تتم السرقة من كل واحد منهما. (وعن أبي يوسف: إن أخرج الداخل يده وناولها الخارج قُطع الداخل، وإن أدخل الخارج يده فتناول قُطعا).\n• إن ألقاه في الطريق ثم أخذه قُطع. وقال زفر: لا يُقطع لأن الإلقاء لا يوجب القطع وبالأخذ من الطريق لا يُقطع كما لو أخذه غيره. ولنا: أنه لم يعترض عليه فعل آخر فاعتُبر الكل فعلاً واحداً، وأن ذلك عادة اللصوص إذ يتعذر خروجهم بالمتاع فيفعلونه ليتفرغوا للدفع لو ظُهر عليهم أو للهرب، فكان من تمام السرقة. بخلاف ما إذا ألقاه ولم يأخذه لأنه مضيّع لا سارق."}]}, {"id": "n29", "title": "فصل فيما لا قطع فيه (ص 241–246)", "lessons": [{"title": "ما لا قطع فيه (١)", "body": "لا قطع في السرقة في الحالات الآتية:\n١) ما يوجد مباحاً تافهاً كالحطب والسمك والصيد والطير ونحوها: لحديث عائشة «كانت اليد لا تقطع في الشيء التافه»، وهو مباح في الأصل بصورته حقير لقلة الرغبات فيه ولا يجري فيه الشحّ والضنّة، فلا يؤخذ على كره من المالك عادةً فلا حاجة إلى الزاجر، وما فيه من الشركة العامة في الأصل يوجب الشبهة. وقال ﷺ: «لا قطع في الطير» ويعم جميع الطيور حتى الدجاج والبط.\n٢) ما يتسارع إليه الفساد كالفواكه الرطبة واللبن واللحم: لقوله ﷺ: «لا قطع في الطعام» ومعناه ما يتسارع إليه الفساد لأنه يُقطع في الحبوب إجماعاً. وقال ﷺ: «لا قطع في ثمر ولا كَثَر» (الثمر ما كان على رؤوس النخل، والكَثَر: الجُمّار وهو شحم النخل). وقال: «لا قطع في الثمار وما آواه الجرين ففيه القطع»، والذي يُجمع عادةً هو اليابس.\n٣) المصحف المحلّى: وعن أبي يوسف: يُقطع إذا بلغت الحلية نصاباً لأنها ليست من المصحف فاعتُبرت بانفرادها. ولنا: أنه يتأول فيه القراءة، ولأن الإحراز لأجل المكتوب ولا مالية له، وما وراءه تبع كالجلد والورق والحلية ولا عبرة بالتبع.\n  - الأصل: متى اجتمع ما يجب فيه القطع وما لا يجب لا يُقطع، كالشراب وماء الورد في إناء ذهب أو فضة، لاجتماع دليلي القطع وعدمه فأورث شبهة. حتى لو شرب ما في الإناء في الدار ثم أخرج الإناء فارغاً قُطع لأن المقصود حينئذ هو الإناء (رواه هشام عن محمد).\n٤) الزرع قبل حصاده والثمرة على الشجر: لعدم الحرز وللحديث المتقدم.\n٥) كتب العلم: لأنه يتأول قراءتها ولأن المقصود ما فيها وليس بمال."}, {"title": "ما لا قطع فيه (٢)", "body": "٦) لا قطع على خائن ولا نباش ولا منتهب ولا مختلس:\n• قال ﷺ: «لا قطع على خائن ولا منتهب ولا مختلس». والحرز قاصر في حق الخائن لأن المال غير محرَز عنه. والمنتهب (يأخذ المال قهراً عياناً معتمداً على قوته مع معاينة المالك) والمختلس (يختطف ويعتمد الهرب من غير غلبة مع معاينة المالك) مجاهران فلا يكونان سارقين.\n• سُئل علي عن المختلس والمنتهب فقال: «تلك دعارة معلنة لا قطع فيها». وليس معنى ذلك عدم عقوبتهم بل قد تصل إلى حد قطاع الطريق لمجاهرتهم ومكابرتهم.\n• النباش: يُقطع عند أبي يوسف لقوله ﷺ: «من نبش قطعناه» ولأنه سرق مالاً متقوماً من حرز مثله.\n  - ولهما (أبي حنيفة ومحمد): ما روى الزهري أن نباشاً أُخذ في زمن مروان بالمدينة والصحابة متوافرون فأجمعوا أن لا قطع عليه. ولأن اسم السارق لا يتناوله (أفردت له العرب اسماً)، والقطع وجب على السارق نصاً فإيجابه على النباش إلحاق بالقياس والحدود لا تثبت بالقياس. ولأنه ليس ملكاً للميت لانقطاع ملكه بالموت ولا للورثة لعدم جواز تصرفهم فيه، فلا مالك معيّن فلا يُقطع كمال بيت المال. وما رُوي محمول على السياسة.\n٧) لا قطع على من سرق من ذي رحم محرم، أو زوجته، أو من بيت المال، أو من الغنيمة، أو من مال له فيه شركة: لوقوع الخلل في الحرز لوجود الإذن في الدخول في البعض وبسوطة (انبساط) بينهم في المال، ولأن له نصيباً في بيت المال والمغنم، وهو مروي عن علي.\n٨) لا قطع بالسرقة من غريمه مثل ماله عليه: لأنه استوفى حقه، والحال والمؤجل سواء لأن الحق ثابت والتأجيل لتأخير المطالبة. وكذا لو سرق أكثر من حقه لأنه يصير شريكاً بمقدار حقه. ويُقطع بسرقة خلاف جنس ما عليه لأنه ليس له ولاية الاستيفاء منه إلا بيعاً، إلا إذا قال: أخذته رهناً بحقي أو قضاءً به فلا يُقطع لأنه مختلف فيه فقد ظنّ في موضعه."}, {"title": "الاشتراك مع غير المكلف وأحكام العين", "body": "اشتراك من لا قطع عليه:\n• قوم سرقوا وفيهم صبي أو مجنون لا قطع عليهم وإن تولى ذلك الكبير، لأنه فعل واحد لم يوجب القطع على البعض فلا يجب على الباقين للشبهة. وكذا شريك ذي الرحم المحرم.\n• وقال أبو يوسف: يُدرأ الحد عن الصبي والمحرم ويُقطع الآخر اعتباراً لحالة الاجتماع بحالة الانفراد إذ فعل كل منهما معتبر بانفراده.\n• وشريك الأخرس كشريك الصبي في الخلاف لأن الأخرس لا حد عليه لاحتمال أنه لو نطق ادعى شبهة الشركة.\n• قال أبو حنيفة: لا يُقطع الأعمى إذا سرق لجهله بمال غيره وحرز غيره.\n\nالعين المسروقة بعد القطع:\n• إذا قُطع والعين قائمة في يده ردّها إلى صاحبها لأنها ملكه. قال ﷺ: «من وجد عين ماله فهو أحق به»، وقطع ﷺ سارق رداء صفوان وردّ الرداء إلى صفوان.\n• وإن كانت هالكة لم يضمنها، لقوله ﷺ: «لا غُرم على السارق بعدما قُطعت يمينه»، وفي رواية ابن عوف: «إذا أُقيم عليه الحد فلا غرم عليه». ولأنه لو ضمنها لملكها من وقت الأخذ كما في الغصب فيكون القطع واقعاً على أخذ ملكه وهذا لا يجوز.\n• لو ملّكها غيره بأي طريق وهي قائمة بعينها فكذلك.\n\nتكرار سرقة العين الواحدة:\n• من قُطع في سرقة ثم سرقها وهي بحالها لم يُقطع. والقياس: أن يُقطع وهو رواية الحسن عن أبي يوسف لأنه إذا ردّها صارت كعين أخرى.\n• وجه الاستحسان: أنها صارت غير متقوّمة في حقه (لو استهلكها لا ضمان عليه)، وما ليس بمتقوّم في حقه لا قطع في سرقته، وبالرد إلى المالك وإن عادت العصمة حقيقةً فشبهة السقوط باقية نظراً إلى اتحاد الملك والمحل.\n• وإن تغير حالها كغزل فنُسج قُطع، لتبدل العين اسماً وصورةً ومعنىً حتى يملكه الغاصب به، وإذا تبدلت العين انتفت الشبهة الناشئة من اتحاد المحل.\n\nحضور المالك وغيبة الشهود:\n• حضور المالك أو من يقوم مقامه شرط لصحة القضاء بالسرقة لأن القضاء بها قضاء بالملك له. ولو غاب بعد القضاء قبل الاستيفاء لا يُقطع لأن للاستيفاء شبهاً بالقضاء، ولهذا رجوع الشهود وجرحهم بعد القضاء يمنع الاستيفاء.\n• غيبة الشهود وموتهم بعد القضاء لا يمنع الإمضاء، لأن هذا التوهم لا ينقطع فلو اعتُبر لم يُقم حد أبداً."}]}, {"id": "n30", "title": "حد قطع الطريق (ص 247–253)", "lessons": [{"title": "قطع الطريق: عقوبته ودليله", "body": "عقوبة قطاع الطريق (أربع أحوال):\n١) إذا خرجوا لقطع الطريق (جماعة أو واحد) فأُخذوا قبل أن يفعلوا شيئاً: حبسهم الإمام حتى يتوبوا.\n٢) إن أخذوا مال مسلم أو ذمي وأصاب كل واحد منهم نصاب السرقة: قُطعت أيديهم وأرجلهم من خلاف (اليد اليمنى والرجل اليسرى).\n٣) إن قتلوا ولم يأخذوا مالاً: قُتلوا حداً ولا يُلتفت إلى عفو الأولياء، لأنه إنما يقتلهم حدّاً حقاً لله تعالى ولا يصح العفو عن حقوق الله.\n٤) إن قتلوا وأخذوا المال: قُطعت أيديهم وأرجلهم من خلاف وقُتلوا وصُلبوا، أو قُتلوا، أو صُلبوا (والإمام فيهم بالخيار).\n\nالدليل: قوله تعالى: «إنما جزاء الذين يحاربون الله ورسوله ويسعون في الأرض فساداً أن يُقتّلوا أو يُصلّبوا أو تُقطّع أيديهم وأرجلهم من خلاف أو يُنفوا من الأرض» (المائدة ٣٣).\n• معنى «يحاربون الله»: الذين يحاربون أولياء الله وأولياء رسوله (لاستحالة محاربة الله بحذف المضاف)، وقيل: هم في حكم المحاربين لأنهم امتنعوا على الإمام وجماعة المسلمين وتظاهروا بمخالفة أوامر الله، وهو توسع ومجاز كقوله تعالى: «إن الذين يبايعونك إنما يبايعون الله».\n• المحاربون: قوم يجتمعون لهم مَنَعة بأنفسهم يحمي بعضهم بعضاً ويتناصرون على ما قصدوا، سواء كان امتناعهم بحديد أو خشب أو حجارة، ويكون قطعهم على المسافرين من المسلمين وأهل الذمة دون غيرهم (عند أبي حنيفة وأصحابه).\n• قال أصحابنا: الآية مرتبة على الأحوال الأربعة، وروي ذلك عن علي وابن عباس والنخعي وابن جبير، لأن الجنايات تتفاوت على الأحوال فاللائق تغلّظ الحكم بتغلظها.\n• النفي من الأرض: أي الحبس إذا أخافوا السبيل ولم يقتلوا ولم يأخذوا مالاً. وقيل: أن الإمام لا يزال يطلبهم حتى يخرجوا من دار الإسلام."}, {"title": "شروط الحد وأحكام الاشتراك", "body": "ما يشترط في أخذ المال:\n• أن يكون المال معصوماً عصمة مؤبدة، ولهذا قال: «مال مسلم أو ذمي». فلو قطعوا على مستأمن لا يُقطعون لأن خطره مؤقت فلا يجب فيه حد كالسرقة الصغرى.\n• أن يصيب كل واحد منهم نصاباً لما مر في السرقة.\n\nالقتل وأخذ المال:\n• إن قتلوا ولم يأخذوا مالاً قُتلوا حداً.\n• إن قتلوا وأخذوا المال فالإمام بالخيار على الوجه المبيّن، لأن أخذ المال موجب للقطع في الصغرى وتغلّظت الكبرى بقطع الطريق، والقتل موجب للقتل في غير قطع الطريق ويغلّظ هنا بأن يُقتل.\n• لا يُلتفت إلى عفو الولي وصلحه، وهو معنى قولنا: يُقتلون حداً.\n• إذا جمع بين القتل والسرقة جُمع عليه بين موجبيهما، وهكذا نزل جبريل بالحد فيهم، وتكون «أو» في الآية بمعنى الواو (للتنويع والتوزيع).\n• وقال أبو يوسف: لا يُترك الصلب لأنه منصوص عليه كالقتل والقطع ولأنه أبلغ في التشهير. وجوابه: أن التشهير حصل بالقتل والصلب مبالغة فيُخيَّر فيه.\n• وقال محمد: يُقتل أو يُصلب ولا يُقطع، لأن النفس وما دونها إذا اجتمعا لحق الله دخل ما دون النفس في النفس كالمحصن إذا زنى وسرق. وجوابنا: هذا حد واحد وجب لمعنى واحد وهو إخافة الطريق على وجه الكمال بالقتل وأخذ المال، والحد الواحد لا يدخل بعضه في بعض (فقطع اليد والرجل حد واحد في أخذ المال في الكبرى، وحدّان في الصغرى).\n\nالمباشر والمعين:\n• إن باشر القتل واحد منهم أُجري الحد على الكل لأن المحاربة تتحقق بالكل، فإنهم أقدموا اعتماداً على بعضهم حتى لو غُلبوا أو هُزموا انحازوا إليهم فكانوا عوناً لهم. ولهذا كان الردء في الغنيمة كالمقاتل، والردء ساعٍ في الأرض فساداً، فيُقتل كأهل البغي.\n• إن كان فيهم صبي أو مجنون أو ذو رحم محرم من المقطوع عليهم: سقط الحد وصار القتل للأولياء (فلو عفا الولي أو صالح سقط القصاص)، لأن الجناية واحدة قامت بالكل فإذا لم يكن فعل بعضهم موجباً صار فعل الباقين بعض العلة فلا يترتب عليه الحكم.\n  - الصبي والمجنون: لما مر في السرقة. ذو الرحم المحرم: لأن القافلة كالحرز فحصل الخلل في الحرز في حقهم، ولهذا لو قطع بعض القافلة على بعض لا يجب الحد لأن الحرز واحد فصارت كدار واحدة."}, {"title": "شروط الحرابة وأثر التوبة", "body": "شروط قطع الطريق في ظاهر الرواية:\n١) أن يكون قوم لهم مَنَعة ينقطع بهم الطريق.\n٢) ألا يكون في مصر ولا بين قريتين ولا بين مدينتين.\n٣) أن يكون بينهم وبين المصر مسيرة سفر، لأن قطع الطريق بانقطاع المارة والسابلة.\n٤) ألا يمنعوا عن المشي في هذه المواضع فيلحقهم الغوث ساعةً بعد ساعة من المسلمين أو من جهة الإمام.\n• وروي عن أبي يوسف: لو كان في المصر ليلاً، أو بينهم وبين المصر أقل من مسيرة سفر، فهم قطاع الطريق. وعليه الفتوى نظراً لمصلحة الناس بدفع شر المتغلّبة المفسدين.\n• وأبو حنيفة أجاب على ما شاهد في زمانه، فإن أهل الأمصار كانوا يحملون السلاح فلا يتمكن قاطع الطريق من مغالبتهم، فأما إذا تركوا هذه العادة وأمكن أن يتغلب عليهم قطاع الطريق أُجري عليهم الحد.\n\nأثر التوبة:\n• إذا تاب قطاع الطريق قبل أن يُؤخذوا سقط عنهم الحد وبقي حق العباد في المال والقصاص، لقوله تعالى: «إلا الذين تابوا من قبل أن تقدروا عليهم» (المائدة ٣٤)، وهو استثناء فيقتضي خروج التائب من الجملة فيُعمل به.\n• أما في السرقة إذا تاب ولم يردّ المال يُقطع، لأن قوله تعالى: «فمن تاب من بعد ظلمه وأصلح فإن الله يتوب عليه» (المائدة ٣٩) ليس استثناءً فلا يقتضي خروج التائب من الجملة السابقة، وهو كلام مبتدأ يستغني عن غيره فيُحمل على الابتداء لأنه أولى، أما الاستثناء فيفتقر في صحته إلى ما قبله فافترقا."}]}, {"id": "n31", "title": "كتاب السير: الجهاد وأقسامه (ص 260–265)", "lessons": [{"title": "السير والجهاد: التعريف والحكم", "body": "• السِّيَر: جمع سيرة وهي الطريقة، خيراً كانت أو شراً (ومنه سيرة العُمَرين)، ويقال: فلان محمود السيرة. وسُمي الكتاب بذلك لأنه يجمع سِيَر النبي ﷺ وطريقته في مغازيه وسيرة أصحابه، وترجم له كثيرون بالجهاد.\n• الجهاد لغةً: مصدر جَهَد، والجَهد: المشقة، يقال: جهدتُ جهاداً أي بلغت المشقة، وهو بذل الجهد وتحمل المشقة.\n• شرعاً: استفراغ الوسع في محاربة المعتدين.\n\nحكمه: الجهاد فرض عين عند النفير العام، وفرض كفاية عند عدمه.\n• فرض العين عند النفير العام: لقوله تعالى: «انفروا خفافاً وثقالاً». والنفير العام: أن يُحتاج إلى جميع المسلمين فلا يحصل المقصود وهو قهر المعتدين إلا بالجميع، فيصير عليهم فرض عين كالصلاة، وذلك إذا داهم العدو أرض الوطن واستنفر ولي الأمر جميع أفراد الدولة للدفاع عن أنفسهم.\n• فرض الكفاية إن لم يكن كذلك: إذا قام به البعض سقط عن الباقين كردّ السلام، لأن المقصود دفع شر الأعداء وكسر شوكتهم فإذا حصل بالبعض فلا حاجة لغيرهم. والنبي ﷺ كان يخرج إلى الجهاد ولا يخرج معه جميع أهل المدينة، ولأنه لو وجب على الجميع تعطلت مصالح المسلمين من الزراعة والصنائع.\n• تقوم الآن الجيوش التي تُعدّها الدول مقام الجهاد في دفع العدوان، وهو ما يشير إليه قوله تعالى: «وما كان المؤمنون لينفروا كافة فلولا نفر من كل فرقة منهم طائفة…» (التوبة ١٢٢).\n• لا يجوز لفرد أو جماعة أن تعلن الجهاد إلا من خلال مؤسسة الجيوش في الدول، من باب المصلحة العامة."}, {"title": "جهاد الدفع والدعوة قبل القتال", "body": "جهاد الدفع:\n• إذا هجم العدو وجب على جميع الناس الدفع، وتخرج المرأة بغير إذن زوجها لأنه صار فرض عين، وحق الزوج لا يظهر في مقابلة فرض الأعيان كالصلاة والصوم.\n• لا بأس بالجُعل (الأجرة والمكافأة المالية المرصودة للمجاهد) إذا كان بالمسلمين حاجة، لأنه دفع للضرر الأعلى باحتمال الأدنى. والحاجة: ألا يكون في بيت مال المسلمين شيء ويحتاج المسلمون إلى الميرة ومواد الجهاد وليس لهم شيء.\n• وقد صحّ أن النبي ﷺ استعار دروعاً من صفوان يوم حنين وقال: «بل عارية مضمونة». وكان عمر يُغزي الأعزب عن ذي الحليلة (المتزوج) ويُعطي الشاخص فرس القاعد.\n\nالدعوة قبل القتال:\n• يجب أن يدعو من لم تبلغه الدعوة، ليعلموا ما يقاتلون عليه، فربما أجابوا فيُكفى مؤنة القتال.\n• فإن قاتلهم بغير دعوة: قيل يجوز لأن الدعوة إلى الإسلام قد انتشرت في دار الحرب فقام الشيوع مقام البلوغ. وقيل: لا يجوز وهو آثم للنهي أو لمخالفة الأمر ولأن الشيوع في بعض البلاد لا يُعتبر شيوعاً في الكل.\n• يُستحب ذلك لمن بلغته الدعوة أيضاً مبالغةً في الإنذار، وليس بواجب، لأنه ﷺ أغار على بني المصطلق وهم غارّون، وعهد إلى أسامة بن زيد أن يغير على بني الأصفر صباحاً، والغارة لا تكون عن دعوة.\n• فإن أبوا (امتنعوا وبادروا بالعدوان) استعانوا بالله تعالى عليهم وحاربوهم، لقوله ﷺ: «فإن أبوا فاستعن بالله عليهم»، ولأنه أعذر إليهم فأقاموا على عداوتهم فوجبت مناجزتهم، والله هو الناصر لأوليائه المذلّ لأعدائه فيُستعان به."}, {"title": "آداب القتال والأمان", "body": "آداب الإسلام في الحرب:\n• ينبغي للمسلمين ألا يغدروا ولا يغلّوا ولا يمثّلوا. الغُلول: الخيانة والسرقة من المغنم. والغدر: نقض العهد فلا يجوز بعد الأمان. والمُثلة: التشويه بالجثة.\n• لا يقتلوا مجنوناً ولا امرأة ولا صبياً ولا أعمى ولا مقعداً ولا مقطوع اليمين ولا شيخاً كبيراً، لنهيه ﷺ عن قتل الصبيان والذراري، ورأى امرأة مقتولة فقال: «هاه، ما لها قُتلت وما كانت تقاتل؟». ولأن الموجب للقتل هو الحِراب (المقاتلة) بإشارة هذا النص وهؤلاء لا يقاتلون، والمجنون غير مخاطب، وكذلك مقطوع اليد والرجل من خلاف.\n• تقوم الدول مقام الأفراد الآن في هذه الأحكام، ولا يجوز لأحد من أفراد الرعية أن يتدخل محافظةً على أمن الدول وسلامتها.\n\nإعطاء الأمان:\n• إذا أمّن رجل أو امرأة كافراً أو جماعة أو أهل مدينة صح أمانهم، فلا يحل لأحد من المسلمين قتالهم.\n• شرط صحة الأمان: أن يكون المؤمِّن ممتنعاً مجاهداً يخافه الكفار، لأن الأمن إنما يكون بعد الخوف والخوف إنما يتحقق من الممتنع. والواحد يقوم مقام الكل في الأمان لتعذر اجتماع الكل عليه. قال ﷺ: «المسلمون تتكافأ دماؤهم، ويسعى بذمتهم أدناهم» أي أن الواحد يسعى بذمة جميعهم.\n• روي أن زينب بنت رسول الله ﷺ أمّنت زوجها فأجاز أمانها. وأجارت أم هانئ رجلين من المشركين فأراد علي أن يقتلهما فقالت: والله لا تقتلهما حتى تقتلني دونهما، ثم أغلقت دونه الباب وجاءت إلى النبي ﷺ فأخبرته فقال: «ما كان له ذلك، قد أجرنا من أجرت وأمّنا من أمّنت». فعُلم أن أمان الواحد جائز، وإذا جاز لا يجوز لأحد التعرض له بقتل ولا أخذ مال كما لو أمّنه الإمام."}]}, {"id": "n32", "title": "كتاب الوصايا (ص 266–281)", "lessons": [{"title": "الوصية: تعريفها وحكمها وحكمتها", "body": "• الوصايا: جمع وصية، وهي لغةً: طلب فعل يفعله الموصى إليه بعد غيبة الموصي أو بعد موته فيما يرجع إلى مصالحه (كقضاء ديونه والقيام بحوائجه ومصالح ورثته وتنفيذ وصاياه).\n• شرعاً: تمليك مضاف لما بعد الموت.\n• الاستيصاء: قبول الوصية، ومنه قوله ﷺ: «استوصوا بالنساء خيراً فإنهن عوان عندكم» أي اقبلوا وصيتي فيهن.\n• حكمها: قضية مشروعة وقربة مندوبة.\nالأدلة:\n• الكتاب: «من بعد وصية يوصي بها أو دين» (النساء ١٢، وفي الآية ١١ مثله).\n• السنة: حديث سعد بن أبي وقاص لما مرض بمكة فقال: إني لا أخلّف إلا بنتاً أفأوصي بجميع مالي؟ قال ﷺ: «لا». قال: فبثلثي؟ قال: «لا». قال: فبنصفه؟ قال: «لا». قال: فبثلثه؟ قال: «الثلث، والثلث كثير؛ لأن تدع ورثتك أغنياء خير من أن تدعهم عالة يتكففون الناس». وقال ﷺ: «إن الله تصدق عليكم بثلث أموالكم في آخر أعماركم زيادةً في أعمالكم تضعونه حيث شئتم». وهذا يدل على مشروعيتها وينفي وجوبها. وقال: «ما حق امرئ مسلم له مال يوصي فيه يبيت ليلتين إلا ووصيته مكتوبة عند رأسه» وهو يدل على الندبية.\n• الإجماع: فقد أوصى الأئمة المهديون والسلف الصالح، وعليه الأمة إلى يومنا.\nالحكمة: أن الإنسان لا يخلو من حقوق له وعليه وهو مؤاخذ بها، فإذا عجز بنفسه فعليه أن يستنيب غيره والوصي نائب عنه، ففي الوصية احتياط للخروج عن العهدة فتُندب وتُشرع تحصيلاً لهذه المصالح.\nترتيبها في التركة: مؤخرة عن مئونة الموصي (تجهيزه) وقضاء ديونه."}, {"title": "مقدار الوصية ولمن تصح", "body": "• الوصية مقدّرة بالثلث، وتصح للأجنبي مسلماً كان أو كافراً بغير إجازة الورثة، لحديث سعد، وهي مطلقة لا تتقيد بمسلم ولا غيره.\n• وما زاد على الثلث، وللقاتل والوارث: تصح بإجازة الورثة. وفي الحديث: «الحيف في الوصية من الكبائر» (قيل: بما زاد على الثلث وللوارث). وإنما امتنع ذلك لحق الورثة، لأن المريض مرض الموت قد استغنى عن المال وتعلق حقهم به، إلا أنه لم يظهر ذلك في الثلث لحاجته إليه ليتدارك ما فرّط فيه. فإذا أجازت الورثة فقد رضوا بإسقاط حقهم فيصح.\n• تُعتبر إجازتهم بعد موته: لأنه عند ذلك ثبت حقهم فيه لا قبله، وإنما يسقط الحق بعد ثبوته.\n• الوصية للوارث: قال ﷺ: «لا وصية لوارث ولا إقرار بدين» وفي رواية: «لا وصية لوارث إلا أن تجيزها الورثة». ولأنه حيف في الوصية، ولأنه تعلق به حق الجميع فإذا خصّ به البعض يتأذى الباقي ويثير بينهم الحقد والضغائن ويفضي إلى قطيعة الرحم، فإذا أجازه بقية الورثة علمنا أنه لا حقد ولا ضغائن فيجوز.\n• إن أجاز بعض الورثة ورد بعض: جاز في حق المجيز بقدر نصيبه وبطل في الباقي، لولايته على نفسه دون غيره.\n• الوصية للقاتل: لا تجوز إن وُجد القتل مباشرةً (عمداً أو خطأ). قال ﷺ: «لا وصية لقاتل». وكذا لو أوصى لرجل فقتله بطلت الوصية. فإذا أجازتها الورثة جازت عندنا، وقال أبو يوسف: لا تجوز عملاً بإطلاق الحديث ولأنها لجنايته وهي باقية. ولنا: أن الامتناع لحق الورثة لأن بطلانها نفع يرجع إليهم كبطلانها للوارث وبما زاد على الثلث.\n• كل ما توقف على إجازة الورثة فأجازوه فالموصى له يملكه من جهة الموصي لأن السبب صدر منه والإجازة رفع المانع كالمرتهن إذا أجاز بيع الرهن.\n• ممن تصح: لا تصح إلا ممن يصح تبرعه، فلا تصح من الصبي والمجنون، لأنها تبرع محض لا يقابله عوض مالي ولا نفع دنيوي فصارت كالهبة.\n• المستحب: أن ينقص من الثلث، لقوله ﷺ: «والثلث كثير». وعن علي: «لأن أوصي بالخمس أحب إليّ من أن أوصي بالربع، ولأن أوصي بالربع أحب إليّ من أن أوصي بالثلث». ولأن فيه صلة القريب بتركه حقه لهم، ولا صلة فيما إذا أوصى بالثلث تاماً.\n• إن كانت الورثة فقراء لا يستغنون بنصيبهم فتركها أفضل لما فيه من الصلة والصدقة. قال ﷺ: «أفضل الصدقة الصدقة على ذي الرحم الكاشح»، و«صدقة وصلة». وإن كانوا أغنياء: قيل الوصية أولى، وقيل يُخيَّر.\n• تصح للحمل: لأن الوصية استخلاف للموصى له في المال الموصى به والحمل أهل لذلك كما في الميراث، والوصية أخت الميراث. إلا أنها تبطل بالرجوع بخلاف الهبة لأنها تمليك للحال."}, {"title": "وقت القبول والرجوع والرد", "body": "المال الذي تُعتبر منه الوصية: يُعتبر المال والورثة الموجودون عند الموت، حتى لو أوصى بثلث ماله ولا مال له ثم اكتسب مالاً ومات، أو كان له فذهب أو نقص، فالمعتبر ماله حالة الموت لأن وقتئذ تنفذ الوصية وينتقل المال إلى ملك الموصى له. وكذلك الورثة لا اعتبار لمن مات قبله لا بإجازته ولا برده.\n\nوقت القبول: قبول الوصية بعد الموت، حتى لو أجازها قبله أو ردّها فليس بشيء، لأن حكمها وهو ثبوت الملك إنما يثبت بعد الموت. وتحتاج إلى القبول لأنها تمليك بعقد فتتوقف على القبول كغيرها من العقود، بخلاف الميراث فإنه خلافة عن الميت يثبت للوارث جبراً شرعاً بلا قبول. ولأنه لو ملك الموصى به من غير قبول لكان للموصي إلزامه الملك بغير اختياره ولا ولاية له عليه.\n\nالرجوع عن الوصية:\n• للموصي أن يرجع عن الوصية بالقول والفعل، وفي الجحود خلاف. لأنه تبرع لم يتم (تمامه بالموت والقبول) فيجوز الرجوع قبل التمام.\n• الرجوع بالقول: كقوله رجعت عن الوصية أو أبطلتها.\n• الرجوع بالفعل: كأن يفعل فعلاً يزيل ملكه عن الموصى به كالبيع والهبة (لأن الوصية إنما تنفذ في ملكه) سواء عاد إلى ملكه أم لا. وكذا كل فعل لو فعله الغاصب انقطع به حق المالك، أو استهلاك من كل وجه أو من وجه.\n• وكذا ما تزيد به العين الموصى بها كالبناء والصبغ والسمن في السويق والحشو بالقطن وخياطة الظهارة على البطانة، لأنه لا يمكن تسليمه بدون الزيادة ولا سبيل إلى نقضها لحصولها بفعل المالك في ملكه.\n• ذبح الشاة رجوع لأنه لحاجته عادةً فلا يبقى إلى وقت الموت.\n• الجحود: رجوع عند أبي يوسف خلافاً لمحمد (لأنه نفي في الماضي فكان لغواً عنده). ولأبي يوسف: أن الرجوع نفي في الحال والجحود نفي في الماضي والحال فأولى أن يكون رجوعاً.\n\nرد الوصية:\n• إذا قبل الموصى إليه الوصاية ثم ردّها في وجه الموصي فهو رد، لأنه ليس له إلزامه بغير اختياره.\n• وإن ردها في غير وجهه فليس بردّ، لما فيه من خيانة الميت وغروره، فإن الموصي مات معتمداً عليه واثقاً بخلافته بعده. بخلاف الوكيل لأن الموكِّل حي يقدر على التصرف بنفسه أو توكيل غيره.\n• وإن لم يقبلها ولم يردّها حتى مات الموصي فهو بالخيار إن شاء قبل وإن شاء لم يقبل.\n• القبول يكون بالقول وبالفعل كأن يبيع شيئاً من التركة بعد موت الموصي أو يشتري شيئاً للورثة أو يقضي مالاً أو يقتضيه، لزمته الوصية سواء علم بها أم لم يعلم لأنها خلافة كالإرث."}, {"title": "الوصية لأكثر من شخص وإيصاء الوصي", "body": "تعدد الأوصياء:\n• ليس لأحد الوصيين أن يتصرف دون صاحبه (عند أبي حنيفة ومحمد)، لأن الموصي ما رضي إلا برأيهما، والولاية إنما تثبت بتفويضه فيُراعى وصفه وهو الاجتماع، وفي اجتماع رأيهما مصلحة.\n• وقال أبو يوسف: لكل واحد منهما أن ينفرد بالتصرف في جميع الأشياء، لأن الوصية خلافة وذلك إنما يكون إذا ثبت للخليفة مثل ما كان للمستخلِف.\n• يستثنى من الاجتماع الضروريات: تجهيز الميت (لأن في تأخيره فساده حتى كان للجار فعله)، ومئونة الصغار من طعامهم وكسوتهم (يُخاف عليهم جوعاً وعرياً)، والخصومة (لا يمكن الاجتماع عليها)، ورد الوديعة والمغصوب، وقضاء الديون، وتنفيذ وصية بعينها، وحفظ الأموال، وقبول الهبة، وكل ما يخشى عليه التلف أو الفوات.\n• لو مات أحدهما أقام القاضي مكانه آخر: عندهما لأن الواحد لا ينفرد بالتصرف، وعند أبي يوسف لأن الموصي قصد أن يخلفه اثنان فينصب آخر لتحقيق قصده.\n• لو أن الوصي الميت أوصى إلى الثاني فله التصرف وحده، لأن رأيه باقٍ حكماً برأي وصيّه.\n\nوصية الوصي:\n• إذا أوصى الوصي إلى آخر فهو وصيّ في التركتين (تركته وتركة الميت الأول)، لأنه يتصرف بولاية مستقلة فيملك الإيصاء إلى غيره كالجد، لأن الولاية كانت ثابتة للموصي ثم انتقلت إلى الوصي في المال وإلى الجد في النفس، والإيصاء إقامة غيره مقامه.\n• وكذلك لو أوصى إلى رجل في تركة نفسه وقد حضرته الوفاة صار وصياً في التركتين في ظاهر الرواية. وروي عنهما: يقتصر على تركته لأنه نص عليها.\n• وصي الوصي كوصي الأب، ووصي الجد بمنزلة وصي الأب عند عدمه."}, {"title": "تصرفات الوصي في مال اليتيم", "body": "• يجوز للوصي أن يحتال بمال اليتيم إن كان أجود (بأن كان المحال عليه أملى أو أيسر قضاءً أو أعجل وفاءً)، لأنه أنظر لليتيم والولاية نظرية. ولهذا لا يجوز بيعه وشراؤه بما لا يتغابن فيه (الغبن الفاحش)، بخلاف الغبن اليسير لأنه لا يمكن الاحتراز عنه ففي اعتباره سد باب التصرفات.\n• يجوز بيعه وشراؤه لنفسه إن كان فيه نفع للصبي (بأن اشترى بأكثر من القيمة أو باعه بأقل منها). وقالا: لا يجوز قياساً على الوكيل. وله: أنه قربان لمال اليتيم بالتي هي أحسن فيجوز بالنص (ولا تقربوا مال اليتيم إلا بالتي هي أحسن) وصار كالأب.\n• ليس للوصي أن يقترض مال اليتيم ولأب ذلك، لأن الأب يملك شراء مال الصبي بمثل قيمته ولا كذلك الوصي. وللأب أن يأخذ من مال الصبي عند حاجته بقدر حاجته ولا كذلك الوصي.\n• ليس للوصي ولا للأب إقراض مال اليتيم، وللقاضي ذلك: لأن القرض تبرع ابتداءً معاوضة انتهاءً، فجُعل معاوضة في القاضي لقدرته على الاستخلاص بالحبس وغيره، وتبرعاً في حق غيره لعجزه نظراً واحتياطاً في مال اليتيم.\n• الوصي أحق بمال اليتيم من الجد: لأنه انتقلت إليه ولاية الأب بالإيصاء فكانت ولاية الأب قائمة حكماً، ولأن اختيار الأب الوصي مع علمه بالجد دليل أن تصرفه أنظر من تصرف الجد. فإن لم يوصِ الأب فالولاية للجد لأنه أقرب إليه وأشفق على بنيه، ولهذا ملك النكاح مع وجود الوصي، وإنما يُقدَّم الوصي في المال.\n• للوصي أن يدفع المال مضاربة ويعمل فيه هو مضاربةً، لأنه قائم مقام الأب. قال ﷺ: «ابتغوا في مال اليتامى خيراً». فإن عمل بنفسه أشهد على ذلك، فإذا أراد أن يستوجب طائفة من المال لنفسه بالمضاربة احتاج إلى الإشهاد نفياً للتهمة. وعن محمد: إن لم يشهد فما عمله للورثة.\n• للوصي أن يأكل من مال اليتيم إذا كان محتاجاً ويركب دابته إذا ذهب في حاجته، قال تعالى: «ومن كان فقيراً فليأكل بالمعروف».\n• روي عن أبي يوسف: لو طمع السلطان في مال اليتيم فصالحه الوصي من مال اليتيم على أقل مما طمع لم يضمن، لأنه مأمور بحفظ مال اليتيم ما أمكنه."}, {"title": "شهادة الوصي ودعواه", "body": "• شهادة الوصي للميت لا تجوز: لأنه يثبت لنفسه ولاية القبض. وعلى الميت تجوز إذ لا تهمة.\n• وتجوز للورثة إن كانوا كباراً ولا تجوز إن كانوا صغاراً.\n  - الشهادة للكبار: قال أبو حنيفة: إن كانت في مال الميت لا تجوز وفي غيره تجوز. وقالا: تجوز في الوجهين لأنه لا ولاية لهما عليه فلا يثبتان لأنفسهما ولاية التصرف فلا تهمة. ولأبي حنيفة: أنهما يثبتان لهما ولاية الحفظ وولاية بيع المنقول عند غيبة الوارث فتحققت التهمة، بخلاف ما إذا شهدا في غير التركة.\n  - الشهادة للصغار: لا تجوز بحال للتهمة.\n• إن أوصى إلى رجل إلى أن يقدم فلان فإذا قدم فهو الوصي، أو إلى أن يدرك ولدي: فهو كما قال، لأنها في معنى الوكالة ولأن الوصية مؤقتة شرعاً ببلوغ الأيتام أو إيناس الرشد فجاز أن تكون مؤقتة شرطاً.\n\nادعاء الوصي ديناً على الميت:\n• إذا ادعى الوصي ديناً على الميت ولا بينة له أخرجه القاضي من الوصية، لأنه يستحل أخذ مال اليتيم. وقيل: إن ادعى شيئاً بعينه أخرجه وإلا فلا.\n• والمختار: أن يقول له القاضي: إما أن تقيم البينة وتستوفي أو تبرئه وإلا أخرجتك من الوصية، فإن أبرأه وإلا أخرجه وأقام غيره."}, {"title": "الوصية بالمنافع وبحقوق الله", "body": "الوصية بالمنافع:\n• تجوز الوصية بسكنى داره وبغلّتها أبداً ومدةً معلومة، لأن المنافع يصح تمليكها حال الحياة بعوض وغير عوض فكذا بعد الممات للحاجة إلى ذلك كالأعيان. والموصى له يتملكها على ملك الموصي وتجوز مؤقتةً ومؤبدةً كما في الإعارة والإجارة.\n• فإن خرجت من الثلث سكن واستغل، لأن الثلث حق الموصي فلا تزاحمه الورثة فيه.\n• من أوصى بثمرة بستانه فله الثمرة الموجودة عند موته، وإن قال: أبداً فله ثمرته ما عاش. ولو أوصى بغلّة بستانه فله الحاضرة والمستقبلة. لأن الثمرة اسم للموجود عرفاً فلا ينتظم المعدوم إلا بدليل آخر، وقوله «أبداً» صريح في إرادته فينتظمه. أما الغلة فتنتظم الموجود وما سيوجد مرة بعد أخرى عرفاً (يقال: فلان يأكل من غلة بستانه وأرضه وداره).\n\nالوصية بحقوق الله تعالى:\n• من أوصى بحقوق الله تعالى قُدّمت الفرائض، لأنها أهم من النوافل: الفرائض تخرجه عن العهدة والنوافل تحصّل له زيادة الثواب، والأول أولى.\n• وإن تساوت (كلها فرائض) قُدّم ما قدمه الموصي إن ضاق الثلث عنها، لأن الظاهر أنه بدأ بالأهم.\n• وقيل: يبدأ بالحج ثم الزكاة لأنه يؤدى بالمال والنفس. وقيل: بالزكاة ثم الحج لأنه تعلق بها حق العباد.\n• ثم بعدهما الكفارات لأنهما أقوى منها في الفرضية والوعيد على الترك.\n• ثم صدقة الفطر بعد الكفارات، لأن الكفارات عُرف وجوبها بالقرآن وصدقة الفطر بالسنة.\n• ثم الأضحية، لأن صدقة الفطر مجمع على وجوبها والأضحية مختلف فيها.\n• وما ليس بواجب يُقدَّم ما قدمه الموصي."}]}], "questions": [{"q": "النكاح لغةً:", "options": ["الضم والجمع", "الطلاق", "المهر", "العقد"], "answer": 0, "explain": "وفي الشرع: ضم وجمع مخصوص وهو الوطء.", "unit": "n1"}, {"q": "النكاح في الشرع حقيقةً هو:", "options": ["العقد", "المهر", "الوطء", "الخطبة"], "answer": 2, "explain": "وقد يُستعمل في العقد مجازاً لأنه يؤول إلى الضم.", "unit": "n1"}, {"q": "من الأدلة على أن النكاح قد يراد به العقد بقرينة:", "options": ["لا نكاح إلا بشهود", "اصنعوا كل شيء إلا النكاح", "النكاح الحقيقي هو الوطء", "ولدتُ من نكاح"], "answer": 0, "explain": "لأن الشهود لا يكونون على الوطء.", "unit": "n1"}, {"q": "قوله ﷺ: «اصنعوا كل شيء إلا النكاح» المراد به:", "options": ["الوطء", "الخطبة", "المهر", "العقد"], "answer": 0, "explain": "أي من وطء حلال.", "unit": "n1"}, {"q": "حكم النكاح العام:", "options": ["حرام", "مباح فقط", "واجب دائماً", "مستحب مندوب إليه"], "answer": 3, "explain": "ثبتت شرعيته بالكتاب والسنة والإجماع.", "unit": "n1"}, {"q": "قال النبي ﷺ: «تناكحوا تكثروا»:", "options": ["فإنه فرض", "فإنه ينقص الرزق", "فإني مباهٍ بكم الأمم يوم القيامة", "فإنه خير لكم"], "answer": 2, "explain": "من أدلة السنة على النكاح.", "unit": "n1"}, {"q": "حالة الاعتدال في النكاح:", "options": ["حرام", "واجب", "سنة مؤكدة", "مكروه"], "answer": 2, "explain": "لأن النصوص أمرت به ورغّبت وأكدت.", "unit": "n1"}, {"q": "حالة التوقان في النكاح:", "options": ["مباح", "سنة", "واجب", "مكروه"], "answer": 2, "explain": "لأن الامتناع عن الحرام فرض، والنكاح يمنع الزنا.", "unit": "n1"}, {"q": "حالة الخوف من الجور في النكاح:", "options": ["واجب", "سنة", "مكروه كراهة تحريمية", "مستحب"], "answer": 2, "explain": "فإن تيقن الجور حُرّم.", "unit": "n1"}, {"q": "التوقان هو:", "options": ["شدة الميل إلى الجماع وخوف الوقوع في الز function pick(){head('أزهري');m.innerHTML=`<h2>اختر شعبتك</h2><div class="seg"><button onclick="setT('sci')">علمي</button><button onclick="setT('lit')">أدبي</button></div>`}
window.setT=t=>{track=localStorage.track=t;nav('home')};
const PAL=[['#14785a','#0b4d3a'],['#c9922b','#8a5f12'],['#2f6fd0','#1b3f85'],['#c4506b','#7e2a40'],['#7a56c4','#472f85'],['#1a8f9a','#0d5560']];const col=id=>PAL[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
function prog(id){const x=hist().filter(r=>r.id==id);if(!x.length)return 0;const a=x.reduce((s,r)=>s+r.sc,0),n=x.reduce((s,r)=>s+r.n,0);return Math.round(a/n*100)}
function streak(){const days=[...new Set(hist().map(r=>new Date(r.d).toDateString()))];let s=0,d=new Date();while(days.includes(d.toDateString())){s++;d.setDate(d.getDate()-1)}return s}
function home(){if(!track)return pick();head('ثالثة ثانوي أزهري');const h=hist(),tot=h.reduce((s,r)=>s+r.n,0),ok=h.reduce((s,r)=>s+r.sc,0);
 const hr=new Date().getHours(),g=hr<12?'صباح الخير':hr<18?'مساء الخير':'مساء النور';
 m.innerHTML=`<div class="hero"><h2>${g} يا بطل 👋</h2><p>كل يوم خطوة نحو التفوق إن شاء الله</p><div class="stats"><div><b>${streak()}</b><small>🔥 أيام متتالية</small></div><div><b>${tot}</b><small>سؤال محلول</small></div><div><b>${tot?Math.round(ok/tot*100):0}%</b><small>نسبة الصواب</small></div></div></div>
 <div class="qa"><button style="background:linear-gradient(135deg,#14785a,#0b4d3a)" onclick="quick()"><span>⚡</span>تدريب سريع</button><button style="background:linear-gradient(135deg,#c9922b,#8a5f12)" onclick="nav('exam')"><span>⏱️</span>امتحان</button><button style="background:linear-gradient(135deg,#2f6fd0,#1b3f85)" onclick="nav('stats')"><span>📊</span>نتائجي</button></div>
 <div class="seg"><button class="${track=='sci'?'on':''}" onclick="setT('sci')">علمي</button><button class="${track=='lit'?'on':''}" onclick="setT('lit')">أدبي</button></div>
 <div class="sec"><b>موادك الدراسية</b><small>${S.subjects.filter(s=>s.tracks.includes(track)).length} مادة</small></div><div class="grid">`+
 S.subjects.filter(s=>s.tracks.includes(track)).map(s=>{const c=col(s.id),p=prog(s.id),d=INLINE[s.id],nl=d?d.units.reduce((a,u)=>a+u.lessons.length,0):0,nq=d?d.questions.length:0;
 return `<button class="sc" style="background:linear-gradient(135deg,${c[0]},${c[1]})" onclick="subj('${s.id}')"><span class="em">${s.icon}</span><span class="nm">${s.name}<small>${nl} درس • ${nq} سؤال</small><div class="pb"><i style="width:${p}%"></i></div></span></button>`}).join('')+`</div>`}
async function quick(){const all=[];for(const s of S.subjects.filter(s=>s.tracks.includes(track))){const d=await data(s.id);d.questions.forEach(q=>all.push({...q,sid:s.id}))}if(!all.length)return alert('لا توجد أسئلة بعد');run(all[0].sid,all.sort(()=>Math.random()-.5).slice(0,10),false)}
const sub=id=>S.subjects.find(s=>s.id==id);
async function subj(id){const s=sub(id),d=await data(id),c=col(id);head(s.name);
 m.innerHTML=`<div class="shead" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><div class="em">${s.icon}</div><h2>${s.name}</h2><p>${d.units.length} وحدة • ${d.questions.length} سؤال • إتقان ${prog(id)}%</p></div><button class="btn o" style="margin:0 0 12px" onclick="nav('home')">← رجوع</button><div class="sec"><b>الوحدات</b></div>`+
 (d.units.length?d.units.map((u,i)=>`<button class="u" onclick="unit('${id}',${i})"><span class="n">${i+1}</span><span>${esc(u.title)}<small>${u.lessons.length?u.lessons.length+' أقسام':'قيد الإعداد'}</small></span></button>`).join(''):'<div class="note">لم يُضف محتوى لهذه المادة بعد.</div>')+
 `<button class="btn" onclick="practice('${id}')" ${d.questions.length?'':'disabled'}>⚡ ابدأ التدريب (${d.questions.length} سؤال)</button>`}
async function unit(id,i){const u=(await data(id)).units[i];head(u.title);
 m.innerHTML=`<button class="btn o" onclick="subj('${id}')">← رجوع</button>`+(u.lessons.length?'':'<div class="note">هذا الدرس قيد الإعداد.</div>')+u.lessons.map(l=>`<h3>${esc(l.title)}</h3><div class="body">${esc(l.body)}</div>`).join('')}
let Q;function run(id,qs,timed){Q={id,qs,i:0,sc:0,wrong:[],timed,end:timed?Date.now()+qs.length*60000:0};show()}
async function practice(id){const d=await data(id);run(id,[...d.questions].sort(()=>Math.random()-.5).slice(0,20),false)}
function show(){if(Q.i>=Q.qs.length)return fin();const q=Q.qs[Q.i];head(sub(Q.id)?.name||'امتحان');
 m.innerHTML=`<div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><small>سؤال ${Q.i+1} من ${Q.qs.length} ${Q.timed?'• <b id="tm"></b>':''} ${q.sample?'<span class="tag">تجريبي</span>':''}</small><h3>${esc(q.q)}</h3>`+
 q.options.map((o,k)=>`<button class="opt" onclick="ans(${k})">${esc(o)}</button>`).join('')+'<div id="ex"></div>';tick()}
let T;function tick(){clearInterval(T);if(!Q.timed)return;T=setInterval(()=>{const r=Math.max(0,Q.end-Date.now()),e=$('#tm');if(e)e.textContent=Math.floor(r/60000)+':'+String(Math.floor(r/1000)%60).padStart(2,'0');if(!r){clearInterval(T);fin()}},500)}
window.ans=k=>{const q=Q.qs[Q.i],b=document.querySelectorAll('.opt');b.forEach((x,j)=>{x.disabled=true;if(j==q.answer)x.classList.add('ok')});
 if(k==q.answer)Q.sc++;else{b[k].classList.add('no');Q.wrong.push(q)}
 $('#ex').innerHTML=(q.explain?`<div class="note">${esc(q.explain)}</div>`:'')+`<button class="btn" onclick="Q.i++;show()">التالي</button>`};
function fin(){clearInterval(T);const p=Math.round(Q.sc/Q.qs.length*100);const h=hist();h.push({d:Date.now(),id:Q.id,sc:Q.sc,n:Q.qs.length});localStorage.hist=JSON.stringify(h.slice(-200));
 m.innerHTML=`<h2>النتيجة: ${Q.sc} / ${Q.qs.length} (${p}%)</h2><div class="bar"><i style="width:${p}%"></i></div><button class="btn" onclick="nav('home')">الرئيسية</button>`}
async function exam(){if(!track)return pick();head('امتحان تجريبي');
 m.innerHTML=`<h3>اختر مادة للامتحان (دقيقة لكل سؤال)</h3><div class="list">`+S.subjects.filter(s=>s.tracks.includes(track)).map(s=>`<button class="card" onclick="startExam('${s.id}')">${s.icon} ${s.name}</button>`).join('')+'</div>'}
async function startExam(id){const d=await data(id);if(!d.questions.length)return alert('لا توجد أسئلة لهذه المادة بعد');run(id,[...d.questions].sort(()=>Math.random()-.5).slice(0,30),true)}
function stats(){head('نتائجي');const h=hist();m.innerHTML=h.length?h.slice().reverse().map(x=>`<div class="card" style="margin-bottom:8px;text-align:right">${sub(x.id)?.name||''} — <b>${x.sc}/${x.n}</b> <small>${new Date(x.d).toLocaleDateString('ar-EG')}</small></div>`).join(''):'<div class="note">لا توجد نتائج بعد.</div>'}
S=INLINE.subjects;nav('home');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
